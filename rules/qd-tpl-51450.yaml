id: qd-tpl-51450
name: 吾爱破解
category: forum
icon: community
summary: 暂不支持（站点 WAF 拦截）
description: "任务地址：https://www.52pojie.cn/\n作用：每日签到。\n\n现状：**暂不支持自动化**，原因有两个，均已实测：\n1) 签到入口在 Discuz 任务系统（home.php?mod=task），而该路径被「知道创宇 WAF」的 JS 挑战保护——\n   任何非浏览器请求都会拿到一段混淆 JS（wzws-waf-cgi），必须执行 JS 才算得出通行\
  \ cookie，\n   纯 HTTP 请求无法通过（实测同一 Cookie 访问 forum.php 正常，访问 home.php?mod=task 一律被拦）。\n2) 首页另有「微信签到」，需要扫码，本身也不是接口能完成的。\n\n结论：这个站建议手动签到，或在浏览器里用脚本方案；不要放进本工具，否则每天都会失败一次。\n"
risk: high
