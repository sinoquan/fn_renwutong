id: qd-tpl-93245
name: 时光相册
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://web.everphoto.cn/api/auth
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [web.everphoto.cn]
fields:
  - key: password
    label: password
    type: password
    required: false
  - key: phone
    label: phone
    type: text
    required: false
  - key: token
    label: token
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://web.everphoto.cn/api/auth"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36"
      x-bigint-support: "false"
      content-type: "application/x-www-form-urlencoded; charset=UTF-8"
      accept: "*/*"
      origin: "https://web.everphoto.cn"
      referer: "https://web.everphoto.cn/"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: POST
    url: "https://api.everphoto.cn/users/self/checkin/v2"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36"
      x-bigint-support: "false"
      content-type: "application/x-www-form-urlencoded; charset=UTF-8"
      accept: "*/*"
      origin: "https://web.everphoto.cn"
      referer: "https://web.everphoto.cn/"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
      authorization: "Bearer {{token}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
