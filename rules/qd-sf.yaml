id: qd-sf
name: SF轻小说
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://api.sfacg.com/user/signInfo
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [api.sfacg.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: now_time
    label: now_time
    type: text
    required: false
  - key: ua
    label: ua
    type: text
    required: false
steps:
  - name: 任务
    method: PUT
    url: "https://api.sfacg.com/user/signInfo"
    headers:
      accept-charset: "UTF-8"
      cookie: "{{cookie}}"
      authorization: "Basic YW5kcm9pZHVzZXI6MWEjJDUxLXl0Njk7KkFjdkBxeHE="
      accept: "application/vnd.sfacg.api+json;version=1"
      user-agent: "{{ua}}"
  - name: 任务
    method: PUT
    url: "https://api.sfacg.com/user/readingtime"
    headers:
      accept-charset: "UTF-8"
      authorization: "Basic YW5kcm9pZHVzZXI6MWEjJDUxLXl0Njk7KkFjdkBxeHE="
      accept: "application/vnd.sfacg.api+json;version=1"
      user-agent: "{{ua}}"
      content-type: "application/json; charset=UTF-8"
  - name: 任务
    method: PUT
    url: "https://api.sfacg.com/user/tasks/5"
    headers:
      accept-charset: "UTF-8"
      authorization: "Basic YW5kcm9pZHVzZXI6MWEjJDUxLXl0Njk7KkFjdkBxeHE="
      accept: "application/vnd.sfacg.api+json;version=1"
      user-agent: "{{ua}}"
  - name: 任务
    method: PUT
    url: "https://api.sfacg.com/user/tasks/17"
    headers:
      accept-charset: "UTF-8"
      authorization: "Basic YW5kcm9pZHVzZXI6MWEjJDUxLXl0Njk7KkFjdkBxeHE="
      accept: "application/vnd.sfacg.api+json;version=1"
      user-agent: "{{ua}}"
  - name: 任务
    method: GET
    url: "https://api.sfacg.com/user?expand=welfareCoin"
    headers:
      accept-charset: "UTF-8"
      authorization: "Basic YW5kcm9pZHVzZXI6MWEjJDUxLXl0Njk7KkFjdkBxeHE="
      accept: "application/vnd.sfacg.api+json;version=1"
      user-agent: "{{ua}}"
  - name: 任务
    method: GET
    url: "https://api.sfacg.com/user/money"
    headers:
      accept-charset: "UTF-8"
      authorization: "Basic YW5kcm9pZHVzZXI6MWEjJDUxLXl0Njk7KkFjdkBxeHE="
      accept: "application/vnd.sfacg.api+json;version=1"
      user-agent: "{{ua}}"
check:
  notLogin: ["没有访问接口的权限|需要登录才能访问该资源|签到系统在每日凌晨0~1点之间进行维护,请您选在其他时间签到哦"]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:您今天已经签过到了,请明天再来", "regex:409", "regex:这个任务还没完成,快去加油完成吧", "regex:这个任务还没完成,快去加油完成吧"]
