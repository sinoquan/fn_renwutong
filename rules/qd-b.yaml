id: qd-b
name: B站每日综合任务
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://api.bilibili.com/x/web-interface/dynamic/region?pn=3&ps=12&rid=129
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [api.bilibili.com]
fields:
  - key: BV
    label: BV
    type: text
    required: false
  - key: bili_jct
    label: bili_jct
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://api.bilibili.com/x/web-interface/dynamic/region?pn=3&ps=12&rid=129"
    headers:
      Accept: "application/json, text/plain, */*"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/86.0.4240.198 Safari/537.36"
      Origin: "https://www.bilibili.com"
      Sec-Fetch-Site: "same-site"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://www.bilibili.com/"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: GET
    url: "https://www.bilibili.com/"
    headers:
      Cache-Control: "max-age=0"
      Upgrade-Insecure-Requests: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/86.0.4240.198 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Sec-Fetch-Site: "same-site"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-User: "?1"
      Sec-Fetch-Dest: "document"
      Accept-Language: "zh-CN,zh;q=0.9"
      Cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://api.bilibili.com/x/web-interface/share/add"
    headers:
      Accept: "application/json, text/plain, */*"
      User-Agent: "CFNetwork/1220.1 Darwin/20.3.0 os/ios model/iPhone XS Max mobi_app/iphone  osVer/14.4.2 network/2 channel/AppStore"
      Content-Type: "application/x-www-form-urlencoded"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Accept-Language: "zh-CN,zh;q=0.9"
      Cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://api.bilibili.com/x/click-interface/web/heartbeat"
    headers:
      Accept: "application/json, text/plain, */*"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/86.0.4240.198 Safari/537.36"
      Content-Type: "application/x-www-form-urlencoded"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Accept-Language: "zh-CN,zh;q=0.9"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://api.live.bilibili.com/xlive/web-ucenter/v1/sign/DoSign"
    headers:
      Accept: "application/json, text/plain, */*"
      User-Agent: "CFNetwork/1220.1 Darwin/20.3.0 os/ios model/iPhone XS Max mobi_app/iphone  osVer/14.4.2 network/2 channel/AppStore"
      Content-Type: "application/x-www-form-urlencoded"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Accept-Language: "zh-CN,zh;q=0.9"
      Cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://manga.bilibili.com/twirp/activity.v1.Activity/ClockIn"
    headers:
      Accept: "application/json, text/plain, */*"
      User-Agent: "CFNetwork/1220.1 Darwin/20.3.0 os/ios model/iPhone XS Max mobi_app/iphone  osVer/14.4.2 network/2 channel/AppStore"
      Content-Type: "application/x-www-form-urlencoded"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Accept-Language: "zh-CN,zh;q=0.9"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://api.bilibili.com/x/web-interface/nav"
    headers:
      Accept: "application/json, text/plain, */*"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/86.0.4240.198 Safari/537.36"
      Origin: "https://account.bilibili.com"
      Sec-Fetch-Site: "same-site"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Accept-Language: "zh-CN,zh;q=0.9"
      Cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://manga.bilibili.com/twirp/user.v1.User/GetCoupons"
    headers:
      User-Agent: "comic-universal/1303 CFNetwork/1220.1 Darwin/20.3.0 os/ios model/iPhone XS Max mobi_app/iphone_comic build/1303 osVer/14.4.2 network/2 channel/AppStore"
      Content-Type: "application/json; charset=utf-8"
      Origin: "manga.bilibili.com"
      Cookie: "{{cookie}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:https://b23.tv/", "regex:clockin clockin is duplicate"]
