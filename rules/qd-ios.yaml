id: qd-ios
name: 有道云笔记IOS端
category: tool
icon: community
summary: 每日任务
description: |
  任务地址：https://note.youdao.com/yws/mapi/user?method=checkin
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [note.youdao.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://note.youdao.com/yws/mapi/user?method=checkin"
    headers:
      Content-Type: "application/x-www-form-urlencoded"
      Accept: "*/*"
      Cookie: "{{cookie}}"
      User-Agent: "YNote/7.5.560 (iPhone; iOS 18.2.1; Scale/3.00)"
      Accept-Language: "zh-Hans-CN;q=1, en-CN;q=0.9, ja-CN;q=0.8, zh-Hant-CN;q=0.7"
  - name: 任务
    method: GET
    url: "https://cunchu.bmcx.com/web_system/bmcx_com_www/system/file/cunchu/get/?id=1&q={{space|urlencode}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
