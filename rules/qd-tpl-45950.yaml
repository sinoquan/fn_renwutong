id: qd-tpl-45950
name: 杉果游戏
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://auth.sonkwo.com/api/access_token.json?locale=js
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [auth.sonkwo.com]
fields:
  - key: auth
    label: auth
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://auth.sonkwo.com/api/access_token.json?locale=js"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36"
      Accept: "application/vnd.sonkwo.v1+json"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
      Origin: "https://www.sonkwo.com"
      DNT: "1"
      Referer: "https://www.sonkwo.com/sign_in?return_addr=%2F"
  - name: 任务
    method: POST
    url: "https://auth.sonkwo.com/api/me/clock_in.json?locale=js"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36"
      Accept: "application/vnd.sonkwo.v1+json"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
      Authorization: "Bearer {{auth|urlencode}}"
      Origin: "https://www.sonkwo.com"
      DNT: "1"
      Referer: "https://www.sonkwo.com/"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
  - name: 任务
    method: GET
    url: "https://auth.sonkwo.com/api/me.json?locale=js&sonkwo_version=1&sonkwo_client=web&q%5Bintroduction%5D=true&q%5Bbirthday%5D=true&q%5Bshow_steam_review%5D=true&q%5Blast_sign_in_at_timestamp%5D=true&q%5Blast_sign_in_ip%5D=true&q%5Bset_password%5D=true&q%5Bgender%5D=true&q%5Bemail_asterisks%5D=true&q%5Bphone_number_asterisks%5D=true&q%5Bcredential_num_asterisks%5D=true&q%5Bunmute_at_timestamp%5D=true&q%5Bpoint%5D%5Bxp%5D=true&q%5Bpoint%5D%5Bscore%5D=true&q%5Bpoint%5D%5Btasks%5D=true&q%5Bplatforms%5D%5Bshow_id%5D=true&q%5Bplatforms%5D%5Bkind%5D=true&q%5Bwallet%5D%5Bbalance%5D=true&q%5Bwallet%5D%5Bstatus%5D=true&q%5Bregion%5D=true&_={{time|urlencode}}"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36"
      Accept: "application/vnd.sonkwo.v1+json"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Authorization: "Bearer {{auth}}"
      Origin: "https://www.sonkwo.com"
      DNT: "1"
      Referer: "https://www.sonkwo.com/setting"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:greater_than"]
