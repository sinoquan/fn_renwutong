id: qd-mb
name: MB博客
category: tool
icon: community
summary: 每日任务
description: |
  任务地址：https://www.wenpblog.com/login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.wenpblog.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://www.wenpblog.com/login"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
      Accept: "application/json, text/javascript, */*; q=0.01"
      Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
      X-Requested-With: "XMLHttpRequest"
      sec-ch-ua-mobile: "?0"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://www.wenpblog.com"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://www.wenpblog.com/login.html"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: POST
    url: "https://www.wenpblog.com/signIn"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
      Accept: "application/json, text/javascript, */*; q=0.01"
      X-Requested-With: "XMLHttpRequest"
      sec-ch-ua-mobile: "?0"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://www.wenpblog.com"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://www.wenpblog.com/bbs/1.html"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: GET
    url: "https://www.wenpblog.com/person.html "
    headers:
      sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
      Accept: "application/json, text/javascript, */*; q=0.01"
      X-Requested-With: "XMLHttpRequest"
      sec-ch-ua-mobile: "?0"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://www.wenpblog.com"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://www.wenpblog.com/store.html"
      Accept-Language: "zh-CN,zh;q=0.9"
check:
  notLogin: ["登录失败！请检查输入是否正确！"]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:欢迎回来！"]
