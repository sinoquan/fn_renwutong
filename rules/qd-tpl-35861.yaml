id: qd-tpl-35861
name: 文心一格
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://yige.baidu.com/api/t2p/points/task_complete?t={{time}}&appname=pc&ptask_type=6
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [yige.baidu.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: time
    label: time
    type: text
    required: false
steps:
  - name: 任务
    method: GET
    url: "https://yige.baidu.com/api/t2p/points/task_complete?t={{time}}&appname=pc&ptask_type=6"
    headers:
      Cookie: "{{cookie}}"
      Referer: "https://yige.baidu.com/personal/center"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/118.0.0.0 Safari/537.36"
  - name: 任务
    method: GET
    url: "https://yige.baidu.com/api/t2p/points/account_balance?t={{time}}&appname=pc&need_detail=1"
    headers:
      Cookie: "{{cookie}}"
      Referer: "https://yige.baidu.com/personal/center"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/118.0.0.0 Safari/537.36"
check:
  notLogin: ["need login", "need login"]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:already signed"]
