id: qd-v2ex
name: V2EX
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.v2ex.com/
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.v2ex.com]
fields:
