id: qd-steamtools
name: SteamTools论坛
category: forum
icon: community
summary: 每日任务
description: |
  任务地址：https://bbs.steamtools.net/plugin.php?id=dc_signin:sign&infloat=yes&handlekey=sign&inajax=1&ajaxtarget=fwin_content_sign
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [bbs.steamtools.net]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: formhash
    label: formhash
    type: text
    required: false
steps:
  - name: 任务
    method: GET
    url: "https://bbs.steamtools.net/plugin.php?id=dc_signin:sign&infloat=yes&handlekey=sign&inajax=1&ajaxtarget=fwin_content_sign"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36"
      Referer: "https://bbs.steamtools.net/"
      Cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://bbs.steamtools.net/plugin.php?id=dc_signin:sign&inajax=1"
    headers:
      Origin: "https://bbs.steamtools.net"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36"
      Referer: "https://bbs.steamtools.net/"
  - name: 任务
    method: GET
    url: "https://bbs.steamtools.net/plugin.php?id=dc_signin"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36"
      Referer: "https://bbs.steamtools.net/"
check:
  notLogin: ["您尚未登录", "您尚未登录"]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
