id: qd-arctime
name: ArcTime字幕平台
category: other
icon: community
summary: 每日任务
description: |
  任务地址：http://m.arctime.cn/home/user/login_save.html
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [m.arctime.cn]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "http://m.arctime.cn/home/user/login_save.html"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:85.0) Gecko/20100101 Firefox/85.0"
      Accept: "application/json, text/javascript, */*; q=0.01"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
      X-Requested-With: "XMLHttpRequest"
      Origin: "http://m.arctime.cn"
      DNT: "1"
      Referer: "http://m.arctime.cn/home/user/login.html"
  - name: 任务
    method: POST
    url: "http://m.arctime.cn/home/ucenter/attendance.html"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:85.0) Gecko/20100101 Firefox/85.0"
      Accept: "application/json, text/javascript, */*; q=0.01"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      X-Requested-With: "XMLHttpRequest"
      Origin: "http://m.arctime.cn"
      DNT: "1"
      Referer: "http://m.arctime.cn/home/ucenter/index.html"
  - name: 任务
    method: GET
    url: "http://m.arctime.cn/home/ucenter/index.html"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:85.0) Gecko/20100101 Firefox/85.0"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      DNT: "1"
      Upgrade-Insecure-Requests: "1"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
