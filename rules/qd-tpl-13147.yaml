id: qd-tpl-13147
name: 阡陌居
category: forum
icon: community
summary: 每日任务
description: '任务地址：https://www.1000qm.vip/plugin.php?id=dsu_paulsign%3Asign

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- www.1000qm.vip
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
- key: formhash
  label: formhash
  type: text
  required: false
steps:
- name: 任务
  method: GET
  url: https://www.1000qm.vip/plugin.php?id=dsu_paulsign%3Asign
  headers:
    Pragma: no-cache
    Cache-Control: no-cache
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/143.0.0.0 Safari/537.36 Edg/143.0.0.0
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    Referer: https://www.1000qm.vip/
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
    Cookie: '{{cookie}}'
- name: 打开签到页
  method: GET
  url: https://www.1000qm.vip/plugin.php?id=dsu_paulsign:sign
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.9
    Referer: https://www.1000qm.vip/
    Cookie: '{{cookie}}'
  capture:
    formhash: formhash=([0-9a-fA-F]{8})
- name: 提交签到
  method: GET
  url: https://www.1000qm.vip/plugin.php?id=dsu_paulsign%3Asign&operation=qiandao&qdxq=kx&infloat=1&inajax=1&formhash={{formhash|urlencode}}
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
    Accept: '*/*'
    Accept-Language: zh-CN,zh;q=0.9
    X-Requested-With: XMLHttpRequest
    Referer: https://www.1000qm.vip/plugin.php?id=dsu_paulsign:sign
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.1000qm.vip/home.php?mod=task&do=apply&id=1
  headers:
    Pragma: no-cache
    Cache-Control: no-cache
