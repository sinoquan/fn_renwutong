id: qd-dji
name: DJI大疆社区
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://bbs.dji.com/api/v2/users/login-info?device=desktop&t={{ multiply(timestamp('float'), 1000)|int }}
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [bbs.dji.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: uid
    label: uid
    type: text
    required: false
  - key: uuid
    label: uuid
    type: text
    required: false
steps:
  - name: 任务
    method: GET
    url: "https://bbs.dji.com/api/v2/users/login-info?device=desktop&t={{ multiply(timestamp('float'), 1000)|int }}"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      Accept: "application/json, text/plain, */*"
      Referer: "https://bbs.dji.com/"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://bbs.dji.com/api/v2/home/paulsigns/user?device=desktop&t={{ multiply(timestamp('float'), 1000)|int }}"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      Accept: "application/json, text/plain, */*"
      Referer: "https://bbs.dji.com/"
      Cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://bbs.dji.com/api/v2/home/paulsigns/sign?device=desktop"
    headers:
      Origin: "https://bbs.dji.com"
      Referer: "https://bbs.dji.com/"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      Accept: "application/json, text/plain, */*"
      Content-Type: "application/x-www-form-urlencoded"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://bbs.dji.com/pro/user-center?uid={{uid}}&uuid={{uuid}}&do=thread"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Referer: "https://bbs.dji.com/"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://bbs.dji.com/api/v2/forum/thread/list?device=desktop&channel_slug=home-square-all&limit=10&offset=10&sort_type=latest_posts"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      Accept: "application/json, text/plain, */*"
      Referer: "https://bbs.dji.com/"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://bbs.dji.com/pro/user-center?uid={{author_uids[int(loop_index0)]}}&uuid={{author_uuids[int(loop_index0)]}}"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Referer: "https://bbs.dji.com/"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://bbs.dji.com/api/v2/users/login-info?device=desktop&t={{ multiply(timestamp('float'), 1000)|int }}"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      Accept: "application/json, text/plain, */*"
      Referer: "https://bbs.dji.com/"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://bbs.dji.com/api/v2/users/credits/logs?device=desktop&page=1&page_size=20"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      Accept: "application/json, text/plain, */*"
      Referer: "https://bbs.dji.com/"
      Cookie: "{{cookie}}"
check:
  notLogin: ["\"item\":\\s*null|您需要先登录", "您需要先登录", "您需要先登录才能继续本操作", "您需要先登录才能继续本操作", "您需要先登录才能继续本操作", "\"item\":\\s*null|您需要先登录", "\"item\":\\s*null|您需要先登录"]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:\"item\":\\s*\\{", "regex:\"signed\":\\s*(true|false)", "regex:\"items\":\\s*\\[", "regex:\"item\":\\s*\\{", "regex:\"list\":\\s*\\["]
