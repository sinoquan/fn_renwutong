id: qd-app
name: 联想智选app
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://uss.lenovomm.com/authen/1.2/tgt/user/get?{{logintype|urlencode}}={{account|urlencode}}
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [uss.lenovomm.com]
fields:
  - key: baseinfo
    label: baseinfo
    type: text
    required: false
  - key: imei
    label: imei
    type: text
    required: false
  - key: lenovo_sso
    label: lenovo_sso
    type: text
    required: false
  - key: sessionid
    label: sessionid
    type: text
    required: false
  - key: token
    label: token
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://uss.lenovomm.com/authen/1.2/tgt/user/get?{{logintype|urlencode}}={{account|urlencode}}"
    headers:
      Accept: "*/*"
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "LenovoClub/283 CFNetwork/1126 Darwin/19.5.0"
      Accept-Language: "zh-cn"
  - name: 任务
    method: GET
    url: "https://uss.lenovomm.com/authen/1.2/st/get?lpsutgt={{lpsutgt|urlencode}}&source=ios%3Alenovo%3Aclub%3A4.1.0&lang=zh-CN&realm=club.lenovo.com.cn"
    headers:
      Accept: "*/*"
      Accept-Language: "zh-cn"
      User-Agent: "LenovoClub/283 CFNetwork/1126 Darwin/19.5.0"
  - name: 任务
    method: GET
    url: "https://api.club.lenovo.cn/users/getSessionID"
    headers:
      LenovoClub/283 (iPhone11,8; iOS 13.5.1; Scale/2.000000): "user_agent"
      baseinfo: "{{baseinfo}}"
      User-Agent: "LenovoClub/4.1.0 (iPhone; iOS 13.5.1; Scale/2.00)"
      token: ""
      unique: "{{imei}}"
      imei: "{{imei}}"
      Authorization: "Lenovosso {{lenovo_sso}}"
      Accept: "application/json"
      Accept-Language: "zh-Hans-CN;q=1"
  - name: 任务
    method: POST
    url: "https://api.club.lenovo.cn/common/signin/add"
    headers:
      User-Agent: "LenovoClub/4.1.0 (iPhone; iOS 13.5.1; Scale/2.00)"
      Accept: "application/json"
      Accept-Language: "zh-Hans-CN;q=1"
      Content-Type: "application/x-www-form-urlencoded"
      token: "{{token}}"
      unique: "{{imei}}"
      imei: "{{imei}}"
      Authorization: "Lenovo {{sessionid}}"
      baseinfo: "{{baseinfo}}"
      LenovoClub/283 (iPhone11,8; iOS 13.5.1; Scale/2.000000): "user_agent"
  - name: 任务
    method: POST
    url: "https://api.club.lenovo.cn/common/signin/challenge_task/join"
    headers:
      Accept: "application/json"
      Accept-Language: "zh-Hans-CN;q=1"
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "LenovoClub/4.1.0 (iPhone; iOS 13.5.1; Scale/2.00)"
      token: "{{token}}"
      unique: "{{imei}}"
      imei: "{{imei}}"
      Authorization: "Lenovo {{sessionid}}"
      baseinfo: "{{baseinfo}}"
      LenovoClub/283 (iPhone11,8; iOS 13.5.1; Scale/2.000000): "user_agent"
  - name: 任务
    method: GET
    url: "https://api.club.lenovo.cn/common/signin/challenge_task/task_list"
    headers:
      Accept: "application/json"
      Accept-Language: "zh-Hans-CN;q=1"
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "LenovoClub/4.1.0 (iPhone; iOS 13.5.1; Scale/2.00)"
      token: "{{token}}"
      unique: "{{imei}}"
      imei: "{{imei}}"
      Authorization: "Lenovo {{sessionid}}"
      baseinfo: "{{baseinfo}}"
      LenovoClub/283 (iPhone11,8; iOS 13.5.1; Scale/2.000000): "user_agent"
  - name: 任务
    method: GET
    url: "https://api.club.lenovo.cn/common/signin/signin_cal?end_day=20200801&start_day=20200801"
    headers:
      baseinfo: "{{baseinfo}}"
      User-Agent: "LenovoClub/4.1.0 (iPhone; iOS 13.5.1; Scale/2.00)"
      token: "{{token}}"
      unique: "{{imei}}"
      imei: "{{imei}}"
      Authorization: "Lenovo {{sessionid}}"
      LenovoClub/283 (iPhone11,8; iOS 13.5.1; Scale/2.000000): "user_agent"
      Accept: "application/json"
      Accept-Language: "zh-Hans-CN;q=1"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
