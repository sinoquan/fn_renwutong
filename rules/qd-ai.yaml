id: qd-ai
name: 边界AI
category: tool
icon: community
summary: 每日任务
description: |
  任务地址：https://ai1foo.com/api/v1/user/login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [ai1foo.com]
fields:
  - key: access_token
    label: access_token
    type: text
    required: false
  - key: id
    label: id
    type: text
    required: false
  - key: password
    label: password
    type: password
    required: false
  - key: token
    label: token
    type: text
    required: false
  - key: username
    label: username
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://ai1foo.com/api/v1/user/login"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
      Content-Type: "application/json"
      sec-ch-ua-mobile: "?0"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      app-name: "bianjie"
      sec-ch-ua-platform: "\"Windows\""
      Accept: "*/*"
      Origin: "https://ai1foo.com"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://ai1foo.com/login"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: POST
    url: "https://api.ai1foo.com/api/v2/user/signin/do"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
      sec-ch-ua-mobile: "?0"
      access-token: "{{access_token}}"
      app-name: "bianjie"
      Content-Type: "application/json"
      Accept: "application/json, text/plain, */*"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      uid: "{{id}}"
      token: "{{token}}"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://ai1foo.com"
      Sec-Fetch-Site: "same-site"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://ai1foo.com/signIn"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: POST
    url: "https://api.ai1foo.com/api/v1/user/points"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
      sec-ch-ua-mobile: "?0"
      access-token: "{{access_token}}"
      app-name: "bianjie"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      Accept: "application/json, text/plain, */*"
      uid: "{{id}}"
      token: "{{token}}"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://ai1foo.com"
      Sec-Fetch-Site: "same-site"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://ai1foo.com/console/pointslog"
      Accept-Language: "zh-CN,zh;q=0.9"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:ok"]
