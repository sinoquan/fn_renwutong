id: qd-tool-lu
name: tool.lu在线工具
category: tool
icon: community
summary: 每日任务
description: '任务地址：https://id.tool.lu/sign

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- id.tool.lu
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://id.tool.lu/sign
  headers:
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    Referer: https://tool.lu/
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://id.tool.lu/credits
  headers:
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    Referer: https://id.tool.lu/profile
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
check:
  notLogin:
  - Redirecting to https://id.tool.lu/login
  already:
  - 已签到
  - 已经签到
  - 今日已签到
  success:
  - regex:退出
