id: qd-glados
name: glados
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://{{domain}}/api/user/checkin
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: ["{{domain}}"]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: domain
    label: domain
    type: text
    required: false
  - key: token
    label: token
    type: text
    required: false
steps:
  - name: 任务
    method: POST
    url: "https://{{domain}}/api/user/checkin"
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64; rv:140.0) Gecko/20100101 Firefox/140.0"
      Accept: "application/json, text/plain, */*"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Content-Type: "application/json;charset=utf-8"
      Cookie: "{{cookie}}"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=0"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
  - name: 任务
    method: GET
    url: "https://{{domain}}/api/user/points"
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64; rv:140.0) Gecko/20100101 Firefox/140.0"
      Accept: "application/json, text/plain, */*"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Cookie: "{{cookie}}"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
