id: qd-tpl-16599
name: 小米运动
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://api-user.huami.com/registrations/+86{{username}}/tokens
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [api-user.huami.com]
fields:
  - key: app_token
    label: app_token
    type: text
    required: false
  - key: code
    label: code
    type: text
    required: false
  - key: data_json
    label: data_json
    type: text
    required: false
  - key: password
    label: password
    type: password
    required: false
  - key: userid
    label: userid
    type: text
    required: false
  - key: username
    label: username
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://api-user.huami.com/registrations/+86{{username}}/tokens"
    headers:
      Content-Type: "application/x-www-form-urlencoded;charset=UTF-8"
      User-Agent: "MiFit/5.5.1 (iPad; iOS 15.1; Scale/2.00)"
  - name: 任务
    method: POST
    url: "https://account.huami.com/v2/client/login"
    headers:
      Content-Type: "application/x-www-form-urlencoded;charset=UTF-8"
      User-Agent: "MiFit/5.5.1 (iPad; iOS 15.1; Scale/2.00)"
  - name: 任务
    method: GET
    url: "https://tptm.hd.mi.com/gettimestamp"
  - name: 任务
    method: GET
    url: "https://account-cn.huami.com/v1/client/app_tokens?app_name=com.xiaomi.hm.health&dn=api-user.huami.com%2Capi-mifit.huami.com%2Capp-analytics.huami.com&login_token={{login_token|urlencode}}"
    headers:
      User-Agent: "Dalvik/2.1.0 (Linux; U; Android 9; MI 6 MIUI/20.6.18)"
  - name: 任务
    method: POST
    url: "https://api-mifit-cn.huami.com/v1/data/band_data.json?=&t={{t|urlencode}}"
    headers:
      apptoken: "{{app_token}}"
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "MiFit/5.5.1 (iPad; iOS 15.1; Scale/2.00)"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:303"]
