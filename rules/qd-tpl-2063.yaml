id: qd-tpl-2063
name: 远景论坛_账号版
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://i.pcbeta.com/member.php?mod=logging&action=login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [i.pcbeta.com]
fields:
  - key: formhash
    label: formhash
    type: text
    required: false
  - key: username
    label: username
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://i.pcbeta.com/member.php?mod=logging&action=login"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/96.0.4664.45 Safari/537.36"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: POST
    url: "https://i.pcbeta.com/member.php?mod=logging&action=login&loginsubmit=yes&frommessage=&loginhash={{loginhash|urlencode}}&inajax=1"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      upgrade-insecure-requests: "1"
      origin: "https://i.pcbeta.com"
      content-type: "application/x-www-form-urlencoded"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/96.0.4664.45 Safari/537.36"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      referer: "https://i.pcbeta.com/home.php?mod=task"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: GET
    url: "https://i.pcbeta.com/home.php?mod=task"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/96.0.4664.45 Safari/537.36"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
