id: qd-tpl-78916
name: 魅族社区
category: forum
icon: community
summary: 每日任务
description: '任务地址：https://bbs.meizu.cn/

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.1
updatedAt: '2026-11-26'
allowedHosts:
- bbs.meizu.cn
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://bbs.meizu.cn/
  headers:
    Cache-Control: max-age=0
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/55.0.2883.87 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8
    Cookie: '{{cookie}}'
    If-None-Match: W/"5aa56ea1-1b3ca"
    If-Modified-Since: Sun, 11 Mar 2018 18:00:01 GMT
  capture:
    formhash: (?:name="formhash"\s+value="|formhash=)([0-9a-f]{8,10})
- name: 任务
  method: POST
  url: https://bbs.meizu.cn/app.php?mod=signin&action=sign&formhash={{formhash|urlencode|urlencode}}
  headers:
    Accept: application/json, text/javascript, */*; q=0.01
    Origin: https://bbs.meizu.cn
    X-Requested-With: XMLHttpRequest
    User-Agent: Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/55.0.2883.87 Safari/537.36
    Referer: https://bbs.meizu.cn/
    Accept-Language: zh-CN,zh;q=0.8
    Cookie: '{{cookie}}'
check:
  notLogin:
  - 请登录
  - 登录后方可
  already:
  - 已签到
  - 已经签到
  - 今日已签到
  success:
  - 签到成功
  - 签到获得
  - 获得魔力
  - 获得积分
