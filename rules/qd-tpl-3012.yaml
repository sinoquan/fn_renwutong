id: qd-tpl-3012
name: 乐淘一番
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https:///{{domain}}/api/front/login/leyifan
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: ["{{domain}}"]
fields:
  - key: domain
    label: domain
    type: text
    required: false
  - key: email
    label: email
    type: text
    required: false
  - key: password
    label: password
    type: password
    required: false
  - key: token
    label: token
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https:///{{domain}}/api/front/login/leyifan"
    headers:
      system: "ios"
      Accept: "*/*"
      platform: "app"
      Content-Type: "application/json"
      User-Agent: "Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 Html5Plus/1.0 (Immersed/44) uni-app"
      lang: "chs"
      UseDomain: "leyifan"
  - name: 任务
    method: GET
    url: "https://{{domain}}/api/front/user/sign/integral"
    headers:
      system: "ios"
      Accept: "*/*"
      Authori-zation: "{{token}}"
      platform: "app"
      Content-Type: "application/json"
      User-Agent: "Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 Html5Plus/1.0 (Immersed/44) uni-app"
      lang: "chs"
      UseDomain: "leyifan"
  - name: 任务
    method: GET
    url: "https:///{{domain}}/api/front/integral/list?page=1&limit=10"
    headers:
      system: "ios"
      Accept: "*/*"
      Authori-zation: "{{token}}"
      platform: "app"
      Content-Type: "application/json"
      User-Agent: "Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 Html5Plus/1.0 (Immersed/44) uni-app"
      lang: "chs"
      UseDomain: "leyifan"
  - name: 任务
    method: POST
    url: "https:///{{domain}}/api/front/user/sign/user"
    headers:
      system: "ios"
      Accept: "*/*"
      Authori-zation: "{{token}}"
      platform: "app"
      Content-Type: "application/json"
      User-Agent: "Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 Html5Plus/1.0 (Immersed/44) uni-app"
      lang: "chs"
      UseDomain: "leyifan"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
