id: qd-aclink
name: Aclink云盘搜索
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://api.aclink.top/user/login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [api.aclink.top]
fields:
  - key: password
    label: password
    type: password
    required: false
  - key: username
    label: username
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://api.aclink.top/user/login"
    headers:
      accept: "application/json, text/plain, */*"
      accept-language: "zh-CN,zh;q=0.9"
      content-type: "application/json"
      origin: "https://www.aclink.top"
      priority: "u=1, i"
      referer: "https://www.aclink.top/"
      sec-ch-ua: "\"Not/A)Brand\";v=\"8\", \"Chromium\";v=\"126\", \"Google Chrome\";v=\"126\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      sec-fetch-dest: "empty"
      sec-fetch-mode: "cors"
      sec-fetch-site: "same-site"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  - name: 任务
    method: GET
    url: "https://api.aclink.top/user/qd"
    headers:
      accept: "application/json, text/plain, */*"
      accept-language: "zh-CN,zh;q=0.9"
      origin: "https://www.aclink.top"
      priority: "u=1, i"
      referer: "https://www.aclink.top/"
      sec-ch-ua: "\"Not/A)Brand\";v=\"8\", \"Chromium\";v=\"126\", \"Google Chrome\";v=\"126\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      sec-fetch-dest: "empty"
      sec-fetch-mode: "cors"
      sec-fetch-site: "same-site"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
