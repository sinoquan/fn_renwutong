id: qd-element3ds
name: element3ds
category: other
icon: community
summary: 每日任务
description: '任务地址：https://www.element3ds.com/

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- www.element3ds.com
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://www.element3ds.com/
  headers:
    Pragma: no-cache
    Cache-Control: no-cache
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.20 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.element3ds.com/home.php?mod=task&do=apply&id=6
  headers:
    Pragma: no-cache
    Cache-Control: no-cache
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.20 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
    Referer: https://www.element3ds.com/home.php?mod=task&item=new
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.element3ds.com/home.php?mod=task&do=draw&id=6
  headers:
    Pragma: no-cache
    Cache-Control: no-cache
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.20 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
    Referer: https://www.element3ds.com/home.php?mod=task&item=new
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.element3ds.com/home.php?mod=space&uid={{random(15000,21000,0)}}
  headers:
    Pragma: no-cache
    Cache-Control: no-cache
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.20 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://qiandao.wjf0214.vip/util/delay/3
  headers:
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.element3ds.com/home.php?mod=spacecp&ac=credit&op=base
  headers:
    Pragma: no-cache
    Cache-Control: no-cache
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.20 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    Referer: https://www.element3ds.com/home.php?mod=spacecp&ac=credit&op=log
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
    Cookie: '{{cookie}}'
check:
  notLogin:
  - 您需要先登录才能继续本操作
  already:
  - 已签到
  - 已经签到
  - 今日已签到
  success:
  - regex:302
  - regex:302
