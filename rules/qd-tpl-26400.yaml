id: qd-tpl-26400
name: 图牛助理
category: other
icon: community
summary: 每日任务
description: |
  任务地址：http://tuniu2.ps6b.com/api/v1/member/login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [tuniu2.ps6b.com]
fields:
  - key: access_token
    label: access_token
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "http://tuniu2.ps6b.com/api/v1/member/login"
    headers:
      Accept: "application/json, text/plain, */*"
      Access-Control-Allow-Headers: "X-Requested-With,Content-Type"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/88.0.4324.150 Safari/537.36"
      Access-Control-Allow-Methods: "OPTIONS, GET, POST, DELETE"
      Content-Type: "application/x-www-form-urlencoded"
      Origin: "file://"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: GET
    url: "http://tuniu2.ps6b.com/api/v1/member/sign-count"
    headers:
      Accept: "application/json, text/plain, */*"
      Authorization: "Bearer {{access_token}}"
      Access-Control-Allow-Headers: "X-Requested-With,Content-Type"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/88.0.4324.150 Safari/537.36"
      Access-Control-Allow-Methods: "OPTIONS, GET, POST, DELETE"
      Origin: "file://"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: POST
    url: "http://tuniu2.ps6b.com/api/v1/member/sign-in"
    headers:
      Accept: "application/json, text/plain, */*"
      Authorization: "Bearer {{access_token}}"
      Access-Control-Allow-Headers: "X-Requested-With,Content-Type"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/88.0.4324.150 Safari/537.36"
      Access-Control-Allow-Methods: "OPTIONS, GET, POST, DELETE"
      Content-Type: "application/x-www-form-urlencoded"
      Origin: "file://"
      Accept-Language: "zh-CN,zh;q=0.9"
check:
  notLogin: ["登录失败"]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
