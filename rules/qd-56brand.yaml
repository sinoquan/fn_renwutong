id: qd-56brand
name: 56brand我来网
category: other
icon: community
summary: 每日任务
description: |
  任务地址：http://www.56brand.com/wp-json/jwt-auth/v1/token
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.56brand.com]
fields:
  - key: password
    label: password
    type: password
    required: false
  - key: token
    label: token
    type: text
    required: false
  - key: username
    label: username
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "http://www.56brand.com/wp-json/jwt-auth/v1/token"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      Accept: "application/json, text/plain, */*"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.20 Safari/537.36"
      Content-Type: "application/x-www-form-urlencoded"
      Origin: "http://www.56brand.com"
      Referer: "http://www.56brand.com"
      Accept-Language: "zh-CN,zh;q=0.9,zh-TW;q=0.8"
  - name: 任务
    method: POST
    url: "http://www.56brand.com/wp-json/b2/v1/getUserMission"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      Accept: "application/json, text/plain, */*"
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.20 Safari/537.36"
      Origin: "http://www.56brand.com"
      Referer: "http://www.56brand.com/"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Authorization: "Bearer {{token}}"
  - name: 任务
    method: POST
    url: "http://www.56brand.com/wp-json/b2/v1/userMission"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      Accept: "application/json, text/plain, */*"
      Authorization: "Bearer {{token}}
"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.20 Safari/537.36"
      Content-Type: "application/x-www-form-urlencoded"
      Origin: "http://www.56brand.com"
      Referer: "http://www.56brand.com/"
      Accept-Language: "zh-CN,zh;q=0.9,zh-TW;q=0.8"
  - name: 任务
    method: POST
    url: "http://www.56brand.com/wp-json/b2/v1/getUserInfo"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      Accept: "application/json, text/plain, */*"
      Authorization: "Bearer {{token}}"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.20 Safari/537.36"
      Content-Type: "application/x-www-form-urlencoded"
      Origin: "http://www.56brand.com"
      Referer: "http://www.56brand.com/"
      Accept-Language: "zh-CN,zh;q=0.9,zh-TW;q=0.8"
