id: qd-tpl-16227
name: 致美化
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://zhutix.com/wp-json/b2/v1/getRecaptcha
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [zhutix.com]
fields:
  - key: Authorization
    label: Authorization
    type: text
    required: false
  - key: token
    label: token
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://zhutix.com/wp-json/b2/v1/getRecaptcha"
    headers:
      Accept: "application/json, text/plain, */*"
      Origin: "https://zhutix.com"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36"
      Content-Type: "application/x-www-form-urlencoded"
      Referer: "https://zhutix.com/"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: POST
    url: "https://zhutix.com/wp-json/jwt-auth/v1/token"
    headers:
      Accept: "application/json, text/plain, */*"
      Origin: "https://zhutix.com"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36"
      Content-Type: "application/x-www-form-urlencoded"
      Referer: "https://zhutix.com/"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: POST
    url: "https://zhutix.com/wp-json/b2/v1/getUserMission"
    headers:
      Accept: "application/json, text/plain, */*"
      Origin: "https://zhutix.com"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36"
      Referer: "https://zhutix.com/"
      Accept-Language: "zh-CN,zh;q=0.9"
      Authorization: "Bearer {{Authorization}}"
  - name: 任务
    method: POST
    url: "https://zhutix.com/wp-json/b2/v1/userMission"
    headers:
      Accept: "application/json, text/plain, */*"
      Origin: "https://zhutix.com"
      Authorization: "Bearer {{Authorization}}"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36"
      Referer: "https://zhutix.com/"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: POST
    url: "https://zhutix.com/wp-json/b2/v1/getUserInfo"
    headers:
      Accept: "application/json, text/plain, */*"
      Origin: "https://zhutix.com"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36"
      Content-Type: "application/x-www-form-urlencoded"
      Referer: "https://zhutix.com/"
      Accept-Language: "zh-CN,zh;q=0.9"
      Authorization: "Bearer {{Authorization}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
