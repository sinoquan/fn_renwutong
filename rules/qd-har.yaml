id: qd-har
name: 橘柚小站.HAR
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.juyovo.com/wp-json/jwt-auth/v1/token
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.juyovo.com]
fields:
  - key: token
    label: token
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://www.juyovo.com/wp-json/jwt-auth/v1/token"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"21\", \" Not;A Brand\";v=\"99\""
      Accept: "application/json, text/plain, */*"
      Content-Type: "application/x-www-form-urlencoded"
      sec-ch-ua-mobile: "?0"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://www.juyovo.com"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://www.juyovo.com/users/eyxvlomlm/settings"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: POST
    url: "https://www.juyovo.com/wp-json/b2/v1/userMission"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"21\", \" Not;A Brand\";v=\"99\""
      Accept: "application/json, text/plain, */*"
      Authorization: "Bearer {{token}}"
      sec-ch-ua-mobile: "?0"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://www.juyovo.com"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://www.juyovo.com/users/eyxvlomlm/settings"
      Accept-Language: "zh-CN,zh;q=0.9"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
