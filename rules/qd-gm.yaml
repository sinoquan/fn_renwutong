id: qd-gm
name: 如此玩GM基地论坛
category: other
icon: community
summary: 每日签到
description: |
  任务地址：https://www.ruciwan.com/
  作用：Discuz 每日签到插件（k_misign），先取 formhash 再提交签到，最后回签到页确认。
risk: none
version: 1.1.0
updatedAt: 2026-11-22
allowedHosts: [www.ruciwan.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  # ① 先打开首页建立会话。站点前面挂了一层轻量 WAF：
  #    第一次请求会返回 403 + 一段 window.location.href 跳转脚本并下发会话 cookie，
  #    引擎会自动带 cookie 重试一次，所以这里不需要额外处理。
  - name: 打开首页
    method: GET
    url: "https://www.ruciwan.com/"
    headers:
      Cache-Control: "max-age=0"
      Upgrade-Insecure-Requests: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9"
      Cookie: "{{cookie}}"

  # ② 打开签到页并抓 formhash。
  #    关键：formhash 要从页面内的链接里取（形如 ...&formhash=2d9a636d&...），
  #    首页不一定有；原来这版规则没抓，提交签到时 formhash 是空的，接口直接不认。
  - name: 打开签到页
    method: GET
    url: "https://www.ruciwan.com/plugin.php?id=k_misign:sign"
    headers:
      Cache-Control: "max-age=0"
      Upgrade-Insecure-Requests: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9"
      Referer: "https://www.ruciwan.com/"
      Cookie: "{{cookie}}"
    capture:
      formhash: 'formhash=([0-9a-fA-F]{8})'

  # ③ 提交签到（插件自己的 ajax 接口）
  - name: 提交签到
    method: GET
    url: "https://www.ruciwan.com/plugin.php?id=k_misign%3Asign&operation=qiandao&formhash={{formhash|urlencode}}&format=empty&inajax=1&ajaxtarget="
    headers:
      DNT: "1"
      X-Requested-With: "XMLHttpRequest"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36"
      Accept: "*/*"
      Accept-Language: "zh-CN,zh;q=0.9"
      Referer: "https://www.ruciwan.com/plugin.php?id=k_misign:sign"
      Cookie: "{{cookie}}"

  # ④ 回签到页确认结果（check 判据作用在这一步的页面上）
  - name: 确认签到结果
    method: GET
    url: "https://www.ruciwan.com/plugin.php?id=k_misign:sign"
    headers:
      Cache-Control: "max-age=0"
      Upgrade-Insecure-Requests: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9"
      Referer: "https://www.ruciwan.com/plugin.php?id=k_misign:sign"
      Cookie: "{{cookie}}"
check:
  notLogin: [请登录, 登录后方可, 你还没有登录]
  already: [已签到, 已经签到, 今日已签到, 今天已签到, 明天再来]
  success: [签到成功, 签到获得, 获得魔力, 获得积分, 恭喜]
