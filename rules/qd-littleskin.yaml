id: qd-littleskin
name: LittleSkin
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://littleskin.cn/auth/login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [littleskin.cn]
fields:
  - key: csrf
    label: csrf
    type: text
    required: false
  - key: password
    label: password
    type: password
    required: false
  - key: username
    label: username
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://littleskin.cn/auth/login"
    headers:
      origin: "https://littleskin.cn"
      referer: "https://littleskin.cn/auth/login"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36"
  - name: 任务
    method: POST
    url: "https://littleskin.cn/auth/login"
    headers:
      accept: "application/json"
      content-type: "application/json"
      origin: "https://littleskin.cn"
      referer: "https://littleskin.cn/auth/login"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36"
      x-csrf-token: "{{csrf}}"
  - name: 任务
    method: POST
    url: "https://littleskin.cn/user/sign"
    headers:
      origin: "https://littleskin.cn"
      referer: "https://littleskin.cn/user"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36"
      x-csrf-token: "{{csrf}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:\\\\u767b\\\\u5f55\\\\u6210\\\\u529f\\\\uff0c\\\\u6b22\\\\u8fce\\\\u56de\\\\u6765", "regex:\\\\u7b7e\\\\u5230\\\\u6210\\\\u529f\\\\uff0c\\\\u83b7\\\\u5f97\\\\u4e86 .* \\\\u79ef\\\\u5206"]
