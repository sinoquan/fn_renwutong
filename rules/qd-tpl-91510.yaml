id: qd-tpl-91510
name: 去盘搜
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https:///{{DOMAIN}}/v1/user/login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: ["{{domain}}"]
fields:
  - key: DOMAIN
    label: DOMAIN
    type: text
    required: false
  - key: password
    label: password
    type: password
    required: false
  - key: sj
    label: sj
    type: text
    required: false
  - key: token
    label: token
    type: text
    required: false
  - key: username
    label: username
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https:///{{DOMAIN}}/v1/user/login"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
      X-Path: "/v1/user/login"
      sec-ch-ua-mobile: "?0"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      Content-Type: "application/json"
      Accept: "application/json, text/plain, */*"
      X-Time: "{{sj}}"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://{{DOMAIN}}"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://{{DOMAIN}}/login"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: GET
    url: "https:///{{DOMAIN}}/auth/v1/user/check_in?token="
    headers:
      sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
      X-Path: "/auth/v1/user/check_in"
      sec-ch-ua-mobile: "?0"
      Authorization: "Bearer {{token}}"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      Accept: "application/json, text/plain, */*"
      X-Time: "{{sj}}"
      sec-ch-ua-platform: "\"Windows\""
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://{{DOMAIN}}/profile"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: GET
    url: "https://{{DOMAIN}}/auth/v1/user/info"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
      X-Path: "/auth/v1/user/info"
      sec-ch-ua-mobile: "?0"
      Authorization: "Bearer {{token}}"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      Accept: "application/json, text/plain, */*"
      X-Time: "{{sj}}"
      sec-ch-ua-platform: "\"Windows\""
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://{{DOMAIN}}/profile"
      Accept-Language: "zh-CN,zh;q=0.9"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
