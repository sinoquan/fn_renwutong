id: qd-smzdm-fixed
name: SMZDM_FIXED
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://user-api.smzdm.com/checkin
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [user-api.smzdm.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://user-api.smzdm.com/checkin"
    headers:
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "smzdm_android_V10.4.26 rv:866 (Redmi Note 3;Android10.0;zh)smzdmapp"
      Cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://user-api.smzdm.com/lottery/draw"
    headers:
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "smzdm_android_V10.4.26 rv:866 (Redmi Note 3;Android10.0;zh)smzdmapp"
      Cookie: "{{cookie}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:\"error_code\":\\s*\"0\"", "regex:\"error_code\":\\s*\"[0-9]\""]
