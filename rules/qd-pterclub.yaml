id: qd-pterclub
name: pterclub
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://pterclub.com/index.php
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [pterclub.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: id
    label: id
    type: text
    required: false
steps:
  - name: 任务
    method: GET
    url: "https://pterclub.com/index.php"
    headers:
      cache-control: "max-age=0"
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/86.0.4240.198 YaBrowser/20.11.3.138 Yowser/2.5 Safari/537.36"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      sec-fetch-site: "none"
      sec-fetch-mode: "navigate"
      sec-fetch-user: "?1"
      sec-fetch-dest: "document"
      accept-language: "zh-CN,zh-TW;q=0.9,zh;q=0.8,en;q=0.7"
      cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://pterclub.com/attendance-ajax.php"
    headers:
      cookie: "{{cookie}}"
      accept: "application/json, text/javascript, */*; q=0.01"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/86.0.4240.198 YaBrowser/20.11.3.138 Yowser/2.5 Safari/537.36"
      x-requested-with: "XMLHttpRequest"
      sec-fetch-site: "same-origin"
      sec-fetch-mode: "cors"
      sec-fetch-dest: "empty"
      referer: "https://pterclub.com/index.php"
      accept-language: "zh-CN,zh-TW;q=0.9,zh;q=0.8,en;q=0.7"
  - name: 任务
    method: GET
    url: "https://pterclub.com/mybonus.php"
    headers:
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6,ja;q=0.5"
      cache-control: "max-age=0"
      cookie: "{{cookie}}"
      referer: "https://pterclub.com/"
      sec-ch-ua: "\" Not;A Brand\";v=\"99\", \"Microsoft Edge\";v=\"103\", \"Chromium\";v=\"103\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      sec-fetch-dest: "document"
      sec-fetch-mode: "navigate"
      sec-fetch-site: "same-origin"
      sec-fetch-user: "?1"
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.5060.53 Safari/537.36 Edg/103.0.1264.37"
  - name: 任务
    method: GET
    url: "https://pterclub.com/userdetails.php?id={{id|urlencode}}"
    headers:
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6,ja;q=0.5"
      cache-control: "max-age=0"
      referer: "https://pterclub.com/"
      sec-ch-ua: "\" Not;A Brand\";v=\"99\", \"Microsoft Edge\";v=\"103\", \"Chromium\";v=\"103\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      sec-fetch-dest: "document"
      sec-fetch-mode: "navigate"
      sec-fetch-site: "same-origin"
      sec-fetch-user: "?1"
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.5060.66 Safari/537.36 Edg/103.0.1264.44"
check:
  notLogin: [请登录, 登录后方可]
