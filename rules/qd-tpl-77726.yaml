summary: 每日任务
description: '任务地址：https://bbs.kanxue.com/

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- bbs.kanxue.com
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
- key: uid
  label: uid
  type: text
  required: false
steps:
