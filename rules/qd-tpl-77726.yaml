    Sec-Fetch-Mode: cors
    Sec-Fetch-Dest: empty
    Referer: https://bbs.kanxue.com/
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://bbs.kanxue.com/user-is_signin.htm
