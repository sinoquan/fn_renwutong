id: qd-tpl-98295
name: 学犀牛中文网
category: tool
icon: community
summary: 每日任务
description: |
  任务地址：https://www.xuexiniu.com/plugin.php?id=k_misign%3Asign
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.xuexiniu.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://www.xuexiniu.com/plugin.php?id=k_misign%3Asign"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      Upgrade-Insecure-Requests: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.20 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Referer: "https://www.xuexiniu.com/"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://www.xuexiniu.com/plugin.php?id=k_misign%3Asign&operation=qiandao&formhash={{formhash|urlencode}}&format=empty&inajax=1&ajaxtarget=JD_sign"
    headers:
      Pragma: "no-cache"
      X-Requested-With: "XMLHttpRequest"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.20 Safari/537.36"
      Accept: "*/*"
      Referer: "https://www.xuexiniu.com/plugin.php?id=k_misign:sign"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: GET
    url: "https://www.xuexiniu.com/plugin.php?id=k_misign%3Asign"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      Upgrade-Insecure-Requests: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.20 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Referer: "https://www.xuexiniu.com/plugin.php?id=k_misign:sign"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
