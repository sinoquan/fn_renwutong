id: hdhome
name: HDHome
category: pt
icon: pt
summary: 每日任务
description: |
  任务地址：https://hdhome.org/attendance.php
  作用：调用该站点自己的任务接口完成每日任务。
risk: high
version: 1.0.1
updatedAt: 2026-11-20
allowedHosts: [hdhome.org]
fields:
  - key: UA
    label: UA
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://hdhome.org/attendance.php"
    headers:
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8,zh-TW;q=0.7"
      cache-control: "max-age=0"
      cookie: "{{cookie}}"
      referer: "https://hdhome.org/index.php"
      user-agent: "{{UA}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
