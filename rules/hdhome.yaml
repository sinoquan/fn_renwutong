id: hdhome
name: HDHome
category: pt
icon: pt
summary: 每日任务
description: '任务地址：https://hdhome.org/attendance.php

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: high
version: 1.1.2
updatedAt: '2026-11-24'
allowedHosts:
- hdhome.org
fields:
- key: UA
  label: UA
  type: text
  required: false
- key: cookie
  label: Cookie
  type: password
  required: true
defaultTask: checkin
tasks:
- key: checkin
  name: 每日签到
  type: checkin
  description: 打开任务页完成每日签到
  steps:
  - name: 任务
    method: GET
    url: https://hdhome.org/attendance.php
    headers:
      accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
      accept-language: zh-CN,zh;q=0.9,en;q=0.8,zh-TW;q=0.7
      cache-control: max-age=0
      cookie: '{{cookie}}'
      referer: https://hdhome.org/index.php
      user-agent: '{{UA}}'
  check:
    notLogin:
    - 请登录
    - 登录后方可
    already:
    - 已签到
    - 已经签到
    - 今日已签到
    success:
    - 签到成功
    - 签到获得
    - 获得魔力
    - 获得积分
- key: login
  name: 模拟登录
  type: login
  description: 先访问首页、停顿后再确认 Cookie 仍有效；失效会立刻提示你重填
  steps:
  - name: 检查登录态
    method: GET
    url: https://hdhome.org/index.php
    headers:
      cookie: '{{cookie}}'
  user-agent: '{{UA}}'
  check:
    notLogin:
    - takelogin.php
    - 登录 / 注册
    - 你需要启用cookies
    - 请登录
    - 登录后方可
    success:
    - logout.php
    - 退出登录
    - 个人中心
    - 我的账户
    - 我的资料
    reward:
    - (?:魔力值|魔力)[^0-9]{0,12}([0-9,]+(?:\.[0-9]+)?)
