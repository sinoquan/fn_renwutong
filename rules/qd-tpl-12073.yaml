id: qd-tpl-12073
name: 中图网(原中国图书网)
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.bookschina.com/ashx/SignInApi.ashx
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.bookschina.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://www.bookschina.com/ashx/SignInApi.ashx"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"119\", \"Not?A_Brand\";v=\"24\""
      DNT: "1"
      sec-ch-ua-mobile: "?0"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36"
      Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
      Accept: "application/json, text/javascript, */*; q=0.01"
      X-Requested-With: "XMLHttpRequest"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://www.bookschina.com"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://www.bookschina.com/vieworder/default.aspx"
      Accept-Language: "zh-CN,zh;q=0.9"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://www.bookschina.com/vieworder/default.aspx"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"119\", \"Not?A_Brand\";v=\"24\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      Upgrade-Insecure-Requests: "1"
      DNT: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-User: "?1"
      Sec-Fetch-Dest: "document"
      Referer: "https://www.bookschina.com/"
      Accept-Language: "zh-CN,zh;q=0.9"
      Cookie: "{{cookie}}
"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
