id: zhuque
name: "朱雀"
category: pt
icon: pt
summary: 签到 + 模拟登录
description: |
  站点地址：https://zhuque.in/
  作用：签到、模拟登录。
  签到：调用站点自带的签到页 /attendance.php。
  来源：站点清单取自 PT-depiler（MIT 许可），规则按本项目模板生成。
  探活 2026-11-21：探活通过
risk: high
version: 1.2.0
updatedAt: 2026-11-24
allowedHosts: [zhuque.in]
manualOnly: true
manualHint: "朱雀 需要手工签到：站点是纯前端应用（要 JavaScript 渲染），程序拿不到签到接口。点站点地址打开后自己签一下。"
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
defaultTask: checkin
tasks:
  - key: checkin
    name: 签到
    type: checkin
    description: 打开签到页完成每日签到
    steps:
      - name: 签到
        method: GET
        url: "https://zhuque.in/attendance.php"
        headers:
          cookie: "{{cookie}}"
          referer: "https://zhuque.in/"
    check:
      notLogin: ["takelogin.php", "login.php"]
      already: ["已签到", "已经签到", "今日已签到"]
      success: ["签到成功", "签到获得", "获得魔力", "获得积分"]
  - key: login
    name: 模拟登录
    type: login
    description: 访问首页确认 Cookie 仍有效；未登录会被重定向到登录页
    steps:
      - name: 检查登录态
        method: GET
        url: "https://zhuque.in/"
        headers:
          cookie: "{{cookie}}"
    check:
      notLogin: ["takelogin.php", "login.php?returnto", "你需要启用cookies"]
      success: ["logout.php", "退出登录", "个人中心", "我的账户", "我的资料"]
