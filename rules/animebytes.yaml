id: animebytes
name: "AnimeBytes"
category: pt
icon: pt
summary: 签到 + 模拟登录 + 保活
description: |
  站点地址：https://animebytes.tv/
  作用：签到、模拟登录、保活。
  签到：调用站点自带的签到页 /attendance.php。
  来源：站点清单取自 PT-depiler（MIT 许可），规则按本项目模板生成。
  探活 2026-11-21：探活通过
risk: high
version: 1.1.0
updatedAt: 2026-11-21
allowedHosts: [animebytes.tv]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
defaultTask: checkin
tasks:
  - key: checkin
    name: 签到
    type: checkin
    description: 打开签到页完成每日签到
    steps:
      - name: 签到
        method: GET
        url: "https://animebytes.tv/attendance.php"
        headers:
          cookie: "{{cookie}}"
          referer: "https://animebytes.tv/"
    check:
      notLogin: ["takelogin.php", "login.php"]
      already: ["已签到", "已经签到", "今日已签到"]
      success: ["签到成功", "签到获得", "获得魔力", "获得积分"]
  - key: login
    name: 模拟登录
    type: login
    description: 访问首页确认 Cookie 仍有效；未登录会被重定向到登录页
    steps:
      - name: 检查登录态
        method: GET
        url: "https://animebytes.tv/"
        headers:
          cookie: "{{cookie}}"
    check:
      notLogin: ["takelogin.php", "login.php?returnto", "你需要启用cookies"]
      success: ["logout.php", "退出登录", "个人中心", "我的账户", "我的资料"]
  - key: keepalive
    name: 保活
    type: keepalive
    description: 只定时访问首页留活跃记录，不判定登录态
    steps:
      - name: 访问首页
        method: GET
        url: "https://animebytes.tv/"
        headers:
          cookie: "{{cookie}}"
    check: {}
