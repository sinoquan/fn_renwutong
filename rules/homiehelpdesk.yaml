id: homiehelpdesk
name: "HomieHelpdesk"
category: pt
icon: pt
summary: 保活
description: |
  站点地址：https://homiehelpdesk.net/
  作用：保活。
  注意：本站不是 NexusPHP，登录后的页面无法离线验证，因此不提供「模拟登录」，只做保活与签到。
  来源：站点清单取自 PT-depiler（MIT 许可），规则按本项目模板生成。
  探活 2026-11-21：探活通过，但站点有 Cloudflare 盾，纯请求可能被拦
risk: high
version: 1.1.0
updatedAt: 2026-11-21
allowedHosts: [homiehelpdesk.net]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
defaultTask: keepalive
tasks:
  - key: keepalive
    name: 保活
    type: keepalive
    description: 只定时访问首页留活跃记录，不判定登录态
    steps:
      - name: 访问首页
        method: GET
        url: "https://homiehelpdesk.net/"
        headers:
          cookie: "{{cookie}}"
    check: {}
