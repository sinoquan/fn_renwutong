id: qd-tpl-33670
name: 云原神
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://api-cloudgame.mihoyo.com/hk4e_cg_cn/wallet/wallet/get
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [api-cloudgame.mihoyo.com]
fields:
  - key: device_id
    label: device_id
    type: text
    required: false
  - key: id
    label: id
    type: text
    required: false
  - key: token
    label: token
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://api-cloudgame.mihoyo.com/hk4e_cg_cn/wallet/wallet/get"
    headers:
      x-rpc-combo_token: "{{token}}"
      x-rpc-client_type: "2"
      x-rpc-app_version: "3.2.0"
      x-rpc-sys_version: "11"
      x-rpc-channel: "mihoyo"
      x-rpc-device_id: "{{device_id}}"
      x-rpc-app_id: "1953439974"
      Referer: "https://app.mihoyo.com"
      x-rpc-vendor_id: "1"
      User-Agent: "okhttp/4.9.0"
  - name: 任务
    method: GET
    url: "https://api-cloudgame.mihoyo.com/hk4e_cg_cn/gamer/api/listNotifications?status=NotificationStatusUnread&type=NotificationTypePopup&is_sort=true"
    headers:
      x-rpc-combo_token: "{{token}}"
      x-rpc-client_type: "2"
      x-rpc-app_version: "3.2.0"
      x-rpc-sys_version: "11"
      x-rpc-channel: "mihoyo"
      x-rpc-device_id: "{{device_id}}"
      x-rpc-app_id: "1953439974"
      Referer: "https://app.mihoyo.com"
      x-rpc-vendor_id: "1"
      User-Agent: "okhttp/4.9.0"
  - name: 任务
    method: POST
    url: "https://api-cloudgame.mihoyo.com/hk4e_cg_cn/gamer/api/ackNotification"
    headers:
      x-rpc-combo_token: "{{token}}"
      x-rpc-client_type: "2"
      x-rpc-app_version: "3.2.0"
      x-rpc-sys_version: "11"
      x-rpc-channel: "mihoyo"
      x-rpc-device_id: "{{device_id}}"
      x-rpc-app_id: "1953439974"
      Referer: "https://app.mihoyo.com"
      x-rpc-vendor_id: "1"
      User-Agent: "okhttp/4.9.0"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
