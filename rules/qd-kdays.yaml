id: qd-kdays
name: KDays论坛
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://uc.kdays.net/sso/login/?client_id=kd.uc
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [uc.kdays.net]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://uc.kdays.net/sso/login/?client_id=kd.uc"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Referer: "http://bbs2.kdays.net/index"
      DNT: "1"
      Upgrade-Insecure-Requests: "1"
  - name: 任务
    method: POST
    url: "https://uc.kdays.net/sso/login/authorize"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Content-Type: "application/x-www-form-urlencoded"
      Origin: "http://uc.kdays.net"
      DNT: "1"
      Referer: "http://uc.kdays.net//sso/login/?service=http%3A%2F%2Fbbs.kdays.net%2Findex"
      Upgrade-Insecure-Requests: "1"
  - name: 任务
    method: GET
    url: "https://bbs2.kdays.net//h/kduc?action=authorize&code={{location|urlencode}}&state=login&redirect_uri=https%3A%2F%2Fbbs.kdays.net%2F"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Referer: "http://uc.kdays.net//sso/login/?service=http%3A%2F%2Fbbs.kdays.net%2Findex"
      DNT: "1"
      Upgrade-Insecure-Requests: "1"
  - name: 任务
    method: GET
    url: "https://bbs2.kdays.net/h/task"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      DNT: "1"
      Referer: "https://bbs2.kdays.net/"
      Upgrade-Insecure-Requests: "1"
      Sec-Fetch-Dest: "document"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-User: "?1"
  - name: 任务
    method: POST
    url: "https://bbs2.kdays.net/h/task?action=check"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Content-Type: "application/x-www-form-urlencoded"
      Origin: "https://bbs2.kdays.net"
      DNT: "1"
      Referer: "https://bbs2.kdays.net/h/task"
      Upgrade-Insecure-Requests: "1"
      Sec-Fetch-Dest: "document"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-User: "?1"
  - name: 任务
    method: GET
    url: "https://bbs2.kdays.net/h/task"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      DNT: "1"
      Referer: "https://bbs2.kdays.net/h/task?action=check"
      Upgrade-Insecure-Requests: "1"
      Sec-Fetch-Dest: "document"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-Site: "same-origin"
  - name: 任务
    method: GET
    url: "https://bbs2.kdays.net/my/credit"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Referer: "http://bbs2.kdays.net/notify/list"
      DNT: "1"
      Upgrade-Insecure-Requests: "1"
      Cache-Control: "max-age=0"
check:
  notLogin: ["login_failed", "你还没有登录论坛"]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:302", "regex:302"]
