id: qd-tpl-91157
name: 恩山无线论坛
category: forum
icon: community
summary: 每日任务
description: |
  任务地址：https://www.right.com.cn/forum/plugin.php?id=erling_qd:sign_in
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.right.com.cn]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://www.right.com.cn/forum/plugin.php?id=erling_qd:sign_in"
    headers:
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Referer: "https://www.right.com.cn/forum/"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36 Edg/154.0.0.0"
      Cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://www.right.com.cn/forum/plugin.php?id=erling_qd:action&action=sign"
    headers:
      Accept: "application/json, text/javascript, */*; q=0.01"
      Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
      X-Requested-With: "XMLHttpRequest"
      Referer: "https://www.right.com.cn/forum/plugin.php?id=erling_qd:sign_in"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36 Edg/154.0.0.0"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://www.right.com.cn/forum/plugin.php?id=erling_qd:sign_in"
    headers:
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Referer: "https://www.right.com.cn/forum/"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36 Edg/154.0.0.0"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://www.right.com.cn/forum/home.php?mod=spacecp&ac=credit&op=base"
    headers:
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Referer: "https://www.right.com.cn/forum/"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36 Edg/154.0.0.0"
      Cookie: "{{cookie}}"
check:
  notLogin: ["登录.{0,10}恩山无线论坛", "您需要先登录"]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:var FORMHASH = '[0-9a-f]+'", "regex:\"success\"\\s*:\\s*true", "regex:erqd-continuous-days", "regex:恩山币"]
