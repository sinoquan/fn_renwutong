id: qd-tpl-60238
name: 精睿论坛
category: forum
icon: community
summary: 每日任务
description: '任务地址：https://bbs.vc52.cn/

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- bbs.vc52.cn
fields:
- key: fast
  label: fast
  type: text
  required: false
- key: formhash
  label: formhash
  type: text
  required: false
- key: password
  label: password
  type: password
  required: false
- key: ua
  label: ua
  type: text
  required: false
- key: username
  label: username
  type: text
  required: false
- key: xq
  label: xq
  type: text
  required: false
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://bbs.vc52.cn/
  headers:
    User-Agent: '{{ua}}'
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Referer: https://bbs.vc52.cn/
    Upgrade-Insecure-Requests: '1'
    Sec-Fetch-Dest: document
    Sec-Fetch-Mode: navigate
    Sec-Fetch-Site: same-origin
    Sec-Fetch-User: ?1
    Priority: u=0, i
    Pragma: no-cache
    Cache-Control: no-cache
    Cookie: '{{cookie}}'
- name: 任务
  method: POST
  url: https://bbs.vc52.cn/member.php?mod=logging&action=login&loginsubmit=yes&infloat=yes&lssubmit=yes&inajax=1
  headers:
    User-Agent: '{{ua}}'
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Content-Type: application/x-www-form-urlencoded
    Origin: https://bbs.vc52.cn
    Referer: https://bbs.vc52.cn/
    Upgrade-Insecure-Requests: '1'
    Sec-Fetch-Dest: iframe
    Sec-Fetch-Mode: navigate
    Sec-Fetch-Site: same-origin
    Sec-Fetch-User: ?1
    Priority: u=4
    Pragma: no-cache
    Cache-Control: no-cache
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://bbs.vc52.cn/plugin.php?id=zqlj_sign&sign={{sign|urlencode}}&ajax=yes&infloat=yes&handlekey=zqlj_sign&inajax=1&ajaxtarget=fwin_content_zqlj_sign
  headers:
    User-Agent: '{{ua}}'
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Referer: https://bbs.vc52.cn/
    Upgrade-Insecure-Requests: '1'
    Sec-Fetch-Dest: empty
    Sec-Fetch-Mode: cors
    Sec-Fetch-Site: same-origin
    Sec-Fetch-User: ?1
    Priority: u=0, i
    Pragma: no-cache
    Cache-Control: no-cache
    X-Requested-With: XMLHttpRequest
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://bbs.vc52.cn/plugin.php?id=zqlj_sign
  headers:
    User-Agent: '{{ua}}'
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Referer: https://bbs.vc52.cn/
    Upgrade-Insecure-Requests: '1'
    Sec-Fetch-Dest: document
    Sec-Fetch-Mode: navigate
    Sec-Fetch-Site: same-origin
    Sec-Fetch-User: ?1
    Priority: u=0, i
    Pragma: no-cache
    Cache-Control: no-cache
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://bbs.vc52.cn/dsu_paulsign-sign.html
  headers:
    User-Agent: '{{ua}}'
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Referer: https://bbs.vc52.cn/
    Upgrade-Insecure-Requests: '1'
    Sec-Fetch-Dest: document
    Sec-Fetch-Mode: navigate
    Sec-Fetch-Site: same-origin
    Sec-Fetch-User: ?1
    Priority: u=0, i
    Pragma: no-cache
    Cache-Control: no-cache
    Cookie: '{{cookie}}'
- name: 打开签到页
  method: GET
  url: https://bbs.vc52.cn/plugin.php?id=dsu_paulsign:sign
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.9
    Referer: https://bbs.vc52.cn/
    Cookie: '{{cookie}}'
  capture:
    formhash: formhash=([0-9a-fA-F]{8})
- name: 提交签到
  method: GET
  url: https://bbs.vc52.cn/plugin.php?id=dsu_paulsign%3Asign&operation=qiandao&qdxq=kx&infloat=1&inajax=1&formhash={{formhash|urlencode}}
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
    Accept: '*/*'
    Accept-Language: zh-CN,zh;q=0.9
    X-Requested-With: XMLHttpRequest
    Referer: https://bbs.vc52.cn/plugin.php?id=dsu_paulsign:sign
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://bbs.vc52.cn/home.php?mod=spacecp&ac=credit
  headers:
    User-Agent: '{{ua}}'
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    Referer: https://bbs.vc52.cn/dsu_paulsign-sign.html
    Upgrade-Insecure-Requests: '1'
    Sec-Fetch-Dest: document
    Sec-Fetch-Mode: navigate
    Sec-Fetch-Site: same-origin
    Priority: u=0, i
    Pragma: no-cache
    Cache-Control: no-cache
    Cookie: '{{cookie}}'
