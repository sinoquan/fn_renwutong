id: qd-tpl-44569
name: 龙的天空
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://api.lkong.com/api
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [api.lkong.com]
fields:
  - key: account
    label: account
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: password
    label: password
    type: password
    required: false
steps:
  - name: 任务
    method: POST
    url: "https://api.lkong.com/api"
    headers:
      Content-Type: "application/json"
  - name: 任务
    method: POST
    url: "https://api.lkong.com/api"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      sec-ch-ua: "\"Google Chrome\";v=\"93\", \" Not;A Brand\";v=\"99\", \"Chromium\";v=\"93\""
      accept: "*/*"
      content-type: "application/json"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://www.lkong.com"
      Referer: "https://www.lkong.com/"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://api.lkong.com/api"
    headers:
      Content-Type: "application/json"
      Cookie: "{{cookie}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
