id: qd-op-gg-lol
name: op.gg自动刷新LOL战绩
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.op.gg/summoners/jp/{{id|urlencode}}
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.op.gg]
fields:
  - key: summoner_id
    label: summoner_id
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://www.op.gg/summoners/jp/{{id|urlencode}}"
    headers:
      Accept: "application/json, text/plain, */*"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/113.0.0.0 Safari/537.36"
      Sec-GPC: "1"
      Accept-Language: "zh-CN,zh;q=0.6"
      Origin: "https://www.op.gg"
      Sec-Fetch-Site: "same-site"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
  - name: 任务
    method: POST
    url: "https://op.gg/api/v1.0/internal/bypass/summoners/jp/{{summoner_id}}/renewal"
    headers:
      Accept: "application/json, text/plain, */*"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/113.0.0.0 Safari/537.36"
      Sec-GPC: "1"
      Accept-Language: "zh-CN,zh;q=0.6"
      Origin: "https://www.op.gg"
      Sec-Fetch-Site: "same-site"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://www.op.gg/"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:Already renewed"]
