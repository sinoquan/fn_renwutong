id: qd-hdarea
name: HDarea高清视界
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.hdarea.co/sign_in.php
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.hdarea.co]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://www.hdarea.co/sign_in.php"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36"
      content-type: "application/x-www-form-urlencoded"
      accept: "*/*"
      origin: "https://www.hdarea.co"
      referer: "https://www.hdarea.co/index.php"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
      cookie: "{{cookie}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:请不要重复签到哦！"]
