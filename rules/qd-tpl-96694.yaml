id: qd-tpl-96694
name: 哔咔漫画
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.devglan.com/online-tools/hmac-sha256-online
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.devglan.com]
fields:
  - key: api_key
    label: api_key
    type: text
    required: false
  - key: api_secret
    label: api_secret
    type: text
    required: false
  - key: dg_token
    label: dg_token
    type: text
    required: false
  - key: nonce
    label: nonce
    type: text
    required: false
  - key: password
    label: password
    type: password
    required: false
  - key: punch_in
    label: punch_in
    type: text
    required: false
  - key: sign_in
    label: sign_in
    type: text
    required: false
  - key: time
    label: time
    type: text
    required: false
  - key: token
    label: token
    type: text
    required: false
  - key: username
    label: username
    type: text
    required: false
  - key: users_profile
    label: users_profile
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://www.devglan.com/online-tools/hmac-sha256-online"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/109.0.5410.0 Safari/537.36"
  - name: 任务
    method: POST
    url: "https://www.devglan.com/online-tools/hmac-sha256-online"
    headers:
      Content-Type: "application/json;charset=UTF-8"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/109.0.5410.0 Safari/537.36"
      Referer: "https://www.devglan.com/online-tools/hmac-sha256-online"
      Origin: "https://www.devglan.com"
      X-Dg-Token: "{{dg_token}}"
  - name: 任务
    method: POST
    url: "https://picaapi.picacomic.com/auth/sign-in"
    headers:
      api-key: "{{api_key}}"
      accept: "application/vnd.picacomic.com.v1+json"
      app-channel: "1"
      time: "{{time}}"
      nonce: "{{nonce}}"
      app-version: "2.2.1.3.3.4"
      app-uuid: "defaultUuid"
      image-quality: "original"
      app-platform: "android"
      app-build-version: "45"
      User-Agent: "okhttp/3.8.1"
      Content-Type: "application/json; charset=UTF-8"
      signature: "{{signature|lower}}"
  - name: 任务
    method: POST
    url: "https://www.devglan.com/online-tools/hmac-sha256-online"
    headers:
      Content-Type: "application/json;charset=UTF-8"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/109.0.5410.0 Safari/537.36"
      Referer: "https://www.devglan.com/online-tools/hmac-sha256-online"
      Origin: "https://www.devglan.com"
      X-Dg-Token: "{{dg_token}}"
  - name: 任务
    method: POST
    url: "https://picaapi.picacomic.com/users/punch-in"
    headers:
      api-key: "{{api_key}}"
      accept: "application/vnd.picacomic.com.v1+json"
      app-channel: "1"
      time: "{{time}}"
      nonce: "{{nonce}}"
      app-version: "2.2.1.3.3.4"
      app-uuid: "defaultUuid"
      image-quality: "original"
      app-platform: "android"
      app-build-version: "45"
      User-Agent: "okhttp/3.8.1"
      Content-Type: "application/json; charset=UTF-8"
      signature: "{{signature|lower}}"
      authorization: "{{token}}"
  - name: 任务
    method: POST
    url: "https://www.devglan.com/online-tools/hmac-sha256-online"
    headers:
      Content-Type: "application/json;charset=UTF-8"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/109.0.5410.0 Safari/537.36"
      Referer: "https://www.devglan.com/online-tools/hmac-sha256-online"
      Origin: "https://www.devglan.com"
      X-Dg-Token: "{{dg_token}}"
  - name: 任务
    method: GET
    url: "https://picaapi.picacomic.com/users/profile"
    headers:
      api-key: "{{api_key}}"
      accept: "application/vnd.picacomic.com.v1+json"
      app-channel: "1"
      time: "{{time}}"
      nonce: "{{nonce}}"
      app-version: "2.2.1.3.3.4"
      app-uuid: "defaultUuid"
      image-quality: "original"
      app-platform: "android"
      app-build-version: "45"
      User-Agent: "okhttp/3.8.1"
      Content-Type: "application/json; charset=UTF-8"
      signature: "{{signature|lower}}"
      authorization: "{{token}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:302", "regex:\"status\": \"ok\""]
