id: sbpt
name: "SBPT"
category: pt
icon: pt
summary: 保活
description: |
  站点地址：https://sbpt.link/
  作用：定时访问首页留存活跃记录（保号）。不做签到，也不判定登录态。
  来源：站点清单取自 PT-depiler（MIT 许可），规则按本项目模板生成。
  探活 2026-11-21：生成时未能连通（可能被墙/需要代理），站点恢复后本规则即可用
  注意：本站不是 NexusPHP，登录后的页面无法离线验证，因此只提供保活。
risk: high
version: 1.0.0
updatedAt: 2026-11-21
allowedHosts: [sbpt.link]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
defaultTask: keepalive
tasks:
  - key: keepalive
    name: 保活
    type: keepalive
    description: 只定时访问首页留活跃记录，不判定登录态
    steps:
      - name: 访问首页
        method: GET
        url: "https://sbpt.link/"
        headers:
          cookie: "{{cookie}}"
    check: {}
