id: dicmusic
name: DICMusic
category: pt
icon: pt
summary: 模拟登录（本站无签到，靠做种得积分）
description: '站点地址：https://dicmusic.com/

  作用：访问首页确认 Cookie 有效，并记录当前积分余额。

  说明：本站没有每日签到页（/attendance.php 返回 404，/bonus.php 是积分商城），积分靠做种获得，故不提供签到任务。

  '
risk: high
version: 1.3.0
updatedAt: '2026-11-24'
allowedHosts:
- dicmusic.com
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
defaultTask: login
tasks:
- key: login
  name: 模拟登录
  type: login
  description: 访问首页确认 Cookie 仍有效，并提取当前积分
  steps:
  - name: 检查登录态
    method: GET
    url: https://dicmusic.com/
    headers:
      cookie: '{{cookie}}'
  check:
    notLogin:
    - takelogin.php
    - login.php?returnto
    - 请登录
    success:
    - logout.php
    - 退出
    - User
    reward:
    - (?:積分|积分)[^0-9]{0,6}\(?([0-9,]+)\)?
