id: qd-rainpat
name: RainPat专利检索
category: tool
icon: community
summary: 每日任务
description: |
  任务地址：https://www.rainpat.com/Home/Vericode
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.rainpat.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://www.rainpat.com/Home/Vericode"
  - name: 任务
    method: POST
    url: "https://www.rainpat.com/User/AjaxLogin"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"21\", \" Not;A Brand\";v=\"99\""
      DNT: "1"
      sec-ch-ua-mobile: "?0"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36"
      Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
      Accept: "*/*"
      X-Requested-With: "XMLHttpRequest"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://www.rainpat.com"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://www.rainpat.com/User/Login"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: POST
    url: "https://www.rainpat.com/User/EverydaySignin"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"21\", \" Not;A Brand\";v=\"99\""
      Accept: "*/*"
      DNT: "1"
      X-Requested-With: "XMLHttpRequest"
      sec-ch-ua-mobile: "?0"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://www.rainpat.com"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://www.rainpat.com/User"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: GET
    url: "https://www.rainpat.com/User"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"21\", \" Not;A Brand\";v=\"99\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      Upgrade-Insecure-Requests: "1"
      DNT: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-User: "?1"
      Sec-Fetch-Dest: "document"
      Referer: "https://www.rainpat.com/Home"
      Accept-Language: "zh-CN,zh;q=0.9"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
