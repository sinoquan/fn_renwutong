id: qd-tpl-90770
name: 数码之家
category: other
icon: community
summary: 每日任务
description: '任务地址：https://www.mydigit.cn/plugin.php?id=k_misign:sign

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.1
updatedAt: '2026-11-26'
allowedHosts:
- www.mydigit.cn
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://www.mydigit.cn/plugin.php?id=k_misign:sign
  headers:
    Pragma: no-cache
    Cache-Control: no-cache
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.114 Safari/537.36 Edg/91.0.864.54
    Referer: https://www.mydigit.cn/home.php
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
    Cookie: '{{cookie}}'
    Upgrade-Insecure-Requests: '1'
  capture:
    formhash: (?:name="formhash"\s+value="|formhash=)([0-9a-f]{8,10})
- name: 任务
  method: GET
  url: https://www.mydigit.cn/plugin.php?id=k_misign:sign&operation=qiandao&format=empty&inajax=1&ajaxtarget=JD_sign&formhash={{formhash|urlencode}}
  headers:
    Pragma: no-cache
    Cache-Control: no-cache
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.114 Safari/537.36 Edg/91.0.864.54
    Referer: https://www.mydigit.cn/plugin.php?id=k_misign:sign
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
    Upgrade-Insecure-Requests: '1'
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.mydigit.cn/plugin.php?id=k_misign%3Asign
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.114 Safari/537.36 Edg/91.0.864.54
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    Referer: https://www.mydigit.cn/plugin.php?id=k_misign:sign
    Upgrade-Insecure-Requests: '1'
    Pragma: no-cache
    Cache-Control: no-cache
    Cookie: '{{cookie}}'
check:
  notLogin:
  - 登录
  already:
  - 已签到
  - 已经签到
  - 今日已签到
  success:
  - 签到成功
  - 签到获得
  - 获得魔力
  - 获得积分
