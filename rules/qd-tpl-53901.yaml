id: qd-tpl-53901
name: 百度网盘会员成长值任务
category: cloud
icon: community
summary: 每日任务
description: |
  任务地址：https://pan.baidu.com/rest/2.0/membership/level?app_id=250528&web=5&method=signin
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [pan.baidu.com]
fields:
  - key: cookies
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://pan.baidu.com/rest/2.0/membership/level?app_id=250528&web=5&method=signin"
    headers:
      Accept: "application/json, text/plain, */*"
      User-Agent: "Mozilla/5.0 (Linux; Android 11; Pixel 5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/90.0.4430.91 Mobile Safari/537.36"
      X-Requested-With: "XMLHttpRequest"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://pan.baidu.com/wap/svip/growth/task"
      Accept-Language: "zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7"
      Cookie: "{{cookies}}"
  - name: 任务
    method: GET
    url: "https://pan.baidu.com/act/v2/membergrowv2/getdailyquestion?app_id=250528&web=5"
    headers:
      Accept: "application/json, text/plain, */*"
      User-Agent: "Mozilla/5.0 (Linux; Android 11; Pixel 5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/90.0.4430.91 Mobile Safari/537.36"
      X-Requested-With: "XMLHttpRequest"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://pan.baidu.com/wap/svip/growth/task"
      Accept-Language: "zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7"
      Cookie: "{{cookies}}"
  - name: 任务
    method: GET
    url: "https://pan.baidu.com/act/v2/membergrowv2/answerquestion?app_id=250528&web=5&ask_id={{ask_id|urlencode}}&answer={{answer|urlencode}}"
    headers:
      Accept: "application/json, text/plain, */*"
      User-Agent: "Mozilla/5.0 (Linux; Android 11; Pixel 5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/90.0.4430.91 Mobile Safari/537.36"
      X-Requested-With: "XMLHttpRequest"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://pan.baidu.com/wap/svip/growth/task"
      Accept-Language: "zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7"
      Cookie: "{{cookies}}"
  - name: 任务
    method: GET
    url: "https://pan.baidu.com/rest/2.0/membership/user?app_id=250528&web=5&method=query"
    headers:
      Accept: "application/json, text/plain, */*"
      User-Agent: "Mozilla/5.0 (Linux; Android 11; Pixel 5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/90.0.4430.91 Mobile Safari/537.36"
      X-Requested-With: "XMLHttpRequest"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://pan.baidu.com/wap/svip/growth/task"
      Accept-Language: "zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7"
      Cookie: "{{cookies}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
