id: qd-tpl-75955
name: 影巢
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://{{domain}}/login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: ["{{domain}}"]
fields:
  - key: cf_clearance
    label: cf_clearance
    type: text
    required: false
  - key: domain
    label: domain
    type: text
    required: false
  - key: home_chunk
    label: home_chunk
    type: text
    required: false
  - key: login_chunk
    label: login_chunk
    type: text
    required: false
  - key: next_action_checkin
    label: next_action_checkin
    type: text
    required: false
  - key: next_action_login
    label: next_action_login
    type: text
    required: false
  - key: password
    label: password
    type: password
    required: false
  - key: ua
    label: ua
    type: text
    required: false
  - key: username
    label: username
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://{{domain}}/login"
    headers:
      Cookie: "cf_clearance={{cf_clearance}}"
      Origin: "https://{{domain}}"
      Referer: "https://{{domain}}/login"
      User-Agent: "{{ua}}"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8"
  - name: 任务
    method: GET
    url: "https://{{domain}}/_next/{{login_chunk}}"
    headers:
      Referer: "https://{{domain}}/login"
      User-Agent: "{{ua}}"
  - name: 任务
    method: POST
    url: "https://{{domain}}/login"
    headers:
      Content-Type: "text/plain;charset=UTF-8"
      Origin: "https://{{domain}}"
      Referer: "https://{{domain}}/login"
      User-Agent: "{{ua}}"
      Next-Action: "{{next_action_login}}"
      Accept: "text/x-component"
  - name: 任务
    method: GET
    url: "https://{{domain}}/"
    headers:
      Referer: "https://{{domain}}/"
      User-Agent: "{{ua}}"
  - name: 任务
    method: GET
    url: "https://{{domain}}/_next/{{home_chunk}}"
    headers:
      Referer: "https://{{domain}}/"
      User-Agent: "{{ua}}"
  - name: 任务
    method: POST
    url: "https://{{domain}}/"
    headers:
      Origin: "https://{{domain}}"
      Referer: "https://{{domain}}/"
      User-Agent: "{{ua}}"
      Content-Type: "text/plain;charset=UTF-8"
      Next-Action: "{{next_action_checkin}}"
  - name: 任务
    method: POST
    url: "https://{{domain}}/"
    headers:
      Origin: "https://{{domain}}"
      Referer: "https://{{domain}}/"
      User-Agent: "{{ua}}"
      Content-Type: "text/plain;charset=UTF-8"
      Next-Action: "{{next_action_checkin}}"
  - name: 任务
    method: GET
    url: "https://{{domain}}/manager/account"
    headers:
      Referer: "https://{{domain}}/"
      User-Agent: "{{ua}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:\"success\":true", "regex:你已经签到过了，明天再来吧", "regex:\"success\":true", "regex:你已经签到过了，明天再来吧"]
