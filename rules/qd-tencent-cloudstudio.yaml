id: qd-tencent-cloudstudio
name: tencent_cloudstudio
category: forum
icon: community
summary: 每日任务
description: |
  任务地址：https://cloudstudio.net/api/user/info
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [cloudstudio.net]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: xsrf
    label: xsrf
    type: text
    required: false
steps:
  - name: 任务
    method: GET
    url: "https://cloudstudio.net/api/user/info"
    headers:
      X-XSRF-TOKEN: "{{xsrf}}"
      Cookie: "{{cookie}}"
      X-Requested-With: "XMLHttpRequest"
  - name: 任务
    method: POST
    url: "https://cloudstudio.net/api/billing/activityTask/SIGN_IN_2025Q3/_reward"
    headers:
      X-XSRF-TOKEN: "{{xsrf}}"
      Cookie: "{{cookie}}"
      X-Requested-With: "XMLHttpRequest"
  - name: 任务
    method: GET
    url: "https://cloudstudio.net/api/billing/resource/package?pageNumber=0&pageSize=10"
    headers:
      X-XSRF-TOKEN: "{{xsrf}}"
      Cookie: "{{cookie}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
