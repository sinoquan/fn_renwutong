id: qd-fa
name: Fa米家
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://fmapp.chinafamilymart.com.cn/api/app/market/member/signin/sign
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [fmapp.chinafamilymart.com.cn]
fields:
  - key: blackBox
    label: blackBox
    type: text
    required: false
  - key: deviceId
    label: deviceId
    type: text
    required: false
  - key: token
    label: token
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://fmapp.chinafamilymart.com.cn/api/app/market/member/signin/sign"
    headers:
      Accept: "*/*"
      blackBox: "{{blackBox}}"
      fmVersion: "2.6.5"
      loginChannel: "app"
      os: "android"
      deviceId: "{{deviceId}}"
      token: "{{token}}"
      Content-Type: "application/json; charset=utf-8"
      User-Agent: "okhttp/4.7.2"
  - name: 任务
    method: POST
    url: "https://fmapp.chinafamilymart.com.cn/api/app/member/info"
    headers:
      Accept: "*/*"
      blackBox: "{{blackBox}}"
      fmVersion: "2.6.5"
      loginChannel: "app"
      os: "android"
      deviceId: "{{deviceId}}"
      token: "{{token}}"
      Content-Type: "application/json; charset=utf-8"
      User-Agent: "okhttp/4.7.2"
  - name: 任务
    method: POST
    url: "https://fmapp.chinafamilymart.com.cn/api/app/member/v1/mili/service/detail"
    headers:
      Accept: "*/*"
      blackBox: "{{blackBox}}"
      fmVersion: "2.6.5"
      loginChannel: "app"
      os: "android"
      deviceId: "{{deviceId}}"
      token: "{{token}}"
      Content-Type: "application/json; charset=utf-8"
      User-Agent: "okhttp/4.7.2"
check:
  notLogin: ["您的账号已在其它设备上登录，请重新登录"]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
