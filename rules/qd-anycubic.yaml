id: qd-anycubic
name: Anycubic
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.makeronline.com/api/user/integral/daily-checkin
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.makeronline.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: token
    label: token
    type: text
    required: false
steps:
  - name: 任务
    method: POST
    url: "https://www.makeronline.com/api/user/integral/daily-checkin"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
      sec-ch-ua-mobile: "?0"
      Authorization: "{{token}}"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      Content-Type: "application/json"
      Accept: "application/json, text/plain, */*"
      lang: "zh_CN"
      Cache-Control: "no-cache"
      timeZone: "Asia/Hong_Kong"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://www.makeronline.com"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://www.makeronline.com/zh/points/rules.html"
      Accept-Language: "zh-CN,zh;q=0.9"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://www.makeronline.com/api/user/integral/transactions?event=0&page=1&page_size=10"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
      sec-ch-ua-mobile: "?0"
      Authorization: "{{token}}"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      Content-Type: "application/json"
      Accept: "application/json, text/plain, */*"
      lang: "zh_CN"
      Cache-Control: "no-cache"
      timeZone: "Asia/Hong_Kong"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://www.makeronline.com"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://www.makeronline.com/zh/points/TransactionDetails.html"
      Accept-Language: "zh-CN,zh;q=0.9"
      Cookie: "{{cookie}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
