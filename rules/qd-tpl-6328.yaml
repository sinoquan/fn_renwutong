id: qd-tpl-6328
name: 心动日剧
category: other
icon: community
summary: 每日任务
description: |
  任务地址：http://www.doki8.com/wp-login.php
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.doki8.com]
fields:
  - key: passwd
    label: passwd
    type: password
    required: false
  - key: user
    label: user
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "http://www.doki8.com/wp-login.php"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      Upgrade-Insecure-Requests: "1"
      Origin: "http://www.doki8.com"
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/86.0.4240.198 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Referer: "http://www.doki8.com/wp-login.php?redirect_to=http%3A%2F%2Fwww.doki8.com%2Ftourist"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Cookie: "wordpress_test_cookie=WP+Cookie+check;"
  - name: 任务
    method: GET
    url: "http://www.doki8.com/members/{{user}}/profile/edit/group/1/"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:302"]
