id: qd-cnlang
name: Cnlang国语视界
category: other
icon: community
summary: 每日任务
description: '任务地址：https://cnlang.org/dsu_paulsign-sign.html

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- cnlang.org
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://cnlang.org/dsu_paulsign-sign.html
  headers:
    Cache-Control: max-age=0
    sec-ch-ua: '"Chromium";v="21", " Not;A Brand";v="99"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
    DNT: '1'
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: navigate
    Sec-Fetch-User: ?1
    Sec-Fetch-Dest: document
    Referer: https://cnlang.org/home.php?mod=spacecp&ac=avatar
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
- name: 打开签到页
  method: GET
  url: https://cnlang.org/plugin.php?id=dsu_paulsign:sign
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.9
    Referer: https://cnlang.org/
    Cookie: '{{cookie}}'
  capture:
    formhash: formhash=([0-9a-fA-F]{8})
- name: 提交签到
  method: GET
  url: https://cnlang.org/plugin.php?id=dsu_paulsign%3Asign&operation=qiandao&qdxq=kx&infloat=1&inajax=1&formhash={{formhash|urlencode}}
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
    Accept: '*/*'
    Accept-Language: zh-CN,zh;q=0.9
    X-Requested-With: XMLHttpRequest
    Referer: https://cnlang.org/plugin.php?id=dsu_paulsign:sign
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://cnlang.org/home.php?mod=spacecp&ac=credit&showcredit=1
  headers:
    Cache-Control: max-age=0
    sec-ch-ua: '"Chromium";v="21", " Not;A Brand";v="99"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
    DNT: '1'
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: navigate
    Sec-Fetch-User: ?1
    Sec-Fetch-Dest: document
    Referer: https://cnlang.org/home.php?mod=spacecp&ac=avatar
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
check:
  notLogin:
  - 请登录
  - 登录后方可
  already:
  - 已经签到
  - 今日已经签到
  - 请明天再来
  - 已签到
  success:
  - 签到成功
  - 恭喜你签到成功
  - 获得随机奖励
