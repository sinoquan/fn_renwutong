id: qd-moto17
name: Moto17摩托开源技术论坛
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://bbs.moto17.com/
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [bbs.moto17.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://bbs.moto17.com/"
    headers:
      Cache-Control: "max-age=0"
      sec-ch-ua: "\"Chromium\";v=\"119\", \"Not?A_Brand\";v=\"24\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      DNT: "1"
      Upgrade-Insecure-Requests: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-User: "?1"
      Sec-Fetch-Dest: "document"
      Referer: "https://bbs.moto17.com/home.php?mod=spacecp&ac=credit&op=rule"
      Accept-Language: "zh-CN,zh;q=0.9"
      Cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://bbs.moto17.com/plugin.php?id=dsu_paulsign%3Asign&operation=qiandao&infloat=1&inajax=1"
    headers:
      Cache-Control: "max-age=0"
      sec-ch-ua: "\"Chromium\";v=\"119\", \"Not?A_Brand\";v=\"24\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://bbs.moto17.com"
      DNT: "1"
      Upgrade-Insecure-Requests: "1"
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-User: "?1"
      Sec-Fetch-Dest: "iframe"
      Referer: "https://bbs.moto17.com/dsu_paulsign-sign.html"
      Accept-Language: "zh-CN,zh;q=0.9"
      Cookie: "{{cookie}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
