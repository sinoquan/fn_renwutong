id: qd-tpl-92510
name: 阅次元论坛
category: other
icon: community
summary: 每日任务
description: '任务地址：https://www.abooky.com/

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- www.abooky.com
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://www.abooky.com/
  headers:
    pragma: no-cache
    cache-control: no-cache
    upgrade-insecure-requests: '1'
    user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/94.0.4606.81 Safari/537.36
    accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    referer: https://www.abooky.com/
    accept-language: zh-CN,zh;q=0.9,en;q=0.8
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.abooky.com/plugin.php?id=k_misign%3Asign&operation=qiandao&format=button&formhash={{formhash|urlencode}}
  headers:
    pragma: no-cache
    cache-control: no-cache
    upgrade-insecure-requests: '1'
    user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/94.0.4606.81 Safari/537.36
    accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    referer: https://www.abooky.com/
    accept-language: zh-CN,zh;q=0.9,en;q=0.8
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.abooky.com/home.php?mod=spacecp&ac=credit&showcredit=1
  headers:
    pragma: no-cache
    cache-control: no-cache
    upgrade-insecure-requests: '1'
    user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/94.0.4606.81 Safari/537.36
    accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    referer: https://www.abooky.com/
    accept-language: zh-CN,zh;q=0.9,en;q=0.8
    Cookie: '{{cookie}}'
