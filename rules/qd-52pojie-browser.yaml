id: qd-52pojie-browser
name: 吾爱破解（浏览器）
category: forum
icon: community
summary: 社区每日任务（需浏览器过 JS 挑战）
description: "任务地址：https://www.52pojie.cn/forum.php\n作用：该站有 WAF 的 JS 挑战，纯请求会被挡。本规则用内置浏览器打开页面，\n     让挑战在真实浏览器里完成，再用渲染后的 HTML 做判定。\n前置：设置页需打开「浏览器能力」，且目标机已安装 chromium。\n"
risk: none
version: 0.1.1
updatedAt: '2026-11-24'
allowedHosts:
- www.52pojie.cn
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
  help: 登录站点后按 F12 → Network → 复制 Cookie 整串
defaultTask: checkin
tasks:
- key: checkin
  name: 每日签到
  type: checkin
  description: 读取论坛页的签到状态（实际签到动作被 WAF 验证码挡住，自动化做不了）
  steps:
  - name: 检查签到状态
    url: https://www.52pojie.cn/forum.php
    headers:
      Cookie: '{{cookie}}'
  check:
    notLogin:
    - 请 登录 后使用快捷导航
    - 没有帐号？
    - 注册[Register]
    - takelogin.php
    manual:
    - 领取今日签到奖励
    success:
    - 吾爱破解
- key: login
  name: 模拟登录
  type: login
  description: 访问首页确认 Cookie 是否仍有效（HTTP 实测可过创宇盾 WAF）
  steps:
  - name: 检查登录态
    url: https://www.52pojie.cn/index.php
    headers:
      Cookie: '{{cookie}}'
  check:
    notLogin:
    - 请 登录 后使用快捷导航
    - 没有帐号？
    - 注册[Register]
    - takelogin.php
    - 你需要启用cookies
    success:
    - action=logout
    reward:
    - (?:魔力值|魔力)[^0-9]{0,12}([0-9,]+(?:\.[0-9]+)?)
