id: qd-carpt
name: CarPT
category: other
icon: community
summary: 每日任务
description: '任务地址：https://carpt.net/attendance.php

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.3
updatedAt: '2026-11-25'
allowedHosts:
- carpt.net
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
defaultTask: checkin
tasks:
- key: checkin
  name: 每日签到
  type: checkin
  description: 打开任务页完成每日签到
  steps:
  - name: 任务
    method: GET
    url: https://carpt.net/attendance.php
    headers:
      accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
      accept-language: zh-CN,zh;q=0.9,en;q=0.8,zh-TW;q=0.7
      cache-control: max-age=0
      cookie: '{{cookie}}'
      referer: https://carpt.net/index.php
      sec-ch-ua: '" Not A;Brand";v="99", "Chromium";v="102", "Google Chrome";v="102"'
      sec-ch-ua-mobile: ?0
      sec-ch-ua-platform: '"Windows"'
      sec-fetch-dest: document
      sec-fetch-mode: navigate
      sec-fetch-site: same-origin
      sec-fetch-user: ?1
      upgrade-insecure-requests: '1'
      user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/102.0.5005.63 Safari/537.36
  check:
    notLogin:
    - 请登录
    - 登录后方可
    already:
    - 已签到
    - 已经签到
    - 今日已签到
    success:
    - 签到成功
    - 签到获得
    - 获得魔力
    - 获得积分
    reward:
    - 本次签到获得[\s\S]{0,80}?([0-9,]+(?:\.[0-9]+)?)
    - 本次簽到獲得[\s\S]{0,80}?([0-9,]+(?:\.[0-9]+)?)
    - 签到已得\s*([0-9,]+(?:\.[0-9]+)?)
    - 簽到已得\s*([0-9,]+(?:\.[0-9]+)?)
    - 签到成功[^\d]{0,40}?([0-9,]+(?:\.[0-9]+)?)\s*个
    - 本次獲得[\s\S]{0,60}?([0-9,]+(?:\.[0-9]+)?)
- key: login
  name: 模拟登录
  type: login
  description: 先访问首页、停顿后再确认 Cookie 仍有效；失效会立刻提示你重填
  steps:
  - name: 检查登录态
    method: GET
    url: https://carpt.net/index.php
    headers:
      cookie: '{{cookie}}'
  check:
    notLogin:
    - takelogin.php
    - 登录 / 注册
    - 你需要启用cookies
    - 请登录
    - 登录后方可
    success:
    - logout.php
    - 退出登录
    - 个人中心
    - 我的账户
    - 我的资料
