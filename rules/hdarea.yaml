id: hdarea
name: HDArea
category: pt
icon: pt
summary: 模拟登录
description: '站点地址：https://hdarea.club/

  作用：保活。

  注意：本站不是 NexusPHP，登录后的页面无法离线验证，因此不提供「模拟登录」，只做保活与签到。

  来源：站点清单取自 PT-depiler（MIT 许可），规则按本项目模板生成。

  探活 2026-11-21：生成时未能连通（可能被墙/需要代理），站点恢复后本规则即可用


  补充：首页有 JS 签到按钮（sign_in），但接口在受保护的外部 JS 里，纯请求无法调用，故只做保活与魔力记录。

  '
risk: high
version: 1.1.5
updatedAt: '2026-11-24'
allowedHosts:
- hdarea.club
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
defaultTask: login
tasks:
- key: login
  name: 模拟登录
  type: login
  description: 带 Cookie 访问一次站点；登录态失效会被识别出来
  steps:
  - name: 访问首页
    method: GET
    url: https://hdarea.club/
    headers:
      cookie: '{{cookie}}'
  check:
    reward:
    - (?:魔力值|魔力)[^0-9]{0,12}([0-9,]+(?:\.[0-9]+)?)
    success:
    - logout.php
    - 退出
    - 控制面板
    - 个人中心
    - 我的账户
    - 魔力值
    notLogin:
    - takelogin.php
    - login.php?returnto
    - 请登录
    - 登录 / 注册
