id: qd-tpl-28216
name: 再漫画
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://i.zaimanhua.com/lpi/v1/login/passwd?username={{ username |urlencode}}&passwd={{ md5(password) |urlencode}}
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [i.zaimanhua.com]
fields:
  - key: token
    label: token
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://i.zaimanhua.com/lpi/v1/login/passwd?username={{ username |urlencode}}&passwd={{ md5(password) |urlencode}}"
  - name: 任务
    method: POST
    url: "https://i.zaimanhua.com/lpi/v1/task/sign_in"
    headers:
      Authorization: "Bearer {{ token }}"
  - name: 任务
    method: POST
    url: "https://i.zaimanhua.com/lpi/v1/u_center/passport/message"
    headers:
      Authorization: "Bearer {{ token }}"
  - name: 任务
    method: GET
    url: "https://i.zaimanhua.com/lpi/v1/task/list"
    headers:
      Authorization: "Bearer {{ token }}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:\"errno\":0", "regex:\"errno\":(0|1)", "regex:\"errno\":0", "regex:\"errno\":0"]
