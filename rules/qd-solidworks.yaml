id: qd-solidworks
name: SolidWorks机械工程师网
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.swbbsc.com/
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.swbbsc.com]
fields:
  - key: formhash
    label: formhash
    type: text
    required: false
  - key: password
    label: password
    type: password
    required: false
  - key: user
    label: user
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://www.swbbsc.com/"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      Upgrade-Insecure-Requests: "1"
      Origin: "https://www.swbbsc.com"
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Referer: "https://www.swbbsc.com/home.php?mod=spacecp&ac=credit&op=base"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: POST
    url: "https://www.swbbsc.com/member.php?mod=logging&action=login&loginsubmit=yes&frommessage=&loginhash=LZJMK&inajax=1"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      Upgrade-Insecure-Requests: "1"
      Origin: "https://www.swbbsc.com"
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Referer: "https://www.swbbsc.com/home.php?mod=spacecp&ac=credit&op=base"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: GET
    url: "https://www.swbbsc.com/"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      Upgrade-Insecure-Requests: "1"
      Origin: "https://www.swbbsc.com"
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Referer: "https://www.swbbsc.com/home.php?mod=spacecp&ac=credit&op=base"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
check:
  notLogin: ["登录失败"]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:欢迎您回来"]
