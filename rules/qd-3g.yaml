id: qd-3g
name: 3G壁纸网
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.3gbizhi.com/api/user/getToken
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.1.0
updatedAt: 2026-11-20
allowedHosts: [www.3gbizhi.com]
fields:
  - key: name
    label: name
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
defaultTask: checkin
tasks:
  - key: checkin
    name: 每日签到
    type: checkin
    description: 打开任务页完成每日签到
    steps:
      - name: 任务
        method: POST
        url: "https://www.3gbizhi.com/api/user/getToken"
        headers:
          User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
          Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
          sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
          sec-ch-ua-platform: "\"Windows\""
          Accept-Language: "zh-CN,zh;q=0.9"
          Origin: "https://www.3gbizhi.com
    "
          Referer: "https://www.3gbizhi.com"
      - name: 任务
        method: POST
        url: "https://www.3gbizhi.com/api/user/login"
        headers:
          sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
          Accept: "application/json, text/javascript, */*; q=0.01"
          Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
          X-Requested-With: "XMLHttpRequest"
          User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
          sec-ch-ua-platform: "\"Windows\""
          Origin: "https://www.3gbizhi.com"
          Sec-Fetch-Site: "same-origin"
          Sec-Fetch-Mode: "cors"
          Sec-Fetch-Dest: "empty"
          Referer: "https://www.3gbizhi.com/"
          Accept-Language: "zh-CN,zh;q=0.9"
      - name: 任务
        method: POST
        url: "https://www.3gbizhi.com/api/user/setUserSignin"
        headers:
          sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
          Accept: "application/json, text/javascript, */*; q=0.01"
          X-Requested-With: "XMLHttpRequest"
          User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
          sec-ch-ua-platform: "\"Windows\""
          Origin: "https://www.3gbizhi.com"
          Sec-Fetch-Site: "same-origin"
          Sec-Fetch-Mode: "cors"
          Sec-Fetch-Dest: "empty"
          Referer: "https://www.3gbizhi.com/user/index"
          Accept-Language: "zh-CN,zh;q=0.9"
      - name: 任务
        method: GET
        url: "https://www.3gbizhi.com/api/user/getUserSignin"
        headers:
          sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
          Accept: "application/json, text/javascript, */*; q=0.01"
          X-Requested-With: "XMLHttpRequest"
          User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
          sec-ch-ua-platform: "\"Windows\""
          Sec-Fetch-Site: "same-origin"
          Sec-Fetch-Mode: "cors"
          Sec-Fetch-Dest: "empty"
          Referer: "https://www.3gbizhi.com/user/index"
          Accept-Language: "zh-CN,zh;q=0.9"
      - name: 任务
        method: GET
        url: "https://www.3gbizhi.com/user/{{name}}/mycollection"
        headers:
          Referer: "https://www.3gbizhi.com/"
          User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
    check:
      notLogin: ["请登录后再操作"]
      already: [已签到, 已经签到, 今日已签到]
      success: [签到成功, 签到获得, 获得魔力, 获得积分]

  - key: login
    name: 模拟登录
    type: login
    description: 先访问首页、停顿后再确认 Cookie 仍有效；失效会立刻提示你重填
    steps:
      - name: 检查登录态
        method: GET
        url: "https://www.3gbizhi.com/index.php"
        headers:
          cookie: "{{cookie}}"
    check:
      notLogin: [takelogin.php, 登录 / 注册, 你需要启用cookies, 请登录, 登录后方可]
      success: [logout.php, 退出登录, 个人中心, 我的账户, 我的资料]
  - key: keepalive
    name: 保活
    type: keepalive
    description: 只定时访问首页留活跃记录，不判定登录态；适合不想动账号的场景
    steps:
      - name: 访问首页
        method: GET
        url: "https://www.3gbizhi.com/index.php"
        headers:
          cookie: "{{cookie}}"
    check: {}