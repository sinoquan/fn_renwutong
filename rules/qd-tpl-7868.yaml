id: qd-tpl-7868
name: 芯幻
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https:///{{domian}}/api/session/login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: ["{{domian}}"]
fields:
  - key: account
    label: account
    type: text
    required: false
  - key: domian
    label: domian
    type: text
    required: false
  - key: password
    label: password
    type: password
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https:///{{domian}}/api/session/login"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:158.0) Gecko/20100101 Firefox/158.0"
      Accept: "application/json"
      Accept-Language: "zh-CN"
      Referer: "https://{{domian}}/login?redirect=%2F"
      content-type: "application/json"
      Origin: "https://{{domian}}"
      DNT: "1"
      Sec-GPC: "1"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=0"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
  - name: 任务
    method: POST
    url: "https:///{{domian}}/api/v1/users/me/signin"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:158.0) Gecko/20100101 Firefox/158.0"
      Accept: "application/json"
      Accept-Language: "zh-CN"
      Referer: "https://{{domian}}/login?redirect=%2F"
      DNT: "1"
      Sec-GPC: "1"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=4"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
  - name: 任务
    method: GET
    url: "https://{{domian}}/api/v1/users/me"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:158.0) Gecko/20100101 Firefox/158.0"
      Accept: "application/json"
      Accept-Language: "zh-CN"
      Referer: "https://{{domian}}/login?redirect=%2F"
      DNT: "1"
      Sec-GPC: "1"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=4"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
  - name: 任务
    method: GET
    url: "https:///{{domian}}/api/v1/users/me/signin"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:158.0) Gecko/20100101 Firefox/158.0"
      Accept: "application/json"
      Accept-Language: "zh-CN"
      Referer: "https://{{domian}}/login?redirect=%2F"
      DNT: "1"
      Sec-GPC: "1"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=4"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:message[\": ]{2,6}success", "regex:code[\": ]{2,6}0", "regex:signed[\": ]{2,6}false", "regex:code[\": ]{2,6}0", "regex:message[\": ]{3,6}success"]
