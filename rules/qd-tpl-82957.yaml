id: qd-tpl-82957
name: 王者营地
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://kohcamp.qq.com/operation/action/newsignin
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [kohcamp.qq.com]
fields:
  - key: signin_payload_for_raw_format
    label: signin_payload_for_raw_format
    type: text
    required: false
  - key: token
    label: token
    type: text
    required: false
  - key: userId
    label: userId
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://kohcamp.qq.com/operation/action/newsignin"
    headers:
      token: "{{token}}"
      userId: "{{userId}}"
      content-type: "application/json"
  - name: 任务
    method: POST
    url: "https://kohcamp.qq.com/operation/action/signinfo"
    headers:
      token: "{{token}}"
      userId: "{{userId}}"
      content-type: "application/json"
check:
  notLogin: ["登录态参数不全", "登录态失效，请重新登录"]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
