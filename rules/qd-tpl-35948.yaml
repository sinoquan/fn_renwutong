id: qd-tpl-35948
name: 初音的青葱
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://{{domain}}/
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: ["{{domain}}"]
fields:
  - key: domain
    label: domain
    type: text
    required: false
  - key: token
    label: token
    type: text
    required: false
  - key: ua
    label: ua
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://{{domain}}/"
    headers:
      User-Agent: "{{ua}}"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Upgrade-Insecure-Requests: "1"
      Sec-Fetch-Dest: "document"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-Site: "none"
      Sec-Fetch-User: "?1"
      Priority: "u=0, i"
  - name: 任务
    method: POST
    url: "https://{{domain}}/sign"
    headers:
      User-Agent: "{{ua}}"
      Accept: "application/json, text/plain, */*"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Content-Type: "application/x-www-form-urlencoded"
      Origin: "https://{{domain}}"
      Referer: "https://{{domain}}/"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=0"
  - name: 任务
    method: GET
    url: "https://{{domain}}/addJf"
    headers:
      User-Agent: "{{ua}}"
      Accept: "application/json, text/plain, */*"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      X-Auth-Token: "{{token}}"
      Referer: "https://{{domain}}/"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
  - name: 任务
    method: GET
    url: "https://{{domain}}/hunt"
    headers:
      User-Agent: "{{ua}}"
      Accept: "application/json, text/plain, */*"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      X-Auth-Token: "{{token}}"
      Referer: "https://{{domain}}/"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
  - name: 任务
    method: GET
    url: "https://{{domain}}/getVip"
    headers:
      User-Agent: "{{ua}}"
      Accept: "application/json, text/plain, */*"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      X-Auth-Token: "{{token}}"
      Referer: "https://{{domain}}/"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
