id: haidan
name: 海胆
category: pt
icon: pt
summary: 每日任务
description: |
  任务地址：https://www.haidan.cc/signin.php
  作用：调用该站点自己的任务接口完成每日任务。
risk: high
version: 1.1.0
updatedAt: 2026-11-20
allowedHosts: [www.haidan.cc]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
defaultTask: checkin
tasks:
  - key: checkin
    name: 每日签到
    type: checkin
    description: 打开任务页完成每日签到
    steps:
      - name: 任务
        method: GET
        url: "https://www.haidan.cc/signin.php"
        headers:
          accept: "*/*"
          cookie: "{{cookie}}"
          referer: "https://www.haidan.cc/index.php"
          x-requested-with: "XMLHttpRequest"
      - name: 任务
        method: GET
        url: "https://www.haidan.cc/index.php"
        headers:
          accept: "*/*"
          cookie: "{{cookie}}"
          referer: "https://www.haidan.cc/index.php"
          x-requested-with: "XMLHttpRequest"
    check:
      notLogin: [请登录, 登录后方可]
      already: [已签到, 已经签到, 今日已签到]
      success: ["regex:302", "regex:href=['\"]userdetails\\.php\\?id=\\d+['\"]"]

  - key: login
    name: 模拟登录
    type: login
    description: 先访问首页、停顿后再确认 Cookie 仍有效；失效会立刻提示你重填
    steps:
      - name: 检查登录态
        method: GET
        url: "https://www.haidan.cc/index.php"
        headers:
          cookie: "{{cookie}}"
    check:
      notLogin: [takelogin.php, 登录 / 注册, 你需要启用cookies, 请登录, 登录后方可]
      success: [logout.php, 退出登录, 个人中心, 我的账户, 我的资料]
  - key: keepalive
    name: 保活
    type: keepalive
    description: 只定时访问首页留活跃记录，不判定登录态；适合不想动账号的场景
    steps:
      - name: 访问首页
        method: GET
        url: "https://www.haidan.cc/index.php"
        headers:
          cookie: "{{cookie}}"
    check: {}