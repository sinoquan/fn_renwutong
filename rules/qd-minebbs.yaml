id: qd-minebbs
name: MineBBS我的世界中文论坛
category: forum
icon: community
summary: 每日任务
description: |
  任务地址：https://www.minebbs.com/
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.minebbs.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://www.minebbs.com/"
    headers:
      Cache-Control: "max-age=0"
      sec-ch-ua: "\"Chromium\";v=\"21\", \" Not;A Brand\";v=\"99\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      Upgrade-Insecure-Requests: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Sec-Fetch-Site: "none"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-User: "?1"
      Sec-Fetch-Dest: "document"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://www.minebbs.com/credits/clock"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"21\", \" Not;A Brand\";v=\"99\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36"
      Content-Type: "application/x-www-form-urlencoded"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Origin: "https://www.minebbs.com"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-User: "?1"
      Sec-Fetch-Dest: "document"
      Referer: "https://www.minebbs.com/"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://www.minebbs.com/account/"
    headers:
      Cache-Control: "max-age=0"
      sec-ch-ua: "\"Chromium\";v=\"21\", \" Not;A Brand\";v=\"99\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      Upgrade-Insecure-Requests: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-User: "?1"
      Sec-Fetch-Dest: "document"
      Referer: "https://www.minebbs.com/"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Cookie: "{{cookie}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:data-logged-in=\"true\"", "regex:今日签到已完成|您已经签到了", "regex:/logout/"]
