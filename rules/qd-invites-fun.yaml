id: qd-invites-fun
name: invites.fun_每日任务
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://invites.fun/
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [invites.fun]
fields:
  - key: csrf
    label: csrf
    type: text
    required: false
  - key: remember
    label: remember
    type: text
    required: false
  - key: session
    label: session
    type: text
    required: false
  - key: uid
    label: uid
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://invites.fun/"
    headers:
      Cookie: "flarum_remember={{remember}}"
      User-Agent: "{{ua|default('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36')}}"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: POST
    url: "https://invites.fun/api/checkin"
    headers:
      Accept: "application/json, text/javascript, */*; q=0.01"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Cookie: "flarum_remember={{remember}}{% if session %}; flarum_session={{session}}{% endif %}"
      Origin: "https://invites.fun"
      Referer: "https://invites.fun/"
      User-Agent: "{{ua|default('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36')}}"
      X-CSRF-Token: "{{csrf}}"
      X-Requested-With: "XMLHttpRequest"
  - name: 任务
    method: GET
    url: "https://invites.fun/api/users/{{uid}}"
    headers:
      Accept: "application/json, text/javascript, */*; q=0.01"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Cookie: "flarum_remember={{remember}}{% if session %}; flarum_session={{session}}{% endif %}"
      Referer: "https://invites.fun/"
      User-Agent: "{{ua|default('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36')}}"
      X-Requested-With: "XMLHttpRequest"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:\"userId\":[0-9]+"]
