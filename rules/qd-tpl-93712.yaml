id: qd-tpl-93712
name: 速蛙云
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://{{domain}}/api_mweb/user/checkin
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: ["{{domain}}"]
fields:
  - key: authorizationmweb
    label: authorizationmweb
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: domain
    label: domain
    type: text
    required: false
steps:
  - name: 任务
    method: PUT
    url: "https://{{domain}}/api_mweb/user/checkin"
    headers:
      accept: "application/json, text/plain, */*"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6"
      authorizationmweb: "{{authorizationmweb}}"
      cache-control: "no-cache"
      cookie: "{{cookie}}"
      origin: "https://{{domain}}"
      pragma: "no-cache"
      referer: "https://{{domain}}/m/home"
      sec-ch-ua: "\" Not A;Brand\";v=\"99\", \"Chromium\";v=\"100\", \"Microsoft Edge\";v=\"100\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      sec-fetch-dest: "empty"
      sec-fetch-mode: "cors"
      sec-fetch-site: "same-origin"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/100.0.4896.127 Safari/537.36 Edg/100.0.1185.50"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
