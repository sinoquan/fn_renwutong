id: mteam
name: "M-Team - TP"
category: pt
icon: pt
summary: 签到 + 模拟登录
description: |
  站点地址：https://kp.m-team.cc/ / https://zp.m-team.io/ / https://ob.m-team.cc/ / https://h5.m-team.cc/
  作用：签到、模拟登录。
  签到：调用站点自带的签到页 /attendance.php。
  来源：站点清单取自 PT-depiler（MIT 许可），规则按本项目模板生成。
  探活 2026-11-21：探活通过
risk: high
version: 1.3.1
updatedAt: 2026-11-24
allowedHosts: [kp.m-team.cc, zp.m-team.io, ob.m-team.cc, h5.m-team.cc]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
defaultTask: checkin
tasks:
  - key: checkin
    name: 签到
    type: checkin
    description: 打开签到页完成每日签到
    # 任务级人工：签到接口拿不到（纯前端渲染），只有这一条做不了；
    # 同站"模拟登录"照常执行。steps 保留作将来 manual 关闭时的回落，当前不会执行。
    manual: true
    manualHint: "签到这一步要人机验证或 JS 渲染，程序做不了。点站点地址打开后自己操作一次。"
    steps:
      - name: 签到
        method: GET
        url: "https://kp.m-team.cc/attendance.php"
        headers:
          cookie: "{{cookie}}"
          referer: "https://kp.m-team.cc/"
    check:
      notLogin: ["takelogin.php", "login.php"]
      already: ["已签到", "已经签到", "今日已签到"]
      success: ["签到成功", "签到获得", "获得魔力", "获得积分"]
  - key: login
    name: 模拟登录
    type: login
    description: 访问首页确认 Cookie 仍有效；未登录会被重定向到登录页
    steps:
      - name: 检查登录态
        method: GET
        url: "https://kp.m-team.cc/"
        headers:
          cookie: "{{cookie}}"
    check:
      notLogin: ["takelogin.php", "login.php?returnto", "你需要启用cookies"]
      success: ["logout.php", "退出登录", "个人中心", "我的账户", "我的资料"]
