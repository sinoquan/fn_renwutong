id: qd-52frp
name: 52frp
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.52frp.com/api/user/login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.52frp.com]
fields:
  - key: csrf_token
    label: csrf_token
    type: text
    required: false
  - key: password
    label: password
    type: password
    required: false
  - key: slider_token
    label: slider_token
    type: text
    required: false
  - key: token
    label: token
    type: text
    required: false
  - key: username
    label: username
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://www.52frp.com/api/user/login"
    headers:
      sec-ch-ua-platform: "\"Windows\""
      Accept-Language: "zh-CN"
      Accept: "application/json, text/plain, */*"
      sec-ch-ua: "\"Not A(Brand\";v=\"8\", \"Chromium\";v=\"132\", \"Google Chrome\";v=\"132\""
      Content-Type: "application/json"
      sec-ch-ua-mobile: "?0"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36"
      Origin: "https://www.52frp.com"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://www.52frp.com/user/"
  - name: 任务
    method: GET
    url: "https://www.52frp.com/api/user/slider-token"
    headers:
      sec-ch-ua-platform: "\"Windows\""
      Authorization: "Bearer {{token}}"
      Accept-Language: "zh-CN"
      Accept: "application/json, text/plain, */*"
      sec-ch-ua: "\"Not A(Brand\";v=\"8\", \"Chromium\";v=\"132\", \"Google Chrome\";v=\"132\""
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36"
      sec-ch-ua-mobile: "?0"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://www.52frp.com/user/"
  - name: 任务
    method: POST
    url: "https://www.52frp.com/api/user/sign"
    headers:
      sec-ch-ua-platform: "\"Windows\""
      Authorization: "Bearer {{token}}"
      X-CSRF-Token: "{{csrf_token}}"
      Accept-Language: "zh-CN"
      sec-ch-ua: "\"Not A(Brand\";v=\"8\", \"Chromium\";v=\"132\", \"Google Chrome\";v=\"132\""
      sec-ch-ua-mobile: "?0"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36"
      Accept: "application/json, text/plain, */*"
      Content-Type: "application/json"
      Origin: "https://www.52frp.com"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://www.52frp.com/user/"
  - name: 任务
    method: GET
    url: "https://www.52frp.com/api/user/sign/info"
    headers:
      sec-ch-ua-platform: "\"Windows\""
      Authorization: "Bearer {{token}}"
      Accept-Language: "zh-CN"
      Accept: "application/json, text/plain, */*"
      sec-ch-ua: "\"Not A(Brand\";v=\"8\", \"Chromium\";v=\"132\", \"Google Chrome\";v=\"132\""
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36"
      sec-ch-ua-mobile: "?0"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://www.52frp.com/user/"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
