id: qd-tpl-24228
name: 云中漫步
category: other
icon: community
summary: 每日任务
description: '任务地址：https://www.yunzmb.net/

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.0.1
updatedAt: '2026-11-26'
allowedHosts:
- www.yunzmb.net
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://www.yunzmb.net/
  headers:
    Cache-Control: max-age=0
    sec-ch-ua: '"Chromium";v="119", "Not?A_Brand";v="24"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
    DNT: '1'
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: navigate
    Sec-Fetch-User: ?1
    Sec-Fetch-Dest: document
    Referer: https://www.yunzmb.net/
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
  capture:
    formhash: (?:name="formhash"\s+value="|formhash=)([0-9a-f]{8,10})
- name: 任务
  method: GET
  url: https://www.yunzmb.net/plugin.php?id=dsu_amupper&ppersubmit=true&formhash={{formhash|urlencode}}&infloat=yes&handlekey=dsu_amupper&inajax=1&ajaxtarget=fwin_content_dsu_amupper
  headers:
    sec-ch-ua: '"Chromium";v="119", "Not?A_Brand";v="24"'
    DNT: '1'
    X-Requested-With: XMLHttpRequest
    sec-ch-ua-mobile: ?0
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36
    sec-ch-ua-platform: '"Windows"'
    Accept: '*/*'
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: cors
    Sec-Fetch-Dest: empty
    Referer: https://www.yunzmb.net/
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.yunzmb.net/home.php?mod=spacecp&ac=credit&showcredit=1
  headers:
    Cache-Control: max-age=0
    sec-ch-ua: '"Chromium";v="119", "Not?A_Brand";v="24"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
    DNT: '1'
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: navigate
    Sec-Fetch-User: ?1
    Sec-Fetch-Dest: document
    Referer: https://www.yunzmb.net/
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
check:
  notLogin:
  - 请登录
  - 登录后方可
  already:
  - 已签到
  - 已经签到
  - 今日已签到
  success:
  - 签到成功
  - 签到获得
  - 获得魔力
  - 获得积分
