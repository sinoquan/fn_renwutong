id: agsvpt
name: "AGSVPT"
category: pt
icon: pt
summary: 保活
description: |
  站点地址：https://pt.agsvpt.cn/ / https://www.agsvpt.com/ / https://new.agsvpt.cn/
  作用：定时访问首页留存活跃记录（保号）。不做签到，也不判定登录态。
  来源：站点清单取自 PT-depiler（MIT 许可），规则按本项目模板生成。
  探活 2026-11-21：探活通过，但站点有 Cloudflare 盾，纯请求可能被拦
  注意：本站不是 NexusPHP，登录后的页面无法离线验证，因此只提供保活。
risk: high
version: 1.0.0
updatedAt: 2026-11-21
allowedHosts: [pt.agsvpt.cn, www.agsvpt.com, new.agsvpt.cn]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
defaultTask: keepalive
tasks:
  - key: keepalive
    name: 保活
    type: keepalive
    description: 只定时访问首页留活跃记录，不判定登录态
    steps:
      - name: 访问首页
        method: GET
        url: "https://pt.agsvpt.cn/"
        headers:
          cookie: "{{cookie}}"
    check: {}
