id: qd-www-anywlan-com
name: www.anywlan.com
category: other
icon: community
summary: 每日任务
description: '任务地址：https://www.anywlan.com/plugin.php?id=k_misign%3Asign

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- www.anywlan.com
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://www.anywlan.com/plugin.php?id=k_misign%3Asign
  headers:
    accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    accept-language: zh-CN,zh-HK;q=0.9,zh-TW;q=0.8,zh;q=0.7,en;q=0.6,en-GB;q=0.5,en-US;q=0.4
    cache-control: no-cache
    dnt: '1'
    pragma: no-cache
    priority: u=0, i
    upgrade-insecure-requests: '1'
    user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.36 Edg/134.0.0.0
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.anywlan.com/plugin.php?id=k_misign%3Asign&operation=qiandao&formhash={{formhash|urlencode}}&format=empty
  headers:
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.anywlan.com/home.php?mod=spacecp&ac=credit
  headers:
    Cookie: '{{cookie}}'
check:
  notLogin:
  - 登录
  - 登录
  already:
  - 已签到
  - 已经签到
  - 今日已签到
  success:
  - regex:退出
