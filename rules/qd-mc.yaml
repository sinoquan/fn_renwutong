id: qd-mc
name: MC百科账号版
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.mcmod.cn/
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.mcmod.cn]
fields:
  - key: UA
    label: UA
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://www.mcmod.cn/"
    headers:
      Cache-Control: "max-age=0"
      sec-ch-ua: "\"Chromium\";v=\"21\", \" Not;A Brand\";v=\"99\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      DNT: "1"
      Upgrade-Insecure-Requests: "1"
      User-Agent: "{{UA}}"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Sec-Fetch-Site: "same-site"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-User: "?1"
      Sec-Fetch-Dest: "document"
      Referer: "https://center.mcmod.cn/"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: POST
    url: "https://www.mcmod.cn/action/doLogin/"
    headers:
      accept: "*/*"
      accept-language: "zh-CN,zh;q=0.9"
      cache-control: "no-cache"
      content-type: "application/x-www-form-urlencoded; charset=UTF-8"
      origin: "https://www.mcmod.cn"
      pragma: "no-cache"
      referer: "https://www.mcmod.cn/login/"
      sec-ch-ua: "\".Not/A)Brand\";v=\"99\", \"Google Chrome\";v=\"103\", \"Chromium\";v=\"103\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      sec-fetch-dest: "empty"
      sec-fetch-mode: "cors"
      sec-fetch-site: "same-origin"
      user-agent: "{{UA}}"
      x-requested-with: "XMLHttpRequest"
  - name: 任务
    method: GET
    url: "https://www.mcmod.cn/login/"
    headers:
      Cache-Control: "max-age=0"
      sec-ch-ua: "\"Chromium\";v=\"21\", \" Not;A Brand\";v=\"99\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      DNT: "1"
      Upgrade-Insecure-Requests: "1"
      User-Agent: "{{UA}}"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Sec-Fetch-Site: "same-site"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-User: "?1"
      Sec-Fetch-Dest: "document"
      Referer: "https://www.mcmod.cn/login/"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: POST
    url: "https://center.mcmod.cn/action/doUserCheckIn/"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"21\", \" Not;A Brand\";v=\"99\""
      DNT: "1"
      sec-ch-ua-mobile: "?0"
      User-Agent: "{{UA}}
"
      Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
      Accept: "*/*"
      X-Requested-With: "XMLHttpRequest"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://center.mcmod.cn"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://center.mcmod.cn/386083/"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: POST
    url: "https://center.mcmod.cn/frame/CenterItem/"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"21\", \" Not;A Brand\";v=\"99\""
      DNT: "1"
      sec-ch-ua-mobile: "?0"
      User-Agent: "{{UA}}
"
      Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
      Accept: "*/*"
      X-Requested-With: "XMLHttpRequest"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://center.mcmod.cn"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      referer: "https://center.mcmod.cn/{{uid|urlencode}}/"
      Accept-Language: "zh-CN,zh;q=0.9"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:{\"state\":0}", "regex:301"]
