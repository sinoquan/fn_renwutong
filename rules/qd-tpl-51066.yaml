id: qd-tpl-51066
name: 不移之火
category: game
icon: community
summary: 每日任务
description: '任务地址：https://www.byzhihuo.com/

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.1
updatedAt: '2026-11-26'
allowedHosts:
- www.byzhihuo.com
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://www.byzhihuo.com/
  headers:
    Content-Type: application/x-www-form-urlencoded
    Referer: https://www.byzhihuo.com/plugin.php?id=dsu_paulsign:sign
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36
    Cookie: '{{cookie}}'
  capture:
    formhash: (?:name="formhash"\s+value="|formhash=)([0-9a-f]{8,10})
- name: 任务
  method: GET
  url: https://www.byzhihuo.com/plugin.php?id=k_misign%3Asign&operation=qiandao&formhash={{formhash|urlencode}}&format=empty&inajax=1&ajaxtarget=
  headers:
    Content-Type: application/x-www-form-urlencoded
    Referer: https://www.byzhihuo.com/plugin.php?id=dsu_paulsign:sign
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.byzhihuo.com/home.php?mod=spacecp&ac=credit&showcredit=1
  headers:
    Content-Type: application/x-www-form-urlencoded
    Referer: https://www.byzhihuo.com/plugin.php?id=dsu_paulsign:sign
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36
    Cookie: '{{cookie}}'
check:
  notLogin:
  - 请登录
  - 登录后方可
  already:
  - 已签到
  - 已经签到
  - 今日已签到
  success:
  - regex:恭喜你签到成功|您今日已经签到
