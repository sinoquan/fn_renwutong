id: qd-hdsay
name: HDSay高清乐园
category: other
icon: community
summary: 每日任务
description: '任务地址：https://www.xiukee.net/dynamichtml/getloginexdata

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- www.xiukee.net
fields:
- key: Set
  label: Set
  type: text
  required: false
- key: ccc
  label: ccc
  type: text
  required: false
- key: code
  label: code
  type: text
  required: false
- key: pass
  label: pass
  type: password
  required: false
- key: time
  label: time
  type: text
  required: false
- key: token
  label: token
  type: text
  required: false
- key: uid
  label: uid
  type: text
  required: false
- key: user
  label: user
  type: text
  required: false
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://www.xiukee.net/dynamichtml/getloginexdata
  headers:
    Cache-Control: max-age=0
    sec-ch-ua: '"Chromium";v="122", "Not(A:Brand";v="24", "Google Chrome";v="122"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
    DNT: '1'
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Sec-Fetch-Site: none
    Sec-Fetch-Mode: navigate
    Sec-Fetch-User: ?1
    Sec-Fetch-Dest: document
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.xiukee.net/account/getverificationcode?name={{code|urlencode}}&ver=%27%20%20%20Math.random%28%29
  headers:
    Cookie: '{{cookie}}'
- name: 任务
  method: POST
  url: https://www.xiukee.net/account/loginsubmit
  headers:
    sec-ch-ua: '"Chromium";v="122", "Not(A:Brand";v="24", "Google Chrome";v="122"'
    Pragma: no-cache
    Expires: Sat, 01 Jan 2000 00:00:00 GMT
    DNT: '1'
    X-XSRF-TOKEN: '{{token}}'
    sec-ch-ua-mobile: ?0
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36
    Content-Type: application/json
    Accept: application/json, text/javascript, */*; q=0.01
    Cache-Control: no-cache
    X-Requested-With: XMLHttpRequest
    sec-ch-ua-platform: '"Windows"'
    Origin: https://www.xiukee.net
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: cors
    Sec-Fetch-Dest: empty
    Referer: https://www.xiukee.net/Account/Login?ReturnUrl=%2F
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.xiukee.net/member/sign
  headers:
    sec-ch-ua: '"Chromium";v="119", "Not?A_Brand";v="24"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
    Upgrade-Insecure-Requests: '1'
    DNT: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: navigate
    Sec-Fetch-User: ?1
    Sec-Fetch-Dest: document
    Referer: https://www.xiukee.net/
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.xiukee.net/api/services/app/ForumMemberSign/GetNewWithUserId?userId={{uid|urlencode}}&_=1717678912400
  headers:
    sec-ch-ua: '"Chromium";v="119", "Not?A_Brand";v="24"'
    Pragma: no-cache
    Expires: Thu, 20 Jun 2024 13:26:15 GMT
    DNT: '1'
    X-XSRF-TOKEN: '{{token}}'
    sec-ch-ua-mobile: ?0
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36
    Content-Type: application/json
    Accept: application/json, text/javascript, */*; q=0.01
    Cache-Control: no-cache
    X-Requested-With: XMLHttpRequest
    sec-ch-ua-platform: '"Windows"'
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: cors
    Sec-Fetch-Dest: empty
    Referer: https://www.xiukee.net/member/sign
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
- name: 任务
  method: POST
  url: https://www.xiukee.net/api/services/app/ForumMemberSign/Create
  headers:
    sec-ch-ua: '"Chromium";v="122", "Not(A:Brand";v="24", "Google Chrome";v="122"'
    Pragma: no-cache
    Expires: Sat, 01 Jan 2000 00:00:00 GMT
    DNT: '1'
    X-XSRF-TOKEN: '{{token}}'
    sec-ch-ua-mobile: ?0
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36
    Content-Type: application/json
    Accept: application/json, text/javascript, */*; q=0.01
    Cache-Control: no-cache
    X-Requested-With: XMLHttpRequest
    sec-ch-ua-platform: '"Windows"'
    Origin: https://www.xiukee.net
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: cors
    Sec-Fetch-Dest: empty
    Referer: https://www.xiukee.net/member/sign
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{Set}}'
check:
  notLogin:
  - 请登录
  - 登录后方可
  already:
  - 已签到
  - 已经签到
  - 今日已签到
  success:
  - 签到成功
  - 签到获得
  - 获得魔力
  - 获得积分
