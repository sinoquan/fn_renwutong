id: qd-tpl-49890
name: 天使动漫论坛
category: other
icon: community
summary: 每日任务
description: '任务地址：https://www.tsdm39.com/forum.php

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- www.tsdm39.com
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://www.tsdm39.com/forum.php
  headers:
    Cache-Control: max-age=0
    DNT: '1'
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/78.0.3904.108 Safari/537.36
    Sec-Fetch-User: ?1
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: navigate
    Referer: https://www.tsdm39.com/member.php?mod=logging&action=login&loginsubmit=yes&handlekey=ls&loginhash=LN1Rn
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
- name: 打开签到页
  method: GET
  url: https://www.tsdm39.com/plugin.php?id=dsu_paulsign:sign
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.9
    Referer: https://www.tsdm39.com/
    Cookie: '{{cookie}}'
  capture:
    formhash: formhash=([0-9a-fA-F]{8})
- name: 提交签到
  method: GET
  url: https://www.tsdm39.com/plugin.php?id=dsu_paulsign%3Asign&operation=qiandao&qdxq=kx&infloat=1&inajax=1&formhash={{formhash|urlencode}}
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
    Accept: '*/*'
    Accept-Language: zh-CN,zh;q=0.9
    X-Requested-With: XMLHttpRequest
    Referer: https://www.tsdm39.com/plugin.php?id=dsu_paulsign:sign
    Cookie: '{{cookie}}'
check:
  notLogin:
  - 请登录
  - 登录后方可
  already:
  - 已经签到
  - 今日已经签到
  - 请明天再来
  - 已签到
  success:
  - 签到成功
  - 恭喜你签到成功
  - 获得随机奖励
