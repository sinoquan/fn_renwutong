id: qd-nodeloc
name: nodeloc
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.nodeloc.com/session/csrf
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.nodeloc.com]
fields:
  - key: csrf
    label: csrf
    type: text
    required: false
  - key: nonce
    label: nonce
    type: text
    required: false
  - key: password
    label: password
    type: password
    required: false
  - key: time
    label: time
    type: text
    required: false
  - key: timezone
    label: timezone
    type: text
    required: false
  - key: ua
    label: ua
    type: text
    required: false
  - key: username
    label: username
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://www.nodeloc.com/session/csrf"
    headers:
      User-Agent: "{{ua}}"
      Accept: "application/json, text/javascript, */*; q=0.01"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Referer: "https://www.nodeloc.com/login"
      X-CSRF-Token: "undefined"
      Discourse-Present: "true"
      X-Requested-With: "XMLHttpRequest"
      Alt-Used: "www.nodeloc.com"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
  - name: 任务
    method: POST
    url: "https://www.nodeloc.com/session"
    headers:
      User-Agent: "{{ua}}"
      Accept: "*/*"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Referer: "https://www.nodeloc.com/login"
      X-CSRF-Token: "{{csrf}}"
      Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
      Discourse-Present: "true"
      X-Requested-With: "XMLHttpRequest"
      Origin: "https://www.nodeloc.com"
      Alt-Used: "www.nodeloc.com"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
  - name: 任务
    method: GET
    url: "https://www.nodeloc.com/"
    headers:
      User-Agent: "{{ua}}"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Alt-Used: "www.nodeloc.com"
      Upgrade-Insecure-Requests: "1"
      Sec-Fetch-Dest: "document"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-User: "?1"
      Priority: "u=0, i"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
  - name: 任务
    method: GET
    url: "https://www.nodeloc.com/session/csrf"
    headers:
      User-Agent: "{{ua}}"
      Accept: "application/json, text/javascript, */*; q=0.01"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      X-CSRF-Token: "undefined"
      Discourse-Present: "true"
      X-Requested-With: "XMLHttpRequest"
      Alt-Used: "www.nodeloc.com"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
  - name: 任务
    method: POST
    url: "https://www.nodeloc.com/checkin"
    headers:
      User-Agent: "{{ua}}"
      Accept: "*/*"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Referer: "https://www.nodeloc.com/"
      X-CSRF-Token: "{{csrf}}"
      Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
      X-Discourse-Checkin: "true"
      X-Checkin-Nonce: "{{nonce}}"
      Discourse-Logged-In: "true"
      Discourse-Present: "true"
      X-Requested-With: "XMLHttpRequest"
      Origin: "https://www.nodeloc.com"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=0"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
  - name: 任务
    method: GET
    url: "https://www.nodeloc.com/u/{{username}}/points-history/events"
    headers:
      User-Agent: "{{ua}}"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Sec-Fetch-Dest: "document"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-Site: "none"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
      Upgrade-Insecure-Requests: "1"
      Sec-Fetch-User: "?1"
  - name: 任务
    method: GET
    url: "https://www.nodeloc.com/session/csrf"
    headers:
      User-Agent: "{{ua}}"
      Accept: "application/json, text/javascript, */*; q=0.01"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      X-CSRF-Token: "undefined"
      Discourse-Present: "true"
      X-Requested-With: "XMLHttpRequest"
      Alt-Used: "www.nodeloc.com"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
  - name: 任务
    method: GET
    url: "https://www.nodeloc.com/u/{{username}}/points-scores.json"
    headers:
      User-Agent: "{{ua}}"
      Accept: "application/json, text/javascript, */*; q=0.01"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Referer: "https://www.nodeloc.com/u/{{username}}/follow/feed"
      X-CSRF-Token: "{{csrf}}"
      Discourse-Logged-In: "true"
      Discourse-Present: "true"
      X-Requested-With: "XMLHttpRequest"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=0"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
check:
  notLogin: ["您需要登录才能执行此操作"]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:true"]
