id: qd-189
name: 189天翼云_账号密码版
category: cloud
icon: community
summary: 每日任务
description: |
  任务地址：https://cloud.189.cn/api/portal/loginUrl.action?redirectURL=https%3A%2F%2Fcloud.189.cn%2Fweb%2Fredirect.html%3FreturnURL%3D%2Fmain.action
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [cloud.189.cn]
fields:
  - key: lt
    label: lt
    type: text
    required: false
  - key: mailSuffix
    label: mailSuffix
    type: text
    required: false
  - key: paramId
    label: paramId
    type: text
    required: false
  - key: passkey
    label: passkey
    type: password
    required: false
  - key: reqid
    label: reqid
    type: text
    required: false
  - key: returnUrl
    label: returnUrl
    type: text
    required: false
  - key: toUrl
    label: toUrl
    type: text
    required: false
  - key: userkey
    label: userkey
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://cloud.189.cn/api/portal/loginUrl.action?redirectURL=https%3A%2F%2Fcloud.189.cn%2Fweb%2Fredirect.html%3FreturnURL%3D%2Fmain.action"
    headers:
      Accept: "*/*"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:74.0) Gecko/20100101 Firefox/76.0"
  - name: 任务
    method: POST
    url: "https://open.e.189.cn/api/logbox/oauth2/appConf.do"
    headers:
      Accept: "*/*"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:74.0) Gecko/20100101 Firefox/76.0"
      reqid: "{{reqid}}"
      lt: "{{lt}}"
      referer: "{{toUrl}}"
      content-type: "application/x-www-form-urlencoded"
  - name: 任务
    method: POST
    url: "https://open.e.189.cn/api/logbox/config/encryptConf.do"
    headers:
      Accept: "*/*"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:74.0) Gecko/20100101 Firefox/76.0"
  - name: 任务
    method: POST
    url: "https://open.e.189.cn/api/logbox/oauth2/needcaptcha.do"
    headers:
      Accept: "*/*"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:74.0) Gecko/20100101 Firefox/76.0"
      lt: "{{lt}}"
      referer: "{{toUrl}}"
      content-type: "application/x-www-form-urlencoded"
  - name: 任务
    method: POST
    url: "https://open.e.189.cn/api/logbox/oauth2/loginSubmit.do"
    headers:
      Accept: "*/*"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:74.0) Gecko/20100101 Firefox/76.0"
      lt: "{{lt}}"
      Referer: "https://open.e.189.cn/"
  - name: 任务
    method: GET
    url: "https://api.cloud.189.cn/mkt/userSign.action?rand={{_timestamp1|urlencode}}&clientType=TELEANDROID&version=8.6.3&model=SM-G930K"
    headers:
      Accept: "*/*"
      User-Agent: "Mozilla/5.0 (Linux; Android 5.1.1; SM-G930K Build/NRD90M; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/74.0.3729.136 Mobile Safari/537.36 Ecloud/8.6.3 Android/22 clientId/355325117317828 clientModel/SM-G930K imsi/460071114317824 clientChannelId/qq proVersion/1.0.6"
      Referer: "https://m.cloud.189.cn/zhuanti/2016/sign/index.jsp?albumBackupOpened=1"
  - name: 任务
    method: GET
    url: "https://m.cloud.189.cn/v2/drawPrizeMarketDetails.action?taskId=TASK_SIGNIN&activityId=ACT_SIGNIN"
    headers:
      Accept: "*/*"
      User-Agent: "Mozilla/5.0 (Linux; Android 5.1.1; SM-G930K Build/NRD90M; wv)AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/74.0.3729.136 Mobile Safari/537.36 Ecloud/8.6.3 Android/22 clientId/355325117317828 clientModel/SM-G930K imsi/460071114317824 clientChannelId/qq proVersion/1.0.6"
      Referer: "https://m.cloud.189.cn/zhuanti/2016/sign/index.jsp?albumBackupOpened=1"
  - name: 任务
    method: GET
    url: "https://m.cloud.189.cn/v2/drawPrizeMarketDetails.action?taskId=TASK_SIGNIN_PHOTOS&activityId=ACT_SIGNIN"
    headers:
      Accept: "*/*"
      User-Agent: "Mozilla/5.0 (Linux; Android 5.1.1; SM-G930K Build/NRD90M; wv)AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/74.0.3729.136 Mobile Safari/537.36 Ecloud/8.6.3 Android/22 clientId/355325117317828 clientModel/SM-G930K imsi/460071114317824 clientChannelId/qq proVersion/1.0.6"
      Referer: "https://m.cloud.189.cn/zhuanti/2016/sign/index.jsp?albumBackupOpened=1"
  - name: 任务
    method: GET
    url: "https://m.cloud.189.cn/v2/drawPrizeMarketDetails.action?taskId=TASK_2022_FLDFS_KJ&activityId=ACT_SIGNIN"
    headers:
      Accept: "*/*"
      User-Agent: "Mozilla/5.0 (Linux; Android 5.1.1; SM-G930K Build/NRD90M; wv)AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/74.0.3729.136 Mobile Safari/537.36 Ecloud/8.6.3 Android/22 clientId/355325117317828 clientModel/SM-G930K imsi/460071114317824 clientChannelId/qq proVersion/1.0.6"
      Referer: "https://m.cloud.189.cn/zhuanti/2016/sign/index.jsp?albumBackupOpened=1"
  - name: 任务
    method: GET
    url: "https://cloud.189.cn/api/portal/logout.action?redirectURL=https%3A%2F%2Fcloud.189.cn%2Fweb%2Flogin.html"
    headers:
      Accept: "*/*"
      User-Agent: "Mozilla/5.0 (Linux; Android 5.1.1; SM-G930K Build/NRD90M; wv)AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/74.0.3729.136 Mobile Safari/537.36 Ecloud/8.6.3 Android/22 clientId/355325117317828 clientModel/SM-G930K imsi/460071114317824 clientChannelId/qq proVersion/1.0.6"
