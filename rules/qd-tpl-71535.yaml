id: qd-tpl-71535
name: 雨云任务
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://api.v2.rainyun.com/user/reward/tasks
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [api.v2.rainyun.com]
fields:
  - key: apikey
    label: apikey
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://api.v2.rainyun.com/user/reward/tasks"
    headers:
      x-api-key: "{{ apikey }}"
      User-Agent: "Apifox/1.0.0 (https://apifox.com)"
      Content-Type: "application/json"
  - name: 任务
    method: GET
    url: "https://api.v2.rainyun.com/user/"
    headers:
      x-api-key: "{{ apikey }}"
      User-Agent: "Apifox/1.0.0 (https://apifox.com)"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:\"code\":30011"]
