id: qd-link-ai
name: Link.AI_智能对话
category: ai
icon: community
summary: 每日任务
description: |
  任务地址：https://link-ai.tech/api/login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [link-ai.tech]
fields:
  - key: token
    label: token
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://link-ai.tech/api/login"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"119\", \"Not?A_Brand\";v=\"24\""
      Accept: "application/json, text/plain, */*"
      Content-Type: "application/x-www-form-urlencoded;charset=UTF-8"
      sec-ch-ua-mobile: "?0"
      Authorization: "Bearer"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.9 Safari/537.36"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://link-ai.tech"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://link-ai.tech/home"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: GET
    url: "https://link-ai.tech/api/chat/web/app/user/sign/in"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"119\", \"Not?A_Brand\";v=\"24\""
      Accept: "application/json, text/plain, */*"
      sec-ch-ua-mobile: "?0"
      Authorization: "Bearer {{token}}"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.9 Safari/537.36"
      sec-ch-ua-platform: "\"Windows\""
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://link-ai.tech/home"
      Accept-Language: "zh-CN,zh;q=0.9"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
