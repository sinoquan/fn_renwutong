id: qd-tpl-48488
name: 万能福利吧
category: forum
icon: community
summary: 每日任务
description: '任务地址：https://www.wnflb2023.com/plugin.php?id=fx_checkin%3Alist

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.1
updatedAt: '2026-11-26'
allowedHosts:
- www.wnflb2023.com
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://www.wnflb2023.com/plugin.php?id=fx_checkin%3Alist
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    DNT: '1'
    Referer: https://www.wnflb2023.com/
    Cookie: '{{cookie}}'
    Upgrade-Insecure-Requests: '1'
  capture:
    formhash: (?:name="formhash"\s+value="|formhash=)([0-9a-f]{8,10})
- name: 任务
  method: GET
  url: https://www.wnflb2023.com/plugin.php?id=fx_checkin%3Acheckin&formhash={{formhash|urlencode}}&{{formhash|urlencode}}=&infloat=yes&handlekey=fx_checkin&inajax=1&ajaxtarget=fwin_content_fx_checkin
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36
    Accept: '*/*'
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    X-Requested-With: XMLHttpRequest
    DNT: '1'
    Referer: https://www.wnflb2023.com/
    Cookie: '{{cookie}}'
check:
