id: qd-hifiti
name: Hifiti
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.hifiti.com/sg_sign.htm
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.hifiti.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://www.hifiti.com/sg_sign.htm"
    headers:
      upgrade-insecure-requests: "1"
      dnt: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/86.0.4240.198 Safari/537.36"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      sec-fetch-site: "same-origin"
      sec-fetch-mode: "navigate"
      sec-fetch-user: "?1"
      sec-fetch-dest: "document"
      referer: "https://www.hifiti.com/"
      accept-language: "zh-CN,zh;q=0.9"
      cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://www.hifiti.com/sg_sign.htm"
    headers:
      accept: "text/plain, */*; q=0.01"
      accept-language: "zh-CN,zh;q=0.9"
      content-type: "application/x-www-form-urlencoded; charset=UTF-8"
      cookie: "{{cookie}}"
      dnt: "1"
      origin: "https://www.hifiti.com"
      referer: "https://www.hifiti.com/"
      sec-ch-ua: "\"Chromium\";v=\"119\", \"Not?A_Brand\";v=\"24\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      sec-fetch-dest: "empty"
      sec-fetch-mode: "cors"
      sec-fetch-site: "same-origin"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36"
      x-requested-with: "XMLHttpRequest"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
