id: qd-vcb-studio
name: VCB-Studio分享论坛
category: other
icon: community
summary: 每日任务
description: '任务地址：https://bbs.acgrip.com/dsu_paulsign-sign.html

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- bbs.acgrip.com
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://bbs.acgrip.com/dsu_paulsign-sign.html
  headers:
    Referer: 'https://bbs.acgrip.com/dsu_paulsign-sign.html '
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.9,ja;q=0.8,en;q=0.7,zh-TW;q=0.6
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://bbs.acgrip.com/home.php?mod=task&do=apply&id=1
  headers:
    Referer: 'https://bbs.acgrip.com/home.php?mod=task&item=new '
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.9,ja;q=0.8,en;q=0.7,zh-TW;q=0.6
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://bbs.acgrip.com/home.php?mod=task&do=draw&id=1
  headers:
    Referer: 'https://bbs.acgrip.com/home.php?mod=task&item=new '
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.9,ja;q=0.8,en;q=0.7,zh-TW;q=0.6
    Cookie: '{{cookie}}'
- name: 打开签到页
  method: GET
  url: https://bbs.acgrip.com/plugin.php?id=dsu_paulsign:sign
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.9
    Referer: https://bbs.acgrip.com/
    Cookie: '{{cookie}}'
  capture:
    formhash: formhash=([0-9a-fA-F]{8})
- name: 提交签到
  method: GET
  url: https://bbs.acgrip.com/plugin.php?id=dsu_paulsign%3Asign&operation=qiandao&qdxq=kx&infloat=1&inajax=1&formhash={{formhash|urlencode}}
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
    Accept: '*/*'
    Accept-Language: zh-CN,zh;q=0.9
    X-Requested-With: XMLHttpRequest
    Referer: https://bbs.acgrip.com/plugin.php?id=dsu_paulsign:sign
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://bbs.acgrip.com/space-uid-{{random(14076,33381,0)}}.html
  headers:
    Referer: 'https://bbs.acgrip.com/home.php?mod=task&item=new '
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.9,ja;q=0.8,en;q=0.7,zh-TW;q=0.6
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://bbs.acgrip.com/home.php?mod=spacecp&ac=credit
  headers:
    Referer: 'https://bbs.acgrip.com/home.php?mod=task&item=new '
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.9,ja;q=0.8,en;q=0.7,zh-TW;q=0.6
    Cookie: '{{cookie}}'
check:
  notLogin:
  - 先登录
  already:
  - 已经签到
  - 今日已经签到
  - 请明天再来
  - 已签到
  success:
  - 签到成功
  - 恭喜你签到成功
  - 获得随机奖励
