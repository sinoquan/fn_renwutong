id: qd-javbus
name: javbus
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.javbus.com/forum/home.php?mod=spacecp&ac=credit&op=base
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.javbus.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://www.javbus.com/forum/home.php?mod=spacecp&ac=credit&op=base"
    headers:
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
      accept-language: "zh-CN,zh;q=0.9"
      cache-control: "no-cache"
      pragma: "no-cache"
      priority: "u=0, i"
      referer: "https://www.javbus.com/forum/home.php?mod=spacecp&ac=credit&op=base"
      sec-ch-ua: "\"Google Chrome\";v=\"137\", \"Chromium\";v=\"137\", \"Not/A)Brand\";v=\"24\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      sec-fetch-dest: "document"
      sec-fetch-mode: "navigate"
      sec-fetch-site: "same-origin"
      sec-fetch-user: "?1"
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36"
      cookie: "{{cookie}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
