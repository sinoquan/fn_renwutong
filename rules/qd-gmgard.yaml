id: qd-gmgard
name: gmgard
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://gmgard.moe/
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [gmgard.moe]
fields:
  - key: cookies1
    label: Cookie
    type: password
    required: true
  - key: cookies3
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://gmgard.moe/"
    headers:
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6"
      cache-control: "max-age=0"
      cookie: "{{cookies1}}"
      sec-ch-ua: "\"Not/A)Brand\";v=\"99\", \"Microsoft Edge\";v=\"115\", \"Chromium\";v=\"115\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      sec-fetch-dest: "document"
      sec-fetch-mode: "navigate"
      sec-fetch-site: "same-origin"
      sec-fetch-user: "?1"
      upgrade-insecure-requests: "1"
  - name: 任务
    method: POST
    url: "https://gmgard.moe/api/PunchIn/Do"
    headers:
      accept: "*/*"
      accept-language: "zh-CN,zh;q=0.9"
      content-type: "application/json"
      cookie: "{{cookies3}}"
      dnt: "1"
      origin: "https://gmgard.moe"
      referer: "https://gmgard.moe/User"
      sec-ch-ua: "\"Not.A/Brand\";v=\"8\", \"Chromium\";v=\"114\", \"Google Chrome\";v=\"114\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      sec-fetch-dest: "empty"
      sec-fetch-mode: "cors"
      sec-fetch-site: "same-origin"
      user-agent: "Mozilla/5.0 (Linux; Android 13; SM-G9980 Build/TP1A.220624.014) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/96.0.4664.104 Mobile Safari/537.36"
      x-requested-with: "XMLHttpRequest"
  - name: 任务
    method: POST
    url: "https://gmgard.moe/api/PunchIn/Do"
    headers:
      accept: "*/*"
      accept-language: "zh-CN,zh;q=0.9"
      content-type: "application/json"
      cookie: "{{cookies1}}"
      dnt: "1"
      origin: "https://gmgard.moe"
      referer: "https://gmgard.moe/User"
      sec-ch-ua: "\"Not.A/Brand\";v=\"8\", \"Chromium\";v=\"114\", \"Google Chrome\";v=\"114\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      sec-fetch-dest: "empty"
      sec-fetch-mode: "cors"
      sec-fetch-site: "same-origin"
      user-agent: "Mozilla/5.0 (Linux; Android 13; SM-G9980 Build/TP1A.220624.014) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/96.0.4664.104 Mobile Safari/537.36"
      x-requested-with: "XMLHttpRequest"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:任务：", "regex:收藏：", "regex:status", "regex:status"]
