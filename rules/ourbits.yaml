id: ourbits
name: OurBits
category: pt
icon: pt
summary: PT 站每日任务
description: |
  任务地址：https://ourbits.club/attendance.php
  作用：访问站点任务页完成每日任务，并记录返回的魔力值。
risk: high
version: 1.0.1
updatedAt: 2026-11-20
allowedHosts: [ourbits.club]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
    help: 登录 ourbits.club 后按 F12 → Network → 复制 Request Headers 里的 Cookie 整串
steps:
  - name: 任务
    method: GET
    url: "https://ourbits.club/attendance.php"
    headers:
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Referer: "https://ourbits.club/index.php"
check:
  notLogin: [请登录, 登录后方可, 你需要登录, takelogin.php]
  already: [已签到, 已经签到, 今日已签到, 您今天已经签到]
  success: [签到成功, 签到获得, 获得魔力值, 成功签到, 获得积分]
