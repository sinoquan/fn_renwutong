id: qd-de
name: 龙de船人
category: other
icon: community
summary: 每日任务
description: '任务地址：https://www.imarine.cn/

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- www.imarine.cn
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://www.imarine.cn/
  headers:
    pragma: no-cache
    cache-control: no-cache
    upgrade-insecure-requests: '1'
    user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.20 Safari/537.36
    accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    referer: https://www.imarine.cn/
    accept-language: zh-CN,zh;q=0.9,en;q=0.8
    cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.imarine.cn/qiandao/
  headers:
    pragma: no-cache
    cache-control: no-cache
    upgrade-insecure-requests: '1'
    user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.20 Safari/537.36
    accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    referer: https://www.imarine.cn/
    accept-language: zh-CN,zh;q=0.9,en;q=0.8
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.imarine.cn/plugin.php?id=k_misign%3Asign&operation=qiandao&formhash={{formhash|urlencode}}&format=empty&inajax=1&ajaxtarget=JD_sign
  headers:
    pragma: no-cache
    cache-control: no-cache
    x-requested-with: XMLHttpRequest
    user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.20 Safari/537.36
    accept: '*/*'
    referer: https://www.imarine.cn/qiandao/
    accept-language: zh-CN,zh;q=0.9,en;q=0.8
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.imarine.cn/home.php?mod=spacecp&ac=credit&op=base
  headers:
    pragma: no-cache
    cache-control: no-cache
    upgrade-insecure-requests: '1'
    user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.20 Safari/537.36
    accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    referer: https://www.imarine.cn/qiandao/
    accept-language: zh-CN,zh;q=0.9,en;q=0.8
    Cookie: '{{cookie}}'
check:
  notLogin:
  - 请登录
  - 登录后方可
  already:
  - 已签到
  - 已经签到
  - 今日已签到
  success:
  - regex:403
