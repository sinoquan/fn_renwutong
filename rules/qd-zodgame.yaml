id: qd-zodgame
name: ZodGame论坛
category: forum
icon: community
summary: 每日任务
description: '任务地址：https://zodgame.xyz/plugin.php?id=dsu_paulsign%3Asign

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.1
updatedAt: '2026-11-26'
allowedHosts:
- zodgame.xyz
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://zodgame.xyz/plugin.php?id=dsu_paulsign%3Asign
  headers:
    sec-ch-ua: '"Google Chrome";v="103", "Chromium";v="103", "Not=A?Brand";v="24"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: navigate
    Sec-Fetch-User: ?1
    Sec-Fetch-Dest: document
    Referer: https://zodgame.xyz/
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
    Cookie: '{{cookie}}'
- name: 打开签到页
  method: GET
  url: https://zodgame.xyz/plugin.php?id=dsu_paulsign:sign
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.9
    Referer: https://zodgame.xyz/
    Cookie: '{{cookie}}'
  capture:
    formhash: formhash=([0-9a-fA-F]{8})
- name: 提交签到
  method: GET
  url: https://zodgame.xyz/plugin.php?id=dsu_paulsign%3Asign&operation=qiandao&qdxq=kx&infloat=1&inajax=1&formhash={{formhash|urlencode}}
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
    Accept: '*/*'
    Accept-Language: zh-CN,zh;q=0.9
    X-Requested-With: XMLHttpRequest
    Referer: https://zodgame.xyz/plugin.php?id=dsu_paulsign:sign
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://zodgame.xyz/plugin.php?id=jnbux
  headers:
    Cache-Control: max-age=0
    sec-ch-ua: '"Google Chrome";v="103", "Chromium";v="103", "Not=A?Brand";v="24"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: navigate
    Sec-Fetch-User: ?1
    Sec-Fetch-Dest: document
    Referer: https://zodgame.xyz/home.php?mod=task
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://zodgame.xyz/plugin.php?id=jnbux%3Ajnbux&do=click&clickid={{clickid|urlencode}}&timeo={{timestamp()|urlencode}}&onlyhash={{onlyhash|urlencode}}&formhash={{formhash|urlencode}}&userid={{userid|urlencode}}
  headers:
    sec-ch-ua: '"Google Chrome";v="103", "Chromium";v="103", "Not=A?Brand";v="24"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: navigate
    Sec-Fetch-User: ?1
    Sec-Fetch-Dest: document
    Referer: https://zodgame.xyz/plugin.php?id=jnbux
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://zodgame.xyz/plugin.php?id=jnbux%3Ajnbux&do=update&clickid={{clickid|urlencode}}&timeo={{timestamp()|urlencode}}&onlyhash={{onlyhash|urlencode}}&formhash={{formhash|urlencode}}&userid={{userid|urlencode}}
  headers:
    sec-ch-ua: '"Google Chrome";v="103", "Chromium";v="103", "Not=A?Brand";v="24"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: navigate
    Sec-Fetch-Dest: document
    Referer: https://zodgame.xyz/plugin.php?id=jnbux:jnbux&do=click&clickid=39&timeo=1678605983&onlyhash=2f9581f11b759306fb800c24f7463bdb&formhash=bf368287&userid=500355
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://zodgame.xyz/plugin.php?id=jnbux%3Ajnbux&do=check&clickid={{clickid|urlencode}}&userid={{userid|urlencode}}&formhash={{formhash|urlencode}}&page=0&infloat=yes&handlekey=check&inajax=1&ajaxtarget=fwin_content_check
  headers:
    sec-ch-ua: '"Google Chrome";v="103", "Chromium";v="103", "Not=A?Brand";v="24"'
    X-Requested-With: XMLHttpRequest
    sec-ch-ua-mobile: ?0
    User-Agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36
    sec-ch-ua-platform: '"Windows"'
    Accept: '*/*'
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: cors
    Sec-Fetch-Dest: empty
    Referer: https://zodgame.xyz/plugin.php?id=jnbux
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
    Cookie: '{{cookie}}'
check:
  notLogin:
  - 请登录
