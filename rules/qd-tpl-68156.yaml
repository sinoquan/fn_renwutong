id: qd-tpl-68156
name: 有道云笔记
category: tool
icon: community
summary: 每日任务
description: '任务地址：https://note.youdao.com/yws/mapi/user?method=get&vendor=&multilevelEnable=true

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- note.youdao.com
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://note.youdao.com/yws/mapi/user?method=get&vendor=&multilevelEnable=true
  headers:
    Content-Type: application/x-www-form-urlencoded
    User-Agent: ynote-android
    cookie: '{{ cookie }}'
- name: 任务
  method: POST
  url: https://note.youdao.com/yws/api/daupromotion?method=sync
  headers:
    Content-Type: application/x-www-form-urlencoded
    User-Agent: ynote-android
    Cookie: '{{ cookie }}'
- name: 任务
  method: POST
  url: https://note.youdao.com/yws/mapi/user?method=checkin&_system=android
  headers:
    Content-Type: application/x-www-form-urlencoded
    User-Agent: ynote-android
    cookie: '{{ cookie }}'
- name: 任务
  method: POST
  url: https://note.youdao.com/yws/mapi/user?method=getSignStatus&device_type=PC&_system=windows&_appName=ynote&_vendor=official-website&cstk={{cstk|urlencode}}
  headers:
    Accept: application/json, text/plain, */*
    Content-Type: application/x-www-form-urlencoded
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) ynote-desktop/1.2.2 Chrome/87.0.4280.141 Electron/11.4.10 Safari/537.36
    cookie: '{{ cookie }}'
- name: 任务
  method: POST
  url: https://note.youdao.com/yws/mapi/user?method=checkin&device_type=PC&_system=windows&_appName=ynote&_vendor=official-website&cstk={{cstk|urlencode}}
  headers:
    Content-Type: application/x-www-form-urlencoded
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) ynote-desktop/1.2.2 Chrome/87.0.4280.141 Electron/11.4.10 Safari/537.36
    cookie: '{{ cookie }}'
- name: 任务
  method: POST
  url: https://note.youdao.com/yws/mapi/user?method=get
  headers:
    Content-Type: application/x-www-form-urlencoded
    User-Agent: ynote-android
    cookie: '{{ cookie }}'
- name: 任务
  method: GET
  url: https://cunchu.bmcx.com/web_system/bmcx_com_www/system/file/cunchu/get/?id=1&q={{b_capacity|urlencode}}
  headers:
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://cunchu.bmcx.com/web_system/bmcx_com_www/system/file/cunchu/get/?id=1&q={{rewardSpace|urlencode}}
  headers:
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://cunchu.bmcx.com/web_system/bmcx_com_www/system/file/cunchu/get/?id=1&q={{anspace|urlencode}}
  headers:
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://cunchu.bmcx.com/web_system/bmcx_com_www/system/file/cunchu/get/?id=1&q={{w1space|urlencode}}
  headers:
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://cunchu.bmcx.com/web_system/bmcx_com_www/system/file/cunchu/get/?id=1&q={{capacity|urlencode}}
  headers:
    Cookie: '{{cookie}}'
