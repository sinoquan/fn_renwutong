id: qd-tpl-58887
name: 麦块联机
category: game
icon: community
summary: 每日任务
description: '任务地址：https://minekuai.com/

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- minekuai.com
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
- key: id
  label: id
  type: text
  required: false
- key: token
  label: token
  type: text
  required: false
steps:
- name: 任务
  method: GET
  url: https://minekuai.com/
  headers:
    Cache-Control: max-age=0
    sec-ch-ua: '"Chromium";v="122", "Not(A:Brand";v="24", "Google Chrome";v="122"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: navigate
    Sec-Fetch-User: ?1
    Sec-Fetch-Dest: document
    Referer: https://minekuai.com/auth/login
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://minekuai.com/api/client/account
  headers:
    sec-ch-ua: '"Chromium";v="122", "Not(A:Brand";v="24", "Google Chrome";v="122"'
    Accept: application/json
    X-XSRF-TOKEN: '{{token}}'
    X-Requested-With: XMLHttpRequest
    sec-ch-ua-mobile: ?0
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36
    sec-ch-ua-platform: '"Windows"'
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: cors
    Sec-Fetch-Dest: empty
    Referer: https://minekuai.com/
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
- name: 任务
  method: POST
  url: https://api.ungc.com.cn/api/minekuai/points/signIn
  headers:
    sec-ch-ua: '"Chromium";v="122", "Not(A:Brand";v="24", "Google Chrome";v="122"'
    X-XSRF-TOKEN: '{{token}}'
    sec-ch-ua-mobile: ?0
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36
    Content-Type: application/json
    Accept: application/json
    X-Requested-With: XMLHttpRequest
    sec-ch-ua-platform: '"Windows"'
    Origin: https://minekuai.com
    Sec-Fetch-Site: cross-site
    Sec-Fetch-Mode: cors
    Sec-Fetch-Dest: empty
    Referer: https://minekuai.com/stars
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://api.ungc.com.cn/api/minekuai/points/getPoints?user_id={{id|urlencode}}
  headers:
    sec-ch-ua: '"Chromium";v="122", "Not(A:Brand";v="24", "Google Chrome";v="122"'
    Accept: application/json
    X-XSRF-TOKEN: '{{token}}'
    X-Requested-With: XMLHttpRequest
    sec-ch-ua-mobile: ?0
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36
    sec-ch-ua-platform: '"Windows"'
    Origin: https://minekuai.com
    Sec-Fetch-Site: cross-site
    Sec-Fetch-Mode: cors
    Sec-Fetch-Dest: empty
    Referer: https://minekuai.com/stars
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
check:
  notLogin:
  - 请登录
  - 登录后方可
  already:
  - 已签到
  - 已经签到
  - 今日已签到
  success:
  - 签到成功
  - 签到获得
  - 获得魔力
  - 获得积分
