id: qd-tpl-82923
name: 精易论坛
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://bbs.ijingyi.com/plugin.php?id=dsu_paulsign%3Asign
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [bbs.ijingyi.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://bbs.ijingyi.com/plugin.php?id=dsu_paulsign%3Asign"
    headers:
      Cache-Control: "max-age=0"
      sec-ch-ua: "\"Chromium\";v=\"21\", \" Not;A Brand\";v=\"99\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      Upgrade-Insecure-Requests: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-User: "?1"
      Sec-Fetch-Dest: "document"
      Referer: "https://bbs.125.la/login.htm"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://bbs.ijingyi.com/plugin.php?id=dsu_paulsign%3Asign&operation=qiandao&infloat=1"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"21\", \" Not;A Brand\";v=\"99\""
      Accept: "*/*"
      Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
      X-Requested-With: "XMLHttpRequest"
      sec-ch-ua-mobile: "?0"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://bbs.125.la"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://bbs.125.la/plugin.php?id=dsu_paulsign:sign"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://bbs.ijingyi.com/home.php?mod=spacecp&ac=credit&showcredit=1"
    headers:
      Cache-Control: "max-age=0"
      sec-ch-ua: "\"Chromium\";v=\"21\", \" Not;A Brand\";v=\"99\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      Upgrade-Insecure-Requests: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-User: "?1"
      Sec-Fetch-Dest: "document"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Cookie: "{{cookie}}"
check:
  notLogin: [请登录, 登录后方可]
