id: qd-tpl-48330
name: 腾龙工作室
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.tenlonstudio.com/wp-json/jwt-auth/v1/token
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.tenlonstudio.com]
fields:
  - key: password
    label: password
    type: password
    required: false
  - key: token
    label: token
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://www.tenlonstudio.com/wp-json/jwt-auth/v1/token"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      accept: "application/json, text/plain, */*"
      content-type: "application/x-www-form-urlencoded"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
      origin: "https://www.tenlonstudio.com"
      referer: "https://www.tenlonstudio.com/"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: POST
    url: "https://www.tenlonstudio.com/wp-json/b2/v1/getUserMission"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      accept: "application/json, text/plain, */*"
      content-type: "application/x-www-form-urlencoded"
      authorization: "Bearer {{token}}"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
      origin: "https://www.tenlonstudio.com"
      referer: "https://www.tenlonstudio.com/"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: POST
    url: "https://www.tenlonstudio.com/wp-json/b2/v1/userMission"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      accept: "application/json, text/plain, */*"
      authorization: "Bearer {{token}}"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
      origin: "https://www.tenlonstudio.com"
      referer: "https://www.tenlonstudio.com/task"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: POST
    url: "https://www.tenlonstudio.com/wp-json/b2/v1/getUserInfo"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      accept: "application/json, text/plain, */*"
      content-type: "application/x-www-form-urlencoded"
      authorization: "Bearer {{token}}"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
      origin: "https://www.tenlonstudio.com"
      referer: "https://www.tenlonstudio.com/"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
