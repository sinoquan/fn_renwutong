id: qd-yhxs3344-checkin-native
name: yhxs3344-checkin.native
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.yhxs3344.net/user/
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.yhxs3344.net]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://www.yhxs3344.net/user/"
    headers:
      Cookie: "{{cookie}}"
      User-Agent: "Mozilla/5.0"
      Referer: "https://www.yhxs3344.net/user/"
  - name: 任务
    method: POST
    url: "https://www.yhxs3344.net/wp-admin/admin-ajax.php"
    headers:
      Cookie: "{{cookie}}"
      User-Agent: "Mozilla/5.0"
      Referer: "https://www.yhxs3344.net/user/"
      Content-Type: "application/x-www-form-urlencoded"
  - name: 任务
    method: GET
    url: "https://www.yhxs3344.net/user/level"
    headers:
      Cookie: "{{cookie}}"
      User-Agent: "Mozilla/5.0"
      Referer: "https://www.yhxs3344.net/user/"
