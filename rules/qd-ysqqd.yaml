id: qd-ysqqd
name: ysqqd
category: forum
icon: community
summary: 每日任务
description: |
  任务地址：https://ycoo.net/k_misign-sign.html
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [ycoo.net]
fields:
