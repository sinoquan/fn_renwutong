id: qd-tpl-21143
name: 问道论坛
category: forum
icon: community
summary: 每日任务
description: |
  任务地址：https://dao.gyyx.cn/api/v1/user/userWeb/sign
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [dao.gyyx.cn]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://dao.gyyx.cn/api/v1/user/userWeb/sign"
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64; rv:140.0) Gecko/20100101 Firefox/140.0"
      Accept: "*/*"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Origin: "https://dao.gyyx.cn"
      Cookie: "{{cookie}}"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=0"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
  - name: 任务
    method: GET
    url: "https://dao.gyyx.cn/api/v1/user/userWeb/sign"
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64; rv:140.0) Gecko/20100101 Firefox/140.0"
      Accept: "*/*"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Cookie: "{{cookie}}"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=4"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
check:
  notLogin: ["用户登录已失效"]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
