id: 1ptba
name: 1PTBar
category: pt
icon: pt
summary: 模拟登录
description: '站点地址：https://1ptba.com/

  作用：保活。

  注意：本站不是 NexusPHP，登录后的页面无法离线验证，因此不提供「模拟登录」，只做保活与签到。

  来源：站点清单取自 PT-depiler（MIT 许可），规则按本项目模板生成。

  探活 2026-11-21：生成时未能连通（可能被墙/需要代理），站点恢复后本规则即可用

  '
risk: high
version: 1.1.4
updatedAt: '2026-11-24'
allowedHosts:
- 1ptba.com
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
defaultTask: login
tasks:
- key: checkin
  name: 每日签到
  type: checkin
  description: 访问签到页 /attendance.php 完成签到
  steps:
  - name: 签到
    method: GET
    url: https://1ptba.com/attendance.php
    headers:
      cookie: '{{cookie}}'
      referer: https://1ptba.com/
  check:
    notLogin:
    - takelogin.php
    - login.php?returnto
    - 请登录
    already:
    - 已签到
    - 已经签到
    - 今日已签到
    - 已簽到
    success:
    - 签到成功
    - 签到获得
    - 获得魔力
    - 获得积分
    - 簽到成功
    reward:
    - (?:魔力值|魔力)[^0-9]{0,12}([0-9,]+(?:\.[0-9]+)?)
- key: login
  name: 模拟登录
  type: login
  description: 带 Cookie 访问一次站点；登录态失效会被识别出来
  steps:
  - name: 访问首页
    method: GET
    url: https://1ptba.com/
    headers:
      cookie: '{{cookie}}'
  check:
    reward:
    - (?:魔力值|魔力)[^0-9]{0,12}([0-9,]+(?:\.[0-9]+)?)
    success:
    - logout.php
    - 退出
    - 控制面板
    - 个人中心
    - 我的账户
    - 魔力值
    notLogin:
    - takelogin.php
    - login.php?returnto
    - 请登录
    - 登录 / 注册
