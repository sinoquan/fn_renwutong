id: qd-ai-8-0-pro
name: 欧亿AI-8.0_Pro
category: tool
icon: community
summary: 每日任务
description: |
  任务地址：https://ai8.rcouyi.com/api/user/login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [ai8.rcouyi.com]
fields:
  - key: password
    label: password
    type: password
    required: false
  - key: token
    label: token
    type: text
    required: false
  - key: username
    label: username
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://ai8.rcouyi.com/api/user/login"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
      Accept: "application/json, text/plain, */*"
      Content-Type: "application/json"
      X-APP-VERSION: "2.0.1"
      sec-ch-ua-mobile: "?0"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://ai8.rcouyi.com"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://ai8.rcouyi.com/auth"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: POST
    url: "https://ai8.rcouyi.com/api/gift_sign"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
      Accept: "application/json, text/plain, */*"
      X-APP-VERSION: "2.0.1"
      sec-ch-ua-mobile: "?0"
      Authorization: "{{token}}"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      sec-ch-ua-platform: "\"Windows\""
      Origin: "https://ai8.rcouyi.com"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://ai8.rcouyi.com/me/gift"
      Accept-Language: "zh-CN,zh;q=0.9"
check:
  notLogin: ["您的登录已过期，请重新登录"]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
