id: qd-deepfacelab
name: deepfacelab中文网
category: forum
icon: community
summary: 每日任务
description: |
  任务地址：https://dfldata.cc/forum.php
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [dfldata.cc]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://dfldata.cc/forum.php"
    headers:
      cache-control: "max-age=0"
      sec-ch-ua: "\"Chromium\";v=\"119\", \"Not?A_Brand\";v=\"24\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      dnt: "1"
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
      sec-fetch-site: "same-origin"
      sec-fetch-mode: "navigate"
      sec-fetch-user: "?1"
      sec-fetch-dest: "document"
      referer: "https://dfldata.cc/home.php?mod=space&do=notice&view=system"
      accept-language: "zh-CN,zh;q=0.9"
      cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://dfldata.cc/home.php?mod=spacecp&ac=credit&showcredit=1"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"119\", \"Not?A_Brand\";v=\"24\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      upgrade-insecure-requests: "1"
      dnt: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
      sec-fetch-site: "same-origin"
      sec-fetch-mode: "navigate"
      sec-fetch-user: "?1"
      sec-fetch-dest: "document"
      referer: "https://dfldata.cc/forum.php"
      accept-language: "zh-CN,zh;q=0.9"
      cookie: "{{cookie}}
"
