id: qd-tpl-86521
name: 迅维网
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.chinafix.com/plugin.php?id=k_misign:sign
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.chinafix.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: formhash
    label: formhash
    type: text
    required: false
steps:
  - name: 任务
    method: GET
    url: "https://www.chinafix.com/plugin.php?id=k_misign:sign"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      Cookie: "{{cookie}}"
      Referer: "https://www.chinafix.com/"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: GET
    url: "https://www.chinafix.com/plugin.php?id=k_misign:sign&operation=qiandao&formhash={{formhash}}"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      Cookie: "{{cookie}}"
      Referer: "https://www.chinafix.com/plugin.php?id=k_misign:sign"
      Accept: "*/*"
      X-Requested-With: "XMLHttpRequest"
  - name: 任务
    method: GET
    url: "https://www.chinafix.com/plugin.php?id=k_misign:sign"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      Cookie: "{{cookie}}"
      Referer: "https://www.chinafix.com/plugin.php?id=k_misign:sign"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
check:
  notLogin: ["请先登录", "您还未登录"]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:签到成功|今日已签|已签到|succeed"]
