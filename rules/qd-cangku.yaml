id: qd-cangku
name: Cangku
category: other
icon: community
summary: 每日任务
description: '任务地址：https://cangku.moe/login

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- cangku.moe
fields:
- key: laravel_session2
  label: laravel_session2
  type: text
  required: false
- key: laravel_session4
  label: laravel_session4
  type: text
  required: false
- key: password
  label: password
  type: password
  required: false
- key: username
  label: username
  type: text
  required: false
- key: xsrf8
  label: xsrf8
  type: text
  required: false
- key: xsrf9
  label: xsrf9
  type: text
  required: false
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://cangku.moe/login
  headers:
    accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    accept-language: zh-CN,zh;q=0.9,en;q=0.8,zh-TW;q=0.7
    cache-control: max-age=0
    dnt: '1'
    referer: https://cangku.moe/
    sec-ch-ua: '"Not.A/Brand";v="8", "Chromium";v="114", "Google Chrome";v="114"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
    sec-fetch-dest: document
    sec-fetch-mode: navigate
    sec-fetch-site: same-origin
    sec-fetch-user: ?1
    upgrade-insecure-requests: '1'
    user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36
    Cookie: '{{cookie}}'
- name: 任务
  method: POST
  url: https://cangku.moe/api/v1/auth/login
  headers:
    accept: application/json, text/plain, */*
    accept-language: zh-CN,zh;q=0.9,en;q=0.8,zh-TW;q=0.7
    content-type: application/json
    cookie: XSRF-TOKEN={{xsrf9}}; cangku_laravel_session={{laravel_session2}}
    origin: https://cangku.moe
    referer: https://cangku.moe/login
    sec-ch-ua: '"Not.A/Brand";v="8", "Chromium";v="114", "Google Chrome";v="114"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
    sec-fetch-dest: empty
    sec-fetch-mode: cors
    sec-fetch-site: same-origin
    user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36
    x-xsrf-token: '{{xsrf9}}'
- name: 任务
  method: GET
  url: https://cangku.moe/api/v1/link/list?all=1
  headers:
    accept: application/json, text/plain, */*
    accept-language: zh-CN,zh;q=0.9,en;q=0.8,zh-TW;q=0.7
    dnt: '1'
    referer: https://cangku.moe/
    sec-ch-ua: '"Not.A/Brand";v="8", "Chromium";v="114", "Google Chrome";v="114"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
    sec-fetch-dest: empty
    sec-fetch-mode: cors
    sec-fetch-site: same-origin
    user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36
    Cookie: '{{cookie}}'
- name: 任务
  method: POST
  url: https://cangku.moe/api/v1/user/signin
  headers:
    accept: application/json, text/plain, */*
    accept-language: zh-CN,zh;q=0.9,en;q=0.8,zh-TW;q=0.7
    cookie: XSRF-TOKEN={{xsrf8}}; cangku_laravel_session={{laravel_session4}}
    dnt: '1'
    origin: https://cangku.moe
    referer: https://cangku.moe/
    sec-ch-ua: '"Not.A/Brand";v="8", "Chromium";v="114", "Google Chrome";v="114"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
    sec-fetch-dest: empty
    sec-fetch-mode: cors
    sec-fetch-site: same-origin
    user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36
    x-xsrf-token: '{{xsrf8}}'
check:
  notLogin:
  - 请登录
  - 登录后方可
  already:
  - 已签到
  - 已经签到
  - 今日已签到
  success:
  - regex:"status_code":200
  - regex:"message":"success"
  - regex:status_code":"200
