id: qd-tpl-84520
name: 咸鱼单机
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https:///{{domian}}/user
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: ["{{domian}}"]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: domian
    label: domian
    type: text
    required: false
  - key: nonce
    label: nonce
    type: text
    required: false
steps:
  - name: 任务
    method: GET
    url: "https:///{{domian}}/user"
    headers:
      referer: "https://{{domian}}/"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:158.0) Gecko/20100101 Firefox/158.0"
      Cookie: "{{cookie}}"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9,zh-TW;q=0.8,zh-HK;q=0.7,en-US;q=0.6,en;q=0.5"
      DNT: "1"
      Sec-GPC: "1"
      Upgrade-Insecure-Requests: "1"
      Sec-Fetch-Dest: "document"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-User: "?1"
      Priority: "u=0, i"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
  - name: 任务
