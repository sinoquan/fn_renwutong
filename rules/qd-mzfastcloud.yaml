id: qd-mzfastcloud
name: MZFastCloud
category: media
icon: community
summary: 每日任务
description: |
  任务地址：https://www.mzfast.xyz/auth/login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.mzfast.xyz]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://www.mzfast.xyz/auth/login"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      accept: "application/json, text/javascript, */*; q=0.01"
      content-type: "application/x-www-form-urlencoded; charset=UTF-8"
      x-requested-with: "XMLHttpRequest"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4636.4 Safari/537.36"
      origin: "https://www.mzfast.xyz"
      referer: "https://www.mzfast.xyz/auth/login"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: POST
    url: "https://www.mzfast.xyz/user/checkin"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      accept: "application/json, text/javascript, */*; q=0.01"
      content-type: "application/x-www-form-urlencoded; charset=UTF-8"
      x-requested-with: "XMLHttpRequest"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4636.4 Safari/537.36"
      origin: "https://www.mzfast.xyz"
      referer: "https://www.mzfast.xyz/auth/login"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: GET
    url: "https://www.mzfast.xyz/user"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      content-type: "application/x-www-form-urlencoded; charset=UTF-8"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4636.4 Safari/537.36"
      referer: "https://www.mzfast.xyz"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
      upgrade-insecure-requests: "1"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:\\\\u767b\\\\u5f55\\\\u6210\\\\u529f", "regex:\\\\u767b\\\\u5f55\\\\u6210\\\\u529f"]
