id: hdfans
name: HDFans
category: pt
icon: pt
summary: 模拟登录
description: '站点地址：https://hdfans.org/

  作用：模拟登录。

  来源：站点清单取自 PT-depiler（MIT 许可），规则按本项目模板生成。

  探活 2026-11-21：探活通过（NexusPHP 登录页）

  '
risk: high
version: 1.1.3
updatedAt: '2026-11-24'
allowedHosts:
- hdfans.org
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
defaultTask: login
tasks:
- key: checkin
  name: 每日签到
  type: checkin
  description: 访问签到页 /attendance.php 完成签到
  steps:
  - name: 签到
    method: GET
    url: https://hdfans.org/attendance.php
    headers:
      cookie: '{{cookie}}'
      referer: https://hdfans.org/
  check:
    notLogin:
    - takelogin.php
    - login.php?returnto
    - 请登录
    already:
    - 已签到
    - 已经签到
    - 今日已签到
    - 已簽到
    success:
    - 签到成功
    - 签到获得
    - 获得魔力
    - 获得积分
    - 簽到成功
    reward:
    - (?:魔力值|魔力)[^0-9]{0,12}([0-9,]+(?:\.[0-9]+)?)
- key: login
  name: 模拟登录
  type: login
  description: 访问首页确认 Cookie 仍有效；未登录会被重定向到登录页
  steps:
  - name: 检查登录态
    method: GET
    url: https://hdfans.org/
    headers:
      cookie: '{{cookie}}'
  check:
    notLogin:
    - takelogin.php
    - login.php?returnto
    - 你需要启用cookies
    success:
    - logout.php
    - 退出登录
    - 个人中心
    - 我的账户
    - 我的资料
    reward:
    - (?:魔力值|魔力)[^0-9]{0,12}([0-9,]+(?:\.[0-9]+)?)
