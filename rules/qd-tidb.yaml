id: qd-tidb
name: TiDB_社区会员中心
category: ai
icon: community
summary: 每日任务
description: |
  任务地址：https://pingkai.cn/accounts/login?redirect_to=https%3A%2F%2Fpingkai.cn%2Ftidbcommunity%2Fforum%2F
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [pingkai.cn]
fields:
  - key: csrftoken
    label: csrftoken
    type: text
    required: false
  - key: password
    label: password
    type: password
    required: false
  - key: username
    label: username
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://pingkai.cn/accounts/login?redirect_to=https%3A%2F%2Fpingkai.cn%2Ftidbcommunity%2Fforum%2F"
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64; rv:140.0) Gecko/20100101 Firefox/140.0"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "zh-hans"
      Sec-Fetch-Dest: "document"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-Site: "same-origin"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      Cookie: "csrftoken="
  - name: 任务
    method: POST
    url: "https://pingkai.cn/accounts/api/login/password"
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64; rv:140.0) Gecko/20100101 Firefox/140.0"
      Accept: "application/json, text/plain, */*"
      Accept-Language: "zh-hans"
      Referer: "https://pingkai.cn/accounts/login"
      Content-Type: "application/json"
      Origin: "https://pingkai.cn"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=0"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      X-CSRFTOKEN: "{{csrftoken}}"
  - name: 任务
    method: POST
    url: "https://pingkai.cn/accounts/api/points/daily-checkin"
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64; rv:140.0) Gecko/20100101 Firefox/140.0"
      Accept: "application/json, text/plain, */*"
      Accept-Language: "zh-hans"
      Origin: "https://pingkai.cn"
      Referer: "https://pingkai.cn/tidbcommunity/member"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=0"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      X-CSRFTOKEN: "{{csrftoken}}"
  - name: 任务
    method: GET
    url: "https://pingkai.cn/accounts/api/points/me"
    headers:
      User-Agent: "Mozilla/5.0 (X11; Linux x86_64; rv:140.0) Gecko/20100101 Firefox/140.0"
      Accept: "application/json, text/plain, */*"
      Accept-Language: "zh-hans"
      Referer: "https://pingkai.cn/tidbcommunity/member"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
