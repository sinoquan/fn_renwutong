id: qd-c4d
name: 一酷C4D
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://c4dco.com/wp-content/themes/modown/action/user.php
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [c4dco.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://c4dco.com/wp-content/themes/modown/action/user.php"
    headers:
      accept: "application/json, text/javascript, */*; q=0.01"
      content-type: "application/x-www-form-urlencoded; charset=UTF-8"
      x-requested-with: "XMLHttpRequest"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4636.4 Safari/537.36"
      origin: "https://c4dco.com"
      sec-fetch-site: "same-origin"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
      cookie: "{{cookie}}"
      cache-control: "no-cache"
      pragma: "no-cache"
      referer: "https://c4dco.com/user?action=info"
  - name: 任务
    method: GET
    url: "https://c4dco.com/user?action=charge"
    headers:
      accept: "application/json, text/javascript, */*; q=0.01"
      content-type: "application/x-www-form-urlencoded; charset=UTF-8"
      x-requested-with: "XMLHttpRequest"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4636.4 Safari/537.36"
      origin: "https://c4dco.com"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
      cache-control: "no-cache"
      pragma: "no-cache"
      referer: "https://c4dco.com"
check:
