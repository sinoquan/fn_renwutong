id: qd-www-52pojie-cn
name: 吾爱破解
category: forum
icon: community
summary: 社区每日任务
description: '任务地址：https://www.52pojie.cn/forum.php

  作用：调用该站点自己的任务接口，完成每日任务/领取，比只访问首页更准确。

  执行：每天在你设定的时间窗内随机选一个时间发起请求，失败会在首页提示。

  '
risk: none
version: 1.1.4
updatedAt: '2026-11-25'
allowedHosts:
- www.52pojie.cn
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
  help: 登录站点后按 F12 → Network → 复制 Request Headers 里的 Cookie 整串
defaultTask: checkin
tasks:
- key: checkin
  name: 每日签到
  type: checkin
  description: 打开任务页完成每日签到
  steps:
  - name: 请求
    method: GET
    url: https://www.52pojie.cn/forum.php
    headers:
      Pragma: no-cache
      Cache-Control: no-cache
      sec-ch-ua: '"Google Chrome";v="103", "Chromium";v="103", "Not=A?Brand";v="24"'
      sec-ch-ua-mobile: ?0
      sec-ch-ua-platform: '"Windows"'
      Upgrade-Insecure-Requests: '1'
      User-Agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
      Sec-Fetch-Site: same-origin
      Sec-Fetch-Mode: navigate
      Sec-Fetch-User: ?1
      Sec-Fetch-Dest: document
      Referer: https://www.52pojie.cn/portal.php
      Accept-Encoding: gzip, deflate, br
      Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
      Cookie: '{{cookie}}'
  - name: 领取任务任务
    method: GET
    url: https://www.52pojie.cn/home.php?mod=task&do=apply&id=2&referer=%2Fforum.php
    headers:
      sec-ch-ua: '"Google Chrome";v="103", "Chromium";v="103", "Not=A?Brand";v="24"'
      sec-ch-ua-mobile: ?0
      sec-ch-ua-platform: '"Windows"'
      Upgrade-Insecure-Requests: '1'
      User-Agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
      Sec-Fetch-Site: same-origin
      Sec-Fetch-Mode: navigate
      Sec-Fetch-User: ?1
      Sec-Fetch-Dest: document
      Referer: https://www.52pojie.cn/forum.php
      Accept-Encoding: gzip, deflate, br
      Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
  - name: 完成任务任务
    method: GET
    url: https://www.52pojie.cn//home.php?mod=task&do=draw&id=2&referer=https%3A%2F%2Fwww.52pojie.cn%2F.%2F%2Fforum.php
    headers:
      Upgrade-Insecure-Requests: '1'
      User-Agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
      Sec-Fetch-Site: same-origin
      Sec-Fetch-Mode: navigate
      Sec-Fetch-User: ?1
      Sec-Fetch-Dest: document
      sec-ch-ua: '"Google Chrome";v="103", "Chromium";v="103", "Not=A?Brand";v="24"'
      sec-ch-ua-mobile: ?0
      sec-ch-ua-platform: '"Windows"'
      Referer: https://www.52pojie.cn/home.php?mod=task&do=apply&id=2&referer=%2Fforum.php
      Accept-Encoding: gzip, deflate, br
      Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
  - name: 判断任务成功
    method: GET
    url: https://www.52pojie.cn/forum.php
    headers:
      Pragma: no-cache
      Cache-Control: no-cache
      sec-ch-ua: '"Google Chrome";v="103", "Chromium";v="103", "Not=A?Brand";v="24"'
      sec-ch-ua-mobile: ?0
      sec-ch-ua-platform: '"Windows"'
      Upgrade-Insecure-Requests: '1'
      User-Agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
      Sec-Fetch-Site: same-origin
      Sec-Fetch-Mode: navigate
      Sec-Fetch-User: ?1
      Sec-Fetch-Dest: document
      Referer: https://www.52pojie.cn/portal.php
      Accept-Encoding: gzip, deflate, br
      Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
      Cookie: '{{cookie}}'
  - name: 获取积分
    method: GET
    url: https://www.52pojie.cn/home.php?mod=spacecp&ac=credit&showcredit=1&inajax=1&ajaxtarget=extcreditmenu_menu
    headers:
      sec-ch-ua: '"Google Chrome";v="103", "Chromium";v="103", "Not=A?Brand";v="24"'
      X-Requested-With: XMLHttpRequest
      sec-ch-ua-mobile: ?0
      User-Agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36
      sec-ch-ua-platform: '"Windows"'
      Accept: '*/*'
      Sec-Fetch-Site: same-origin
      Sec-Fetch-Mode: cors
      Sec-Fetch-Dest: empty
      Referer: https://www.52pojie.cn//forum.php
      Accept-Encoding: gzip, deflate, br
      Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
  check:
    notLogin:
    - 请登录
    - 登录后方可
    - login.php
    already:
    - 已签到
    - 已经签到
    - 今天已签到
    success:
    - 签到成功
    - 签到获得
    - 获得魔力
    - 获得积分
    - 成功签到
    reward:
    - 本次签到获得[\s\S]{0,80}?([0-9,]+(?:\.[0-9]+)?)
    - 本次簽到獲得[\s\S]{0,80}?([0-9,]+(?:\.[0-9]+)?)
    - 签到已得\s*([0-9,]+(?:\.[0-9]+)?)
    - 簽到已得\s*([0-9,]+(?:\.[0-9]+)?)
    - 签到成功[^\d]{0,40}?([0-9,]+(?:\.[0-9]+)?)\s*个
    - 本次獲得[\s\S]{0,60}?([0-9,]+(?:\.[0-9]+)?)
- key: login
  name: 模拟登录
  type: login
  description: 先访问首页、停顿后再确认 Cookie 仍有效；失效会立刻提示你重填
  steps:
  - name: 检查登录态
    method: GET
    url: https://www.52pojie.cn/index.php
    headers:
      cookie: '{{cookie}}'
  check:
    notLogin:
    - takelogin.php
    - 登录 / 注册
    - 你需要启用cookies
    - 请登录
    - 登录后方可
    success:
    - logout.php
    - 退出登录
    - 个人中心
    - 我的账户
    - 我的资料
