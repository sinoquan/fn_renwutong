id: qd-wheremylife
name: WhereMyLife
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://wheremylife.cn/1.0/user/login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [wheremylife.cn]
fields:
  - key: password
    label: password
    type: password
    required: false
  - key: username
    label: username
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://wheremylife.cn/1.0/user/login"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
      sec-ch-ua-platform: "\"Windows\""
      Content-Type: "application/json"
      Accept: "*/*"
      Origin: "https://wheremylife.cn"
      Referer: "https://wheremylife.cn/home"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: POST
    url: "https://wheremylife.cn/1.0/user/resetBook"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
      Content-Type: "application/json"
      Accept: "*/*"
      Origin: "https://wheremylife.cn"
      Referer: "https://wheremylife.cn/home"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: GET
    url: "https://wheremylife.cn/1.0/user/book"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
      Content-Type: "application/json"
      Accept: "*/*"
      Referer: "https://wheremylife.cn/home"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
