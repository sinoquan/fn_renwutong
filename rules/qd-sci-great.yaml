id: qd-sci-great
name: SCI_Great_-_优质学术插件分享平台
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.scigreat.com/wp-admin/admin-ajax.php
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.scigreat.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://www.scigreat.com/wp-admin/admin-ajax.php"
    headers:
      Accept: "application/json, text/javascript, */*; q=0.01"
      Accept-Language: "zh-CN,zh;q=0.9"
      Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
      Cookie: "{{cookie}}"
      DNT: "1"
      Origin: "https://www.scigreat.com"
      Referer: "https://www.scigreat.com/user/"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36"
      X-Requested-With: "XMLHttpRequest"
      sec-ch-ua: "\"Chromium\";v=\"119\", \"Not?A_Brand\";v=\"24\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
  - name: 任务
    method: GET
    url: "https://www.scigreat.com/user/balance"
    headers:
      Accept: "application/json, text/javascript, */*; q=0.01"
      Accept-Language: "zh-CN,zh;q=0.9"
      Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
      Cookie: "{{cookie}}"
      DNT: "1"
      Origin: "https://www.scigreat.com"
      Referer: "https://www.scigreat.com/user/balance"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.160 Safari/537.36"
      X-Requested-With: "XMLHttpRequest"
      sec-ch-ua: "\"Chromium\";v=\"119\", \"Not?A_Brand\";v=\"24\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
