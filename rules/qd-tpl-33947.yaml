id: qd-tpl-33947
name: 网易云游戏
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://n.cg.163.com/api/v2/users/@me
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [n.cg.163.com]
fields:
  - key: Authorization
    label: Authorization
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://n.cg.163.com/api/v2/users/@me"
    headers:
      Authorization: " {{Authorization}}"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36"
      Accept: "*/*"
  - name: 任务
    method: POST
    url: "https://n.cg.163.com/api/v2/sign-today"
    headers:
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36"
      Authorization: "{{Authorization}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
