id: qd-cookie
name: 贴吧一键任务cookie
category: other
icon: community
summary: 每日任务
description: '任务地址：http://tieba.baidu.com/f/user/json_userinfo?_=1407684256076

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- tieba.baidu.com
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: http://tieba.baidu.com/f/user/json_userinfo?_=1407684256076
  headers:
    Cookie: '{{ cookie }}'
    DNT: '1'
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36 Edg/114.0.1823.82
    Accept: '*/*'
    X-Requested-With: XMLHttpRequest
- name: 任务
  method: GET
  url: https://tieba.baidu.com/f/like/mylike
  headers:
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
    Cache-Control: no-cache
    Cookie: '{{cookie}}'
    DNT: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36 Edg/114.0.1823.82
- name: 任务
  method: GET
  url: https://tieba.baidu.com/f/like/mylike?pn={{page|urlencode}}
  headers:
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
    Cache-Control: no-cache
    Cookie: '{{cookie}}'
    DNT: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36 Edg/114.0.1823.82
- name: 任务
  method: POST
  url: http://tieba.baidu.com/sign/add
  headers:
    Origin: http://tieba.baidu.com
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36 Edg/114.0.1823.82
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    X-Requested-With: XMLHttpRequest
    Referer: http://tieba.baidu.com/f?kw={{ bar |urlencode}}
    DNT: '1'
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: http://tieba.baidu.com/dc/common/tbs
  headers:
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36 Edg/114.0.1823.82
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Cookie: '{{cookie}}'
- name: 任务
  method: POST
  url: http://tieba.baidu.com/tbmall/onekeySignin1
  headers:
    Cookie: '{{cookie}}'
    Origin: http://tieba.baidu.com
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36 Edg/114.0.1823.82
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    Accept: '*/*'
    Referer: http://tieba.baidu.com/
    X-Requested-With: XMLHttpRequest
check:
  notLogin:
  - 请登录
  - 登录后方可
  already:
  - 已签到
  - 已经签到
  - 今日已签到
  success:
  - regex:session_id
  - regex:tbs
  - regex:success
  - regex:forums is signed
  - regex:there is no forum
