id: qd-www-diygm-com
name: www.diygm.com
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.diygm.com/plugin.php?id=dc_signin
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.diygm.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: formhash
    label: formhash
    type: text
    required: false
steps:
  - name: 任务
    method: GET
    url: "https://www.diygm.com/plugin.php?id=dc_signin"
    headers:
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
      accept-language: "zh-CN,zh-HK;q=0.9,zh-TW;q=0.8,zh;q=0.7,en;q=0.6,en-GB;q=0.5,en-US;q=0.4"
      dnt: "1"
      priority: "u=0, i"
      referer: "https://www.diygm.com/"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.36 Edg/134.0.0.0"
      Cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://www.diygm.com/plugin.php?id=dc_signin%3Asign&inajax=1"
    headers:
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
      accept-language: "zh-CN,zh-HK;q=0.9,zh-TW;q=0.8,zh;q=0.7,en;q=0.6,en-GB;q=0.5,en-US;q=0.4"
      cache-control: "max-age=0"
      content-type: "application/x-www-form-urlencoded"
      dnt: "1"
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.36 Edg/134.0.0.0"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://www.diygm.com/plugin.php?id=dc_signin"
    headers:
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
      accept-language: "zh-CN,zh-HK;q=0.9,zh-TW;q=0.8,zh;q=0.7,en;q=0.6,en-GB;q=0.5,en-US;q=0.4"
      cache-control: "max-age=0"
      dnt: "1"
      priority: "u=0, i"
      referer: "https://www.diygm.com/"
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.36 Edg/134.0.0.0"
      Cookie: "{{cookie}}"
check:
  notLogin: ["抱歉，您尚未登录，无法进行此操作"]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
