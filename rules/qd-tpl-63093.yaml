id: qd-tpl-63093
name: 蓝光演唱会
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.lgych.com/login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.1.0
updatedAt: 2026-11-20
allowedHosts: [www.lgych.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
defaultTask: checkin
tasks:
  - key: checkin
    name: 每日签到
    type: checkin
    description: 打开任务页完成每日签到
    steps:
      - name: 任务
        method: GET
        url: "https://www.lgych.com/login"
        headers:
          pragma: "no-cache"
          cache-control: "no-cache"
          upgrade-insecure-requests: "1"
          user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
          accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
          accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
      - name: 任务
        method: GET
        url: "https://www.lgych.com/wp-content/themes/modown/action/captcha2.php?{{random(0,1,17)|urlencode}}="
        headers:
          pragma: "no-cache"
          cache-control: "no-cache"
          user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
          accept: "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8"
          referer: "https://www.lgych.com/jinbi"
          accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
      - name: 任务
        method: POST
        url: "https://www.lgych.com/wp-content/themes/modown/action/login.php"
        headers:
          pragma: "no-cache"
          cache-control: "no-cache"
          accept: "*/*"
          content-type: "application/x-www-form-urlencoded; charset=UTF-8"
          x-requested-with: "XMLHttpRequest"
          user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
          origin: "https://www.lgych.com"
          referer: "https://www.lgych.com/jinbi"
          accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
      - name: 任务
        method: POST
        url: "https://www.lgych.com/wp-content/themes/modown/action/user.php"
        headers:
          pragma: "no-cache"
          cache-control: "no-cache"
          accept: "application/json, text/javascript, */*; q=0.01"
          content-type: "application/x-www-form-urlencoded; charset=UTF-8"
          x-requested-with: "XMLHttpRequest"
          user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
          origin: "https://www.lgych.com"
          referer: "https://www.lgych.com/user"
          accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
      - name: 任务
        method: GET
        url: "https://www.lgych.com/user"
        headers:
          pragma: "no-cache"
          cache-control: "no-cache"
          upgrade-insecure-requests: "1"
          user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
          accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
          referer: "https://www.lgych.com/user?action=info"
          accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
    check:
      notLogin: [请登录, 登录后方可]
      already: [已签到, 已经签到, 今日已签到]
      success: [签到成功, 签到获得, 获得魔力, 获得积分]

  - key: login
    name: 模拟登录
    type: login
    description: 先访问首页、停顿后再确认 Cookie 仍有效；失效会立刻提示你重填
    steps:
      - name: 检查登录态
        method: GET
        url: "https://www.lgych.com/index.php"
        headers:
          cookie: "{{cookie}}"
    check:
      notLogin: [takelogin.php, 登录 / 注册, 你需要启用cookies, 请登录, 登录后方可]
      success: [logout.php, 退出登录, 个人中心, 我的账户, 我的资料]
  - key: keepalive
    name: 保活
    type: keepalive
    description: 只定时访问首页留活跃记录，不判定登录态；适合不想动账号的场景
    steps:
      - name: 访问首页
        method: GET
        url: "https://www.lgych.com/index.php"
        headers:
          cookie: "{{cookie}}"
    check: {}