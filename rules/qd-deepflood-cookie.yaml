id: qd-deepflood-cookie
name: deepflood任务_cookie版
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.deepflood.com/board
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.deepflood.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://www.deepflood.com/board"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36 Edg/125.0.0.0"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9"
      cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://www.deepflood.com/api/attendance?random=true"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36 Edg/125.0.0.0"
      Accept: "application/json, text/plain, */*"
      Accept-Language: "zh-CN,zh;q=0.9"
      Content-Type: "application/json"
      Origin: "https://www.nodeseek.com"
      Referer: "https://www.nodeseek.com/board"
      cookie: "{{cookie}}"
check:
  notLogin: ["(未登录|请先登录|登录失效|登录已过期|\"status\"\\s*:\\s*404)"]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:鸡腿", "regex:已完成签到"]
