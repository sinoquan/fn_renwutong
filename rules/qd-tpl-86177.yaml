id: qd-tpl-86177
name: 落雪音乐助手
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.lxmusic.cc/wp-admin/admin-ajax.php
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.lxmusic.cc]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: ua
    label: ua
    type: text
    required: false
steps:
  - name: 任务
    method: POST
    url: "https://www.lxmusic.cc/wp-admin/admin-ajax.php"
    headers:
      User-Agent: "{{ua}}"
      Accept: "application/json, text/javascript, */*; q=0.01"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
      X-Requested-With: "XMLHttpRequest"
      Origin: "https://www.lxmusic.cc"
      Referer: "https://www.lxmusic.cc/"
      Cookie: "{{cookie}}"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=0"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
