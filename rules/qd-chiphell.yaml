id: qd-chiphell
name: chiphell
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.chiphell.com/forum.php
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.chiphell.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://www.chiphell.com/forum.php"
    headers:
      Pragma: "no-cache"
      DNT: "1"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.6"
      Upgrade-Insecure-Requests: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/46.0.2486.0 Safari/537.36 Edge/13.10586"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
      Cache-Control: "no-cache"
      Referer: "https://www.chiphell.com/portal.php"
      Cookie: "{{cookie}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:用户组"]
