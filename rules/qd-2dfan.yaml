id: qd-2dfan
name: 2DFan
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://{{domain|default("2dfan.org")}}/
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: ['{{domain|default("2dfan.org")}}']
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: domain
    label: domain
    type: text
    required: false
  - key: panel
    label: panel
    type: text
    required: false
  - key: recheckin
    label: recheckin
    type: text
    required: false
  - key: token
    label: token
    type: text
    required: false
steps:
  - name: 任务
    method: GET
    url: "https://{{domain|default(\"2dfan.org\")}}/"
    headers:
      cookie: "{{cookie}}"
      referer: "https://{{domain}}/"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/118.0.0.0 Safari/537.36"
  - name: 任务
    method: GET
    url: "https://{{domain}}{{recheckin}}"
    headers:
      referer: "https://{{domain}}/"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/118.0.0.0 Safari/537.36"
  - name: 任务
    method: POST
    url: "https://{{domain}}/checkins"
    headers:
      origin: "https://{{domain}}"
      referer: "https://{{domain}}{{recheckin}}"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/118.0.0.0 Safari/537.36"
      x-csrf-token: "{{token}}"
  - name: 任务
    method: GET
    url: "https://{{domain}}{{panel}}"
    headers:
      referer: "https://{{domain}}/"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/118.0.0.0 Safari/537.36"
check:
  notLogin: ["<a href=\"/users/not_authenticated\">登录</a>", "<a href=\"/users/not_authenticated\">登录</a>", "<a href=\"/users/not_authenticated\">登录</a>"]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
