id: qd-blue
name: blue高清公馆
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.bluegq.com/login.html
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.bluegq.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://www.bluegq.com/login.html"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      referer: "https://www.bluegq.com/"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: POST
    url: "https://www.bluegq.com/plugin.php?id=it618_members%3Aajax&ac=login&formhash={{formhash|urlencode}}"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      accept: "text/html, */*; q=0.01"
      content-type: "application/x-www-form-urlencoded; charset=UTF-8"
      x-requested-with: "XMLHttpRequest"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
      origin: "https://www.bluegq.com"
      referer: "https://www.bluegq.com/login.html"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: GET
    url: "https://www.bluegq.com/credits-qd.html"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      referer: "https://www.bluegq.com/credits.html"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: GET
    url: "https://www.bluegq.com/plugin.php?id=it618_credits%3Aajax&formhash={{formhash|urlencode}}&ac=qd"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      accept: "text/html, */*; q=0.01"
      x-requested-with: "XMLHttpRequest"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
      referer: "https://www.bluegq.com/credits-qd.html"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: GET
    url: "https://www.bluegq.com/plugin.php?id=it618_credits:index"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      referer: "https://www.bluegq.com/"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
