id: qd-seikuu
name: 星空论坛seikuu
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://bbs2.seikuu.com/plugin.php?id=dsu_paulsign%3Asign
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [bbs2.seikuu.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://bbs2.seikuu.com/plugin.php?id=dsu_paulsign%3Asign"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      DNT: "1"
      Cookie: "{{cookie}}"
      Upgrade-Insecure-Requests: "1"
      Cache-Control: "max-age=0"
  - name: 任务
    method: POST
    url: "https://bbs2.seikuu.com/plugin.php?id=dsu_paulsign%3Asign&operation=qiandao&infloat=1&sign_as=1&inajax=1"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Content-Type: "application/x-www-form-urlencoded"
      Origin: "https://bbs2.seikuu.com"
      DNT: "1"
      Referer: "https://bbs2.seikuu.com/"
      Upgrade-Insecure-Requests: "1"
  - name: 任务
    method: GET
    url: "https://bbs2.seikuu.com/plugin.php?id=dsu_paulsign%3Asign"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      DNT: "1"
      Cookie: "{{cookie}}"
      Upgrade-Insecure-Requests: "1"
      Cache-Control: "max-age=0"
check:
  notLogin: ["您需要先登录才能继续本操作"]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
