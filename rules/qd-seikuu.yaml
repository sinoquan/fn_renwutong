id: qd-seikuu
name: 星空论坛seikuu
category: forum
icon: community
summary: 每日任务
description: '任务地址：https://bbs2.seikuu.com/plugin.php?id=dsu_paulsign%3Asign

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- bbs2.seikuu.com
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://bbs2.seikuu.com/plugin.php?id=dsu_paulsign%3Asign
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
    DNT: '1'
    Cookie: '{{cookie}}'
    Upgrade-Insecure-Requests: '1'
    Cache-Control: max-age=0
- name: 打开签到页
  method: GET
  url: https://bbs2.seikuu.com/plugin.php?id=dsu_paulsign:sign
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.9
    Referer: https://bbs2.seikuu.com/
    Cookie: '{{cookie}}'
  capture:
    formhash: formhash=([0-9a-fA-F]{8})
- name: 提交签到
  method: GET
  url: https://bbs2.seikuu.com/plugin.php?id=dsu_paulsign%3Asign&operation=qiandao&qdxq=kx&infloat=1&inajax=1&formhash={{formhash|urlencode}}
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
    Accept: '*/*'
    Accept-Language: zh-CN,zh;q=0.9
    X-Requested-With: XMLHttpRequest
    Referer: https://bbs2.seikuu.com/plugin.php?id=dsu_paulsign:sign
    Cookie: '{{cookie}}'
check:
  notLogin:
  - 您需要先登录才能继续本操作
  already:
  - 已经签到
  - 今日已经签到
  - 请明天再来
  - 已签到
  success:
  - 签到成功
  - 恭喜你签到成功
  - 获得随机奖励
