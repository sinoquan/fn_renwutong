id: qd-tpl-53579
name: 网易云音乐
category: media
icon: community
summary: 每日任务
description: |
  任务地址：http://music.163.com/api/point/dailyTask?type=0
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [music.163.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "http://music.163.com/api/point/dailyTask?type=0"
    headers:
      Pragma: "no-cache"
      DNT: "1"
      Accept-Language: "en,zh-CN;q=0.8,zh;q=0.6"
      User-Agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_10_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/44.0.2403.30 Safari/537.36"
      Content-Type: "application/x-www-form-urlencoded"
      Accept: "*/*"
      Cache-Control: "no-cache"
      Referer: "http://music.163.com/discover"
      Cookie: "{{ cookie }}"
  - name: 任务
    method: GET
    url: "http://music.163.com/api/point/dailyTask?type=1"
    headers:
      Pragma: "no-cache"
      DNT: "1"
      Accept-Language: "en,zh-CN;q=0.8,zh;q=0.6"
      User-Agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_10_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/44.0.2403.30 Safari/537.36"
      Content-Type: "application/x-www-form-urlencoded"
      Accept: "*/*"
      Cache-Control: "no-cache"
      Referer: "http://music.163.com/discover"
      Cookie: "{{ cookie }}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:重复签到", "regex:重复签到"]
