id: qd-excelhome
name: ExcelHome技术论坛
category: other
icon: community
summary: 每日任务
description: '任务地址：https://club.excelhome.net/plugin.php?id=k_misign%3Asign

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.0.1
updatedAt: '2026-11-26'
allowedHosts:
- club.excelhome.net
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://club.excelhome.net/plugin.php?id=k_misign%3Asign
  headers:
    sec-ch-ua: '"Chromium";v="122", "Not(A:Brand";v="24", "Google Chrome";v="122"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: navigate
    Sec-Fetch-User: ?1
    Sec-Fetch-Dest: document
    Referer: https://club.excelhome.net/
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
  capture:
    formhash: (?:name="formhash"\s+value="|formhash=)([0-9a-f]{8,10})
- name: 任务
  method: GET
  url: https://club.excelhome.net/plugin.php?id=k_misign%3Asign&operation=qiandao&formhash={{formhash|urlencode}}&format=empty&inajax=1&ajaxtarget=
  headers:
    sec-ch-ua: '"Chromium";v="122", "Not(A:Brand";v="24", "Google Chrome";v="122"'
    X-Requested-With: XMLHttpRequest
    sec-ch-ua-mobile: ?0
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36
    sec-ch-ua-platform: '"Windows"'
    Accept: '*/*'
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: cors
    Sec-Fetch-Dest: empty
    Referer: https://club.excelhome.net/plugin.php?id=k_misign:sign
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://club.excelhome.net/home.php?mod=spacecp&ac=credit&showcredit=1
  headers:
    sec-ch-ua: '"Chromium";v="122", "Not(A:Brand";v="24", "Google Chrome";v="122"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
    Sec-Fetch-Site: same-origin
    Sec-Fetch-Mode: navigate
    Sec-Fetch-User: ?1
    Sec-Fetch-Dest: document
    Referer: https://club.excelhome.net/plugin.php?id=k_misign:sign
    Accept-Language: zh-CN,zh;q=0.9
    Cookie: '{{cookie}}'
check:
  notLogin:
  - 请登录
  - 登录后方可
  already:
  - 已签到
  - 已经签到
  - 今日已签到
  success:
  - regex:今日已签
