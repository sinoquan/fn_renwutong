id: qd-tpl-98908
name: 猫熊网络加速器
category: other
icon: community
summary: 每日任务
description: |
  任务地址：http://mxwljsq.top/auth/login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [mxwljsq.top]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "http://mxwljsq.top/auth/login"
    headers:
      Proxy-Connection: "keep-alive"
      Accept: "application/json, text/javascript, */*; q=0.01"
      X-Requested-With: "XMLHttpRequest"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
      Origin: "http://mxwljsq.top"
      Referer: "http://mxwljsq.top/auth/login"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: POST
    url: "http://mxwljsq.top/user/checkin"
    headers:
      Proxy-Connection: "keep-alive"
      Accept: "application/json, text/javascript, */*; q=0.01"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      X-Requested-With: "XMLHttpRequest"
      Origin: "http://mxwljsq.top"
      Referer: "http://mxwljsq.top/user"
      Accept-Language: "zh-CN,zh;q=0.9"
  - name: 任务
    method: GET
    url: "http://mxwljsq.top/user"
    headers:
      Proxy-Connection: "keep-alive"
      Upgrade-Insecure-Requests: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
      Referer: "http://mxwljsq.top/auth/login"
      Accept-Language: "zh-CN,zh;q=0.9"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:登录成功"]
