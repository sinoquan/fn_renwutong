id: audiences
name: Audiences
category: pt
icon: pt
summary: 每日任务
description: |
  任务地址：https://audiences.me/attendance.php
  作用：调用该站点自己的任务接口完成每日任务。
risk: high
version: 1.0.1
updatedAt: 2026-11-20
allowedHosts: [audiences.me]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
    help: 登录站点后按 F12 → Network → 复制 Request Headers 里的 Cookie 整串
steps:
  - name: 任务
    method: GET
    url: "https://audiences.me/attendance.php"
    headers:
      sec-ch-ua: "\" Not A;Brand\";v=\"99\", \"Chromium\";v=\"96\", \"Microsoft Edge\";v=\"96\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/96.0.4664.93 Safari/537.36 Edg/96.0.1054.53"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      sec-fetch-site: "none"
      sec-fetch-mode: "navigate"
      sec-fetch-user: "?1"
      sec-fetch-dest: "document"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6"
      cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://audiences.me/index.php"
    headers:
      cache-control: "max-age=0"
      sec-ch-ua: "\" Not A;Brand\";v=\"99\", \"Chromium\";v=\"96\", \"Microsoft Edge\";v=\"96\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/96.0.4664.93 Safari/537.36 Edg/96.0.1054.53"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      sec-fetch-site: "same-origin"
      sec-fetch-mode: "navigate"
      sec-fetch-user: "?1"
      sec-fetch-dest: "document"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6"
      cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://audiences.me/mybonus.php"
    headers:
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6,ja;q=0.5"
      cache-control: "max-age=0"
      cookie: "{{cookie}}"
      referer: "https://audiences.me/"
      sec-ch-ua: "\" Not;A Brand\";v=\"99\", \"Microsoft Edge\";v=\"103\", \"Chromium\";v=\"103\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      sec-fetch-dest: "document"
      sec-fetch-mode: "navigate"
      sec-fetch-site: "same-origin"
      sec-fetch-user: "?1"
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.5060.53 Safari/537.36 Edg/103.0.1264.37"
