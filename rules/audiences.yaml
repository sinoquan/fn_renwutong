id: audiences
name: Audiences
category: pt
icon: pt
summary: 每日任务（本站无签到，记录爆米花余额）
description: '任务地址：https://audiences.me/mybonus.php

  作用：访问爆米花页并记录当前余额。

  说明：本站 /attendance.php 返回 404，没有每日签到动作，规则只做访问与余额记录。

  '
risk: high
version: 1.2.3
updatedAt: '2026-11-25'
allowedHosts:
- audiences.me
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
  help: 登录站点后按 F12 → Network → 复制 Request Headers 里的 Cookie 整串
defaultTask: checkin
tasks:
- key: checkin
  name: 每日任务
  type: checkin
  description: 访问爆米花页确认登录态（本站无签到，魔力靠做种获得）
  steps:
  - name: 爆米花页
    method: GET
    url: https://audiences.me/mybonus.php
    headers:
      cookie: '{{cookie}}'
      referer: https://audiences.me/
  check:
    notLogin:
    - 请登录
    - login.php
    success:
    - 爆米花系统
    reward:
    - 本次签到获得[\s\S]{0,80}?([0-9,]+(?:\.[0-9]+)?)
    - 本次簽到獲得[\s\S]{0,80}?([0-9,]+(?:\.[0-9]+)?)
    - 签到已得\s*([0-9,]+(?:\.[0-9]+)?)
    - 簽到已得\s*([0-9,]+(?:\.[0-9]+)?)
    - 签到成功[^\d]{0,40}?([0-9,]+(?:\.[0-9]+)?)\s*个
    - 本次獲得[\s\S]{0,60}?([0-9,]+(?:\.[0-9]+)?)
- key: login
  name: 模拟登录
  type: login
  description: 先访问首页、停顿后再确认 Cookie 仍有效；失效会立刻提示你重填
  steps:
  - name: 检查登录态
    method: GET
    url: https://audiences.me/index.php
    headers:
      cookie: '{{cookie}}'
  check:
    notLogin:
    - takelogin.php
    - 登录 / 注册
    - 你需要启用cookies
    - 请登录
    - 登录后方可
    success:
    - logout.php
    - 退出登录
    - 个人中心
    - 我的账户
    - 我的资料
    reward:
    - (?:魔力值|魔力)[^0-9]{0,12}([0-9,]+(?:\.[0-9]+)?)
