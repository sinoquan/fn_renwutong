id: qd-tpl-51793
name: 爱桌游
category: forum
icon: community
summary: 每日任务
description: |
  任务地址：https://www.zhuoyoux.com/lzy/login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.zhuoyoux.com]
fields:
  - key: password
    label: password
    type: password
    required: false
  - key: token
    label: token
    type: text
    required: false
  - key: username
    label: username
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://www.zhuoyoux.com/lzy/login"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:130.0) Gecko/20100101 Firefox/130.0"
      Accept: "application/json, text/plain, */*"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      Content-Type: "application/json;charset=UTF-8"
      ywj: "ywj"
      Origin: "https://www.zhuoyoux.com"
      DNT: "1"
      Sec-GPC: "1"
      Referer: "https://www.zhuoyoux.com/"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=0"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
  - name: 任务
    method: GET
    url: "https://www.zhuoyoux.com/lzy/user/sign"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:130.0) Gecko/20100101 Firefox/130.0"
      Accept: "application/json, text/plain, */*"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      ywj: "ywj"
      Authorization: "{{token}}"
      DNT: "1"
      Sec-GPC: "1"
      Referer: "https://www.zhuoyoux.com/"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=0"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
  - name: 任务
    method: GET
    url: "https://www.zhuoyoux.com/lzy/user/information"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:130.0) Gecko/20100101 Firefox/130.0"
      Accept: "application/json, text/plain, */*"
      Accept-Language: "zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2"
      ywj: "ywj"
      Authorization: "{{token}}"
      DNT: "1"
      Sec-GPC: "1"
      Referer: "https://www.zhuoyoux.com/user?id=1"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=0"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:您已经签到过了"]
