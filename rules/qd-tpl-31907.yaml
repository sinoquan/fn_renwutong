id: qd-tpl-31907
name: 河洛网
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.horou.com/
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.horou.com]
fields:
  - key: formhash
    label: formhash
    type: text
    required: false
  - key: username
    label: username
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://www.horou.com/"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.99 Safari/537.36"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      referer: "https://www.horou.com/"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: POST
    url: "https://www.horou.com/member.php?mod=logging&action=login&loginsubmit=yes&infloat=yes&lssubmit=yes&inajax=1"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      upgrade-insecure-requests: "1"
      origin: "https://www.horou.com"
      content-type: "application/x-www-form-urlencoded"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.99 Safari/537.36"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      referer: "https://www.horou.com/"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: GET
    url: "https://www.horou.com/"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.99 Safari/537.36"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      referer: "https://www.horou.com/"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: GET
    url: "https://www.horou.com/plugin.php?id=k_misign%3Asign&operation=qiandao&format=global_usernav_extra&formhash={{formhash|urlencode}}&inajax=1&ajaxtarget=k_misign_topb"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      x-requested-with: "XMLHttpRequest"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/97.0.4692.99 Safari/537.36"
      accept: "*/*"
      referer: "https://www.horou.com/"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: GET
