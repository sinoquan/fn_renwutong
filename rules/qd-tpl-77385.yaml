id: qd-tpl-77385
name: 幼教库
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.youjiaoku.com/wp-admin/admin-ajax.php
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.youjiaoku.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://www.youjiaoku.com/wp-admin/admin-ajax.php"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:158.0) Gecko/20100101 Firefox/158.0"
      Accept: "application/json, text/javascript, */*; q=0.01"
      Accept-Language: "zh-CN,zh;q=0.9,zh-TW;q=0.8,zh-HK;q=0.7,en-US;q=0.6,en;q=0.5"
      Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
      X-Requested-With: "XMLHttpRequest"
      Origin: "https://www.youjiaoku.com"
      DNT: "1"
      Sec-GPC: "1"
      Referer: "https://www.youjiaoku.com/"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=0"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      TE: "trailers"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://www.youjiaoku.com/wp-admin/admin-ajax.php?action=checkin_details_modal"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:158.0) Gecko/20100101 Firefox/158.0"
      Accept: "*/*"
      Accept-Language: "zh-CN,zh;q=0.9,zh-TW;q=0.8,zh-HK;q=0.7,en-US;q=0.6,en;q=0.5"
      X-Requested-With: "XMLHttpRequest"
      DNT: "1"
      Sec-GPC: "1"
      Referer: "https://www.youjiaoku.com/"
      Cookie: "{{cookie}}"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Priority: "u=0"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
