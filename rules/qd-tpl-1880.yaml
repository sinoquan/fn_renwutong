id: qd-tpl-1880
name: 苹果团
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://appletuan.com/checkins
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [appletuan.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: href
    label: href
    type: text
    required: false
steps:
