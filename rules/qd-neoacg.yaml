id: qd-neoacg
name: NeoACG
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://neoacg.com/member.php?mod=logging&action=login&infloat=yes&handlekey=login&inajax=1&ajaxtarget=fwin_content_login
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [neoacg.com]
fields:
  - key: formhash
    label: formhash
    type: text
    required: false
  - key: idhash
    label: idhash
    type: text
    required: false
  - key: loginhash
    label: loginhash
    type: text
    required: false
  - key: sec
    label: sec
    type: text
    required: false
  - key: seccodeverify
    label: seccodeverify
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://neoacg.com/member.php?mod=logging&action=login&infloat=yes&handlekey=login&inajax=1&ajaxtarget=fwin_content_login"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4636.4 Safari/537.36"
      Referer: "https://neoacg.com/"
  - name: 任务
    method: GET
    url: "https://www.neoacg.com/misc.php?mod=seccode&action=update&idhash={{idhash}}&{{random(0,1,16)}}=&modid=member::logging"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4636.4 Safari/537.36"
      Referer: "https://neoacg.com/member.php?mod=logging&action=login"
  - name: 任务
    method: GET
    url: "https://neoacg.com/{{sec}}"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4636.4 Safari/537.36"
      Referer: "https://neoacg.com/member.php?mod=logging&action=login"
  - name: 任务
    method: GET
    url: "https://neoacg.com/misc.php?mod=seccode&action=check&inajax=1&modid=member::logging&idhash={{idhash}}&secverify={{seccodeverify}}"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4636.4 Safari/537.36"
      Referer: "https://neoacg.com/"
  - name: 任务
    method: POST
    url: "https://neoacg.com/member.php?mod=logging&action=login&loginsubmit=yes&handlekey=login&loginhash={{loginhash}}&inajax=1"
    headers:
      Origin: "https://neoacg.com"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4636.4 Safari/537.36"
      Referer: "https://neoacg.com/member.php?mod=logging&action=login"
  - name: 任务
    method: GET
    url: "https://neoacg.com/plugin.php?id=dsu_paulsign:sign"
    headers:
      Referer: "https://neoacg.com/"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4636.4 Safari/537.36"
  - name: 任务
    method: POST
    url: "https://neoacg.com/plugin.php?id=dsu_paulsign:sign&operation=qiandao&infloat=1&inajax=1"
    headers:
      Referer: "https://neoacg.com/plugin.php?id=dsu_paulsign:sign"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4636.4 Safari/537.36"
  - name: 任务
    method: GET
    url: "https://neoacg.com/plugin.php?id=dsu_paulsign:sign"
    headers:
      Referer: "https://neoacg.com/"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4636.4 Safari/537.36"
check:
  notLogin: ["登录失败", "您需要先登录", "您需要先登录"]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
