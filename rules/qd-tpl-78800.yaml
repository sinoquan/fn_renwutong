id: qd-tpl-78800
name: 爱快论坛
category: forum
icon: community
summary: 每日签到
description: |
  任务地址：https://bbs.ikuai8.com/plugin.php?id=k_misign:sign
  作用：完成站点「爱快签到」插件的每日签到。
  执行：先打开签到页取 formhash，再带着令牌提交签到（两步）。
  说明：签到成功返回「签到成功」；当天已签到返回「今日已签」。
risk: high
version: 1.2.0
updatedAt: 2026-11-21
allowedHosts: [bbs.ikuai8.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
    help: 登录后按 F12 → Network → 复制 Request Headers 里的 Cookie 整串
steps:
  - name: 取签到令牌
    method: GET
    url: "https://bbs.ikuai8.com/plugin.php?id=k_misign:sign"
    headers:
      cookie: "{{cookie}}"
      referer: "https://bbs.ikuai8.com/"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
    # formhash 藏在「退出登录」链接里，形如 formhash=c4c9146d
    capture:
      fh: 'formhash[^0-9a-zA-Z]{0,20}([0-9a-f]{8})'
  - name: 提交签到
    method: GET
    url: "https://bbs.ikuai8.com/plugin.php?id=k_misign:sign&operation=qiandao&format=button&formhash={{fh}}"
    headers:
      cookie: "{{cookie}}"
      referer: "https://bbs.ikuai8.com/plugin.php?id=k_misign:sign"
      x-requested-with: "XMLHttpRequest"
      accept: "text/html,application/xml,*/*;q=0.8"
check:
  notLogin: [您需要先登录, 请先登录, 请登录后]
  already: [今日已签]
  # 注意：签到页本身含「连续签到」「今日签到」等文案，不能当成功判据，
  # 否则会变成「打开页面就算成功」。只认签到接口真正返回的措辞。
  success: [签到成功, 签到奖励]
