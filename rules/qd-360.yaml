id: qd-360
name: 360积分中心
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://app.jf.360.cn/signin/signin/start?cb=jsonpCB_{{time|urlencode}}&os_type=pc&tag=H5&app_id=1025&source_id=1024&is_encrypt=0&pctag=pc&biz_data=%7B%7D&_={{time|urlencode}}
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [app.jf.360.cn]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://app.jf.360.cn/signin/signin/start?cb=jsonpCB_{{time|urlencode}}&os_type=pc&tag=H5&app_id=1025&source_id=1024&is_encrypt=0&pctag=pc&biz_data=%7B%7D&_={{time|urlencode}}"
    headers:
      Referer: "https://jf.360.cn/"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36"
      Cookie: "{{cookie}}"
check:
  notLogin: ["用户未登录", "用户登录信息已失效", "重新登录"]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:今日已签到"]
