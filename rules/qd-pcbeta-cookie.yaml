id: qd-pcbeta-cookie
name: pcbeta_cookie版
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://i.pcbeta.com/home.php?mod=task
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [i.pcbeta.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://i.pcbeta.com/home.php?mod=task"
    headers:
      cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://i.pcbeta.com/home.php?mod=task&do=apply&id=149"
    headers:
      cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://i.pcbeta.com/home.php?mod=task&do=draw&id=149"
    headers:
      cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://i.pcbeta.com/home.php?mod=spacecp&ac=credit"
    headers:
      cookie: "{{cookie}}"
check:
  notLogin: ["需要先登录"]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:302", "regex:已申请过此任务", "regex:成功完成", "regex:不是进行中"]
