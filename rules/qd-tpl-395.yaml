id: qd-tpl-395
name: 猴岛论坛
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://bbs.houdao.com/
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [bbs.houdao.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://bbs.houdao.com/"
    headers:
      Upgrade-Insecure-Requests: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/78.0.3904.108 Safari/537.36"
      Sec-Fetch-User: "?1"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3"
      Sec-Fetch-Site: "none"
      Sec-Fetch-Mode: "navigate"
      Accept-Language: "zh-CN,zh;q=0.9"
      Cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://bbs.houdao.com/jobcenter.php?action=punch&ajax=1&punchverify={{punchverify|urlencode}}&nowtime={{t|urlencode}}&verify={{verifyhash|urlencode}}"
    headers:
      Cache-Control: "max-age=0"
      Origin: "https://bbs.houdao.com"
      Upgrade-Insecure-Requests: "1"
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/78.0.3904.108 Safari/537.36"
      Sec-Fetch-User: "?1"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "nested-navigate"
      Accept-Language: "zh-CN,zh;q=0.9"
      Cookie: "{{cookie}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
