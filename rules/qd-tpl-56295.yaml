id: qd-tpl-56295
name: 酷家乐
category: tool
icon: community
summary: 每日任务
description: |
  任务地址：https://www.kujiale.com/api/info/global
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.kujiale.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://www.kujiale.com/api/info/global"
    headers:
      accept: "*/*"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
      cache-control: "no-cache"
      cookie: "{{cookie}}"
      dnt: "1"
      origin: "https://www.kujiale.com"
      pragma: "no-cache"
      referer: "https://www.kujiale.com/"
      sec-gpc: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/104.0.0.0 Safari/537.36"
  - name: 任务
    method: PUT
    url: "https://www.kujiale.com/motivate/api/sign_in"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
      Accept: "application/json, text/plain, */*"
      sec-ch-ua-mobile: "?0"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      sec-ch-ua-platform: "\"Windows\""
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Dest: "empty"
      Referer: "https://www.kujiale.com/pub/saas/workbench/pwork/mydesign?from=home_login_redirect"
      Accept-Language: "zh-CN,zh;q=0.9"
      Origin: "https://www.kujiale.com"
  - name: 任务
    method: GET
    url: "https://www.kujiale.com/api/motivate/exp/info/front"
    headers:
      accept: "application/json, text/plain, */*"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
      cache-control: "no-cache"
      dnt: "1"
      pragma: "no-cache"
      referer: "https://www.kujiale.com/"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/104.0.0.0 Safari/537.36"
  - name: 任务
    method: GET
    url: "https://www.kujiale.cn/usercenter/api/kubi/info?includePoint=true"
    headers:
      accept: "application/json, text/plain, */*"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
      cache-control: "no-cache"
      dnt: "1"
      pragma: "no-cache"
      referer: "https://www.kujiale.com/"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/104.0.0.0 Safari/537.36"
  - name: 任务
    method: GET
    url: "https://www.kujiale.com/motivate/api/sign_in/detail"
    headers:
      sec-ch-ua: "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\""
      Accept: "application/json, text/plain, */*"
      sec-ch-ua-mobile: "?0"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36"
      sec-ch-ua-platform: "\"Windows\""
      Referer: "https://www.kujiale.com/pub/saas/workbench/pwork/mydesign?from=home_auto_redirect"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
