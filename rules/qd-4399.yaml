id: qd-4399
name: 4399小游戏
category: game
icon: community
summary: 每日任务
description: |
  任务地址：https://my.4399.com/plugins/sign/set-t-{{timestamp}}
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [my.4399.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: timestamp
    label: timestamp
    type: text
    required: false
steps:
  - name: 任务
    method: GET
    url: "https://my.4399.com/plugins/sign/set-t-{{timestamp}}"
    headers:
      Accept: "application/json, text/javascript, */*; q=0.01"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6,zh-Hans;q=0.5"
      Referer: "https://my.4399.com/"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36 Edg/153.0.0.0"
      X-Requested-With: "XMLHttpRequest"
      sec-ch-ua: "\"Microsoft Edge\";v=\"153\", \"Not_A Brand\";v=\"8\", \"Chromium\";v=\"153\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://my.4399.com/home/index-getUserCreditInfo?callback=setUserInfo"
    headers:
      Accept: "text/javascript, application/javascript, application/ecmascript, application/x-ecmascript, */*; q=0.01"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6,zh-Hans;q=0.5"
      Referer: "https://my.4399.com/"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36 Edg/153.0.0.0"
      X-Requested-With: "XMLHttpRequest"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Cookie: "{{cookie}}"
check:
  notLogin: ["Not logined|请先登录|登录后签到", "请先登录|登录后"]
  already: [已签到, 已经签到, 今日已签到]
  success: ["regex:\"code\":\\s*\\d+", "regex:setUserInfo\\(\\{", "regex:\"uid\":\"[^\"]+\"", "regex:\"username\":\"[^\"]*\"", "regex:\"credit\":\"[^\"]*\""]
