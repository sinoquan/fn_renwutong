id: qd-tpl-95739
name: 立创开源平台任务
category: other
icon: community
summary: 每日任务
description: '任务地址：https://passport.jlc.com/api/cas/sso/check-login

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- passport.jlc.com
fields:
- key: code
  label: code
  type: text
  required: false
- key: cookie
  label: Cookie
  type: password
  required: true
- key: cookies
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: POST
  url: https://passport.jlc.com/api/cas/sso/check-login
  headers:
    Content-Type: 'application/json;charset=UTF-8 '
    Cookie: '{{cookie}}'
- name: 任务
  method: POST
  url: https://oshwhub.com/api/login/login-by-code
  headers:
    Content-Type: application/json;charset=UTF-8
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://oshwhub.com/api/users/getSignInProfile?_t={{time16|truncate(14,True,'',0)|urlencode}}
  headers:
    cookie: '{{cookies}}'
    Accept: application/json, text/plain, */*
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
    Content-Type: application/json;charset=UTF-8
    DNT: '1'
    Origin: https://oshwhub.com
    Referer: https://oshwhub.com/sign_in
    Sec-Fetch-Dest: empty
    Sec-Fetch-Mode: cors
    Sec-Fetch-Site: same-origin
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36 Edg/130.0.0.0
    sec-ch-ua: '"Chromium";v="130", "Microsoft Edge";v="130", "Not?A_Brand";v="99"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
- name: 任务
  method: POST
  url: https://oshwhub.com/api/users/signIn
  headers:
    cookie: '{{cookies}}'
    Accept: application/json, text/plain, */*
    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6
    Content-Type: application/json;charset=UTF-8
    DNT: '1'
    Origin: https://oshwhub.com
    Referer: https://oshwhub.com/sign_in
    Sec-Fetch-Dest: empty
    Sec-Fetch-Mode: cors
    Sec-Fetch-Site: same-origin
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36 Edg/130.0.0.0
    sec-ch-ua: '"Chromium";v="130", "Microsoft Edge";v="130", "Not?A_Brand";v="99"'
    sec-ch-ua-mobile: ?0
    sec-ch-ua-platform: '"Windows"'
- name: 任务
  method: GET
  url: https://oshwhub.com/api/users/signInRecord?startTime={{timestamp()|int-172800}}000&endTime={{timestamp()|int+172800}}000
  headers:
    cookie: '{{cookies}}'
check:
  notLogin:
  - '"isLogin":false,"loginEnabled":false'
  already:
  - 已签到
  - 已经签到
  - 今日已签到
  success:
  - regex:"isLogin":true
  - regex:"result":{}
  - regex:"code":0
