id: qd-tpl-98951
name: 经管之家
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://bbs.pinggu.org/
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [bbs.pinggu.org]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://bbs.pinggu.org/"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      Upgrade-Insecure-Requests: "1"
      Origin: "https://bbs.pinggu.org"
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Referer: "https://bbs.pinggu.org/"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://bbs.pinggu.org/plugin.php?id=dsu_paulsign%3Asign&operation=qiandao&infloat=1&inajax=1"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      Upgrade-Insecure-Requests: "1"
      Origin: "https://bbs.pinggu.org"
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Referer: "https://bbs.pinggu.org/plugin.php?id=dsu_paulsign:sign"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
  - name: 任务
    method: GET
    url: "https://bbs.pinggu.org/home.php?mod=spacecp&ac=credit"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      Upgrade-Insecure-Requests: "1"
      Origin: "https://bbs.pinggu.org"
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Referer: "https://bbs.pinggu.org/home.php?mod=spacecp&ac=userpic"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
