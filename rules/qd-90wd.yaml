id: qd-90wd
name: 90wd论坛任务
category: forum
icon: community
summary: 每日签到
description: |
  任务地址：http://www.90wd.net/
  作用：Discuz「每日签到」（dsu_paulsign）插件。先取 formhash，再带签到心情提交。

  要点：这个插件提交时必须带 qdxq（签到心情）和 formhash，缺一个就回
  「你选择的心情不正确」或「未定义操作」。qdxq=kx 是「开心」。
risk: none
version: 1.1.0
updatedAt: 2026-11-23
allowedHosts: [www.90wd.net]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  # ① 打开签到页，抓 formhash
  - name: 打开签到页
    method: GET
    url: "http://www.90wd.net/plugin.php?id=dsu_paulsign:sign"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9"
      Cookie: "{{cookie}}"
    capture:
      formhash: 'formhash=([0-9a-fA-F]{8})'

  # ② 提交签到：qdxq 是签到心情，省略会被拒
  - name: 提交签到
    method: GET
    url: "http://www.90wd.net/plugin.php?id=dsu_paulsign%3Asign&operation=qiandao&qdxq=kx&infloat=1&inajax=1&formhash={{formhash|urlencode}}"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36"
      Accept: "*/*"
      Accept-Language: "zh-CN,zh;q=0.9"
      X-Requested-With: "XMLHttpRequest"
      Referer: "http://www.90wd.net/plugin.php?id=dsu_paulsign:sign"
      Cookie: "{{cookie}}"

  # ③ 再开一次签到页确认状态
  - name: 确认签到结果
    method: GET
    url: "http://www.90wd.net/plugin.php?id=dsu_paulsign:sign"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9"
      Cookie: "{{cookie}}"
check:
  notLogin: [请登录, 您需要先登录]
  already: [已经签到, 今日已经签到, 请明天再来, 已签到]
  success: [签到成功, 恭喜你签到成功, 获得随机奖励]
