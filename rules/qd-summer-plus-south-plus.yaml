id: qd-summer-plus-south-plus
name: summer-plus(原south-plus)
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://south-plus.net/plugin.php?H_name-tasks.html
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [south-plus.net]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
  - key: ua
    label: ua
    type: text
    required: false
steps:
  - name: 任务
    method: GET
    url: "https://south-plus.net/plugin.php?H_name-tasks.html"
    headers:
      User-Agent: "{{ ua }}"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9"
      Referer: "https://south-plus.net/"
      Cookie: "{{ cookie }}"
  - name: 任务
    method: GET
    url: "https://south-plus.net/plugin.php?H_name=tasks&action=ajax&actions=job&cid=14&nowtime={{ multiply(timestamp('float'), 1000)|int }}&verify={{ verifyhash|urlencode }}"
    headers:
      User-Agent: "{{ ua }}"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9"
      Referer: "https://south-plus.net/plugin.php?H_name-tasks.html"
      Cookie: "{{ cookie }}"
  - name: 任务
    method: GET
    url: "https://south-plus.net/plugin.php?H_name=tasks&action=ajax&actions=job&cid=15&nowtime={{ multiply(timestamp('float'), 1000)|int }}&verify={{ verifyhash|urlencode }}"
    headers:
      User-Agent: "{{ ua }}"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9"
      Referer: "https://south-plus.net/plugin.php?H_name-tasks.html"
      Cookie: "{{ cookie }}"
  - name: 任务
    method: GET
    url: "https://south-plus.net/plugin.php?H_name=tasks&action=ajax&actions=job2&cid=14&nowtime={{ multiply(timestamp('float'), 1000)|int }}&verify={{ verifyhash|urlencode }}"
    headers:
      User-Agent: "{{ ua }}"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9"
      Referer: "https://south-plus.net/plugin.php?H_name-tasks.html"
      Cookie: "{{ cookie }}"
  - name: 任务
    method: GET
    url: "https://south-plus.net/plugin.php?H_name=tasks&action=ajax&actions=job2&cid=15&nowtime={{ multiply(timestamp('float'), 1000)|int }}&verify={{ verifyhash|urlencode }}"
    headers:
      User-Agent: "{{ ua }}"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9"
      Referer: "https://south-plus.net/plugin.php?H_name-tasks.html"
      Cookie: "{{ cookie }}"
  - name: 任务
    method: GET
    url: "https://south-plus.net/userpay.php"
    headers:
      User-Agent: "{{ ua }}"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      Accept-Language: "zh-CN,zh;q=0.9"
      Referer: "https://south-plus.net/plugin.php?H_name-tasks.html"
      Cookie: "{{ cookie }}"
