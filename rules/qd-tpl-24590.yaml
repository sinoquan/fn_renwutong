id: qd-tpl-24590
name: 成都吃喝玩乐网
category: forum
icon: community
summary: 每日任务
description: '任务地址：https://www.52ch.net/

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- www.52ch.net
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
steps:
- name: 任务
  method: GET
  url: https://www.52ch.net/
  headers:
    Cache-Control: max-age=0
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/55.0.2883.87 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8
    Referer: https://www.52ch.net/dsu_paulsign-sign.html
    Accept-Language: zh-CN,zh;q=0.8
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://www.52ch.net/dsu_paulsign-sign.html
  headers:
    Upgrade-Insecure-Requests: '1'
    User-Agent: Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/55.0.2883.87 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8
    Referer: https://www.52ch.net/
    Accept-Language: zh-CN,zh;q=0.8
    Cookie: '{{cookie}}'
- name: 打开签到页
  method: GET
  url: https://www.52ch.net/plugin.php?id=dsu_paulsign:sign
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Language: zh-CN,zh;q=0.9
    Referer: https://www.52ch.net/
    Cookie: '{{cookie}}'
  capture:
    formhash: formhash=([0-9a-fA-F]{8})
- name: 提交签到
  method: GET
  url: https://www.52ch.net/plugin.php?id=dsu_paulsign%3Asign&operation=qiandao&qdxq=kx&infloat=1&inajax=1&formhash={{formhash|urlencode}}
  headers:
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36
    Accept: '*/*'
    Accept-Language: zh-CN,zh;q=0.9
    X-Requested-With: XMLHttpRequest
    Referer: https://www.52ch.net/plugin.php?id=dsu_paulsign:sign
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: http://encode.chahuo.com/urlencode.php?s=%E6%81%AD%E5%96%9C%E4%BD%A0%E7%AD%BE%E5%88%B0%E6%88%90%E5%8A%9F!%E8%8E%B7%E5%BE%97%E9%9A%8F%E6%9C%BA%E5%A5%96%E5%8A%B1%20%E5%90%83%E5%96%9D%E5%B8%81%20{{chb|urlencode}}%20%E4%B8%AA.%C2%A0&t=urldecode
  headers:
    Cookie: '{{cookie}}'
check:
  notLogin:
  - 请登录
  - 登录后方可
  already:
  - 已经签到
  - 今日已经签到
  - 请明天再来
  - 已签到
  success:
  - 签到成功
  - 恭喜你签到成功
  - 获得随机奖励
