id: tjupt
name: "北洋园PT"
category: pt
icon: pt
summary: 需要手工签到（图片验证码）
description: |
  站点地址：https://tjupt.org/ / https://www.tjupt.org/
  作用：签到、模拟登录。
  签到：调用站点自带的签到页 /attendance.php。
  来源：站点清单取自 PT-depiler（MIT 许可），规则按本项目模板生成。
  探活 2026-11-21：探活通过（NexusPHP 登录页）
risk: high
version: 1.4.1
updatedAt: 2026-11-24
allowedHosts: [tjupt.org, www.tjupt.org]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
defaultTask: checkin
tasks:
  - key: checkin
    name: 提醒签到
    type: checkin
    description: 不发起请求，只提醒（签到页需人工选图片验证码）
    # 任务级人工：只有"签到"这一步做不了；同站的"模拟登录"照常执行。
    manual: true
    manualHint: "签到要选图片对应的影视名（人机验证），程序做不了。点站点地址打开后自己签一下。"
    check:
      success: ["签到"]
  - key: login
    name: 模拟登录
    type: login
    description: 访问首页确认 Cookie 仍有效；未登录会被重定向到登录页
    steps:
      - name: 检查登录态
        method: GET
        url: "https://tjupt.org/"
        headers:
          cookie: "{{cookie}}"
    check:
      notLogin: ["takelogin.php", "login.php?returnto", "你需要启用cookies"]
      success: ["logout.php", "退出登录", "个人中心", "我的账户", "我的资料"]
