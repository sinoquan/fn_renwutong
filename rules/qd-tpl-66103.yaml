id: qd-tpl-66103
name: 一番魂
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://hunacg.cc/
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [hunacg.cc]
fields:
  - key: ua
    label: ua
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://hunacg.cc/"
    headers:
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
      accept-language: "zh-CN,zh;q=0.9"
      cache-control: "no-cache"
      dnt: "1"
      pragma: "no-cache"
      priority: "u=0, i"
      referer: "https://yifanhune.com/"
      sec-fetch-dest: "document"
      sec-fetch-mode: "navigate"
      sec-fetch-site: "same-origin"
      sec-fetch-user: "?1"
      upgrade-insecure-requests: "1"
      user-agent: "{{ua}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
