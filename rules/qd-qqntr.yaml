      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "Mozilla/5.0 (Windows NT 6.1; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-User: "?1"
      Sec-Fetch-Dest: "iframe"
      Referer: "https://www.iya.app/plugin.php?id=dsu_paulsign%3Asign"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6"
  - name: 任务
    method: GET
    url: "https://www.iya.app/plugin.php?id=dsu_paulsign%3Asign"
    headers:
      sec-ch-ua: "\"Google Chrome\";v=\"103\", \"Chromium\";v=\"103\", \"Not=A?Brand\";v=\"24\""
      sec-ch-ua-mobile: "?0"
      sec-ch-ua-platform: "\"Windows\""
      Upgrade-Insecure-Requests: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 6.1; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7"
      Sec-Fetch-Site: "same-origin"
      Sec-Fetch-Mode: "navigate"
      Sec-Fetch-User: "?1"
      Sec-Fetch-Dest: "document"
      Referer: "https://www.iya.app/"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6"
