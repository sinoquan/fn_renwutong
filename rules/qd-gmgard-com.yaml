id: qd-gmgard-com
name: gmgard.com绅士之庭
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://gmgard.com/api/PunchIn/Do
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [gmgard.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://gmgard.com/api/PunchIn/Do"
    headers:
      accept: "*/*"
      x-requested-with: "XMLHttpRequest"
      content-type: "application/json"
      origin: "https://gmgard.com"
      sec-fetch-site: "same-origin"
      sec-fetch-mode: "cors"
      sec-fetch-dest: "empty"
      referer: "https://gmgard.com/"
      accept-language: "zh-CN,zh;q=0.9"
      cookie: "{{cookie}}"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
