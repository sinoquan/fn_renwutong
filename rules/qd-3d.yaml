id: qd-3d
name: 3D溜溜网
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://user.3d66.com/sign/Sign_In_Api/run
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [user.3d66.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://user.3d66.com/sign/Sign_In_Api/run"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      accept: "*/*"
      content-type: "application/x-www-form-urlencoded; charset=UTF-8"
      x-requested-with: "XMLHttpRequest"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/96.0.4664.110 Safari/537.36"
      origin: "https://user.3d66.com"
      referer: "https://user.3d66.com/www/www_index_layout/index?data-type=rightbar"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
      cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://user.3d66.com/"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      accept: "*/*"
      x-requested-with: "XMLHttpRequest"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/96.0.4664.110 Safari/537.36"
      referer: "https://www.3d66.com/"
      accept-language: "zh-CN,zh;q=0.9,en;q=0.8"
check:
  notLogin: ["登录信息失效,请重新登录"]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
