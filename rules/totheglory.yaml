id: totheglory
name: ToTheGlory
category: pt
icon: pt
summary: 每日任务
description: |
  任务地址：https://totheglory.im/my.php
  作用：调用该站点自己的任务接口完成每日任务。
risk: high
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [totheglory.im]
fields:
  - key: cookies
    label: Cookie
    type: password
    required: true
  - key: id
    label: id
    type: text
    required: false
steps:
  - name: 任务
    method: GET
    url: "https://totheglory.im/my.php"
    headers:
      pragma: "no-cache"
      cache-control: "no-cache"
      upgrade-insecure-requests: "1"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/71.0.3578.98 Safari/537.36"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8"
      referer: "https://totheglory.im/login.php"
      cookie: "{{cookies}}"
  - name: 任务
    method: POST
    url: "https://totheglory.im/signed.php"
    headers:
      origin: "https://totheglory.im"
      x-requested-with: "XMLHttpRequest"
      cookie: "{{cookies}}"
      pragma: "no-cache"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/71.0.3578.98 Safari/537.36"
      content-type: "application/x-www-form-urlencoded"
      accept: "*/*"
      cache-control: "no-cache"
      referer: "https://totheglory.im/my.php"
  - name: 任务
    method: POST
    url: "https://totheglory.im/userdetails.php?id={{id|urlencode}}"
    headers:
      origin: "https://totheglory.im"
      x-requested-with: "XMLHttpRequest"
      cookie: "{{cookies}}"
      pragma: "no-cache"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/71.0.3578.98 Safari/537.36"
      content-type: "application/x-www-form-urlencoded"
      accept: "*/*"
      cache-control: "no-cache"
      referer: "https://totheglory.im/my.php"
check:
  notLogin: ["https://totheglory.im/login.php", "失败登录", "https://totheglory.im/login.php", "失败登录"]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
