id: totheglory
name: ToTheGlory
category: pt
icon: pt
summary: 每日任务
description: '任务地址：https://totheglory.im/my.php

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: high
version: 1.1.5
updatedAt: '2026-11-25'
allowedHosts:
- totheglory.im
fields:
- key: cookies
  label: Cookie
  type: password
  required: true
- key: id
  label: id
  type: text
  required: false
defaultTask: checkin
tasks:
- key: checkin
  name: 每日签到
  type: checkin
  description: 打开任务页完成每日签到
  steps:
  - name: 任务
    method: GET
    url: https://totheglory.im/my.php
    headers:
      pragma: no-cache
      cache-control: no-cache
      upgrade-insecure-requests: '1'
      user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/71.0.3578.98 Safari/537.36
      accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8
      referer: https://totheglory.im/login.php
      cookie: '{{cookies}}'
  - name: 任务
    method: POST
    url: https://totheglory.im/signed.php
    headers:
      origin: https://totheglory.im
      x-requested-with: XMLHttpRequest
      cookie: '{{cookies}}'
      pragma: no-cache
      user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/71.0.3578.98 Safari/537.36
      content-type: application/x-www-form-urlencoded
      accept: '*/*'
      cache-control: no-cache
      referer: https://totheglory.im/my.php
  - name: 任务
    method: POST
    url: https://totheglory.im/userdetails.php?id={{id|urlencode}}
    headers:
      origin: https://totheglory.im
      x-requested-with: XMLHttpRequest
      cookie: '{{cookies}}'
      pragma: no-cache
      user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/71.0.3578.98 Safari/537.36
      content-type: application/x-www-form-urlencoded
      accept: '*/*'
      cache-control: no-cache
      referer: https://totheglory.im/my.php
  check:
    notLogin:
    - https://totheglory.im/login.php
    - 失败登录
    - https://totheglory.im/login.php
    - 失败登录
    already:
    - 已签到
    - 已经签到
    - 今日已签到
    success:
    - 签到成功
    - 签到获得
    - 获得魔力
    - 获得积分
    reward:
    - 本次签到获得[\s\S]{0,80}?([0-9,]+(?:\.[0-9]+)?)
    - 本次簽到獲得[\s\S]{0,80}?([0-9,]+(?:\.[0-9]+)?)
    - 签到已得\s*([0-9,]+(?:\.[0-9]+)?)
    - 簽到已得\s*([0-9,]+(?:\.[0-9]+)?)
    - 签到成功[^\d]{0,40}?([0-9,]+(?:\.[0-9]+)?)\s*个
    - 本次獲得[\s\S]{0,60}?([0-9,]+(?:\.[0-9]+)?)
- key: login
  name: 模拟登录
  type: login
  description: 先访问首页、停顿后再确认 Cookie 仍有效；失效会立刻提示你重填
  steps:
  - name: 检查登录态
    method: GET
    url: https://totheglory.im/index.php
    headers:
      cookie: '{{cookies}}'
  check:
    notLogin:
    - takelogin.php
    - 登录 / 注册
    - 你需要启用cookies
    - 请登录
    - 登录后方可
    success:
    - logout.php
    - 退出登录
    - 个人中心
    - 我的账户
    - 我的资料
    reward:
    - (?:魔力值|魔力)[^0-9]{0,12}([0-9,]+(?:\.[0-9]+)?)
