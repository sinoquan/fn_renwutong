id: qd-acgfun
name: AcgFun
category: game
icon: community
summary: 每日任务
description: '任务地址：https://erciyuan.org

  作用：调用该站点自己的任务接口完成每日任务。

  '
risk: none
version: 1.1.0
updatedAt: '2026-11-23'
allowedHosts:
- erciyuan.org
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
- key: d
  label: d
  type: text
  required: false
- key: password
  label: password
  type: password
  required: false
- key: uid
  label: uid
  type: text
  required: false
- key: username
  label: username
  type: text
  required: false
steps:
- name: 任务
  method: GET
  url: https://erciyuan.org
  headers:
    Cookie: '{{cookie}}'
- name: 任务
  method: POST
  url: https://{{d}}/member.php?mod=logging&action=login&loginsubmit=yes&handlekey=login&inajax=1
  headers:
    cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://{{d}}/plugin.php?id=k_misign%3Asign
  headers:
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://{{d}}/plugin.php?id=k_misign%3Asign&operation=qiandao&formhash={{formhash|urlencode}}&format=empty&inajax=1&ajaxtarget=JD_sign
  headers:
    Cookie: '{{cookie}}'
- name: 任务
  method: GET
  url: https://{{d}}/space-uid-{{uid}}.html
  headers:
    Cookie: '{{cookie}}'
check:
  notLogin:
  - 请登录
  - 登录后方可
  already:
  - 已签到
  - 已经签到
  - 今日已签到
  success:
  - regex:欢迎
  - regex:注销登录
