id: qd-t00ls
name: t00ls论坛
category: forum
icon: community
summary: 每日任务
description: |
  任务地址：https://www.t00ls.com/login.json
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.t00ls.com]
fields:
  - key: answer
    label: answer
    type: text
    required: false
  - key: formhash
    label: formhash
    type: text
    required: false
  - key: password
    label: password
    type: password
    required: false
  - key: questionid
    label: questionid
    type: text
    required: false
  - key: uid
    label: uid
    type: text
    required: false
  - key: username
    label: username
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://www.t00ls.com/login.json"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/79.0.3945.88 Safari/537.36"
  - name: 任务
    method: GET
    url: "https://www.t00ls.com/members-profile.json"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/79.0.3945.88 Safari/537.36"
  - name: 任务
    method: POST
    url: "https://www.t00ls.com/ajax-sign.json"
    headers:
      Referer: "https://www.t00ls.com/members-profile-{{uid}}.html"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/79.0.3945.88 Safari/537.36"
check:
  notLogin: [请登录, 登录后方可]
  already: [已签到, 已经签到, 今日已签到]
  success: [签到成功, 签到获得, 获得魔力, 获得积分]
