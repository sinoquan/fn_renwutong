id: qd-xuejieba-checkin-native
name: xuejieba-checkin.native
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://xuejieba18.com/wp-json/jwt-auth/v1/token
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [xuejieba18.com]
fields:
  - key: xjb_auth_token
    label: xjb_auth_token
    type: text
    required: false
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: POST
    url: "https://xuejieba18.com/wp-json/jwt-auth/v1/token"
    headers:
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "Mozilla/5.0"
      Referer: "https://xuejieba18.com/task"
      Accept: "application/json, text/plain, */*"
  - name: 任务
    method: POST
    url: "https://xuejieba18.com/wp-json/b2/v1/getUserMission"
    headers:
      Authorization: "Bearer {{xjb_auth_token}}"
      User-Agent: "Mozilla/5.0"
      Referer: "https://xuejieba18.com/task"
      Accept: "application/json, text/plain, */*"
      Content-Type: "application/x-www-form-urlencoded"
  - name: 任务
    method: POST
    url: "https://xuejieba18.com/wp-json/b2/v1/getUserInfo"
    headers:
      Authorization: "Bearer {{xjb_auth_token}}"
      User-Agent: "Mozilla/5.0"
      Referer: "https://xuejieba18.com/task"
      Accept: "application/json, text/plain, */*"
  - name: 任务
    method: POST
    url: "https://xuejieba18.com/wp-json/b2/v1/getTaskData"
    headers:
      Authorization: "Bearer {{xjb_auth_token}}"
      User-Agent: "Mozilla/5.0"
      Referer: "https://xuejieba18.com/task"
      Accept: "application/json, text/plain, */*"
  - name: 任务
    method: POST
    url: "https://xuejieba18.com/wp-json/b2/v1/userMission"
    headers:
      Authorization: "Bearer {{xjb_auth_token}}"
      User-Agent: "Mozilla/5.0"
      Referer: "https://xuejieba18.com/task"
      Accept: "application/json, text/plain, */*"
  - name: 任务
    method: POST
    url: "https://xuejieba18.com/wp-json/b2/v1/getUserMission"
    headers:
      Authorization: "Bearer {{xjb_auth_token}}"
      User-Agent: "Mozilla/5.0"
      Referer: "https://xuejieba18.com/task"
      Accept: "application/json, text/plain, */*"
      Content-Type: "application/x-www-form-urlencoded"
  - name: 任务
    method: POST
    url: "https://xuejieba18.com/wp-json/b2/v1/getUserInfo"
    headers:
      Authorization: "Bearer {{xjb_auth_token}}"
      User-Agent: "Mozilla/5.0"
      Referer: "https://xuejieba18.com/task"
      Accept: "application/json, text/plain, */*"
