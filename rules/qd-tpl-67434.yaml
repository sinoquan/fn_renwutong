id: qd-tpl-67434
name: 飞牛私有云论坛
aliases: [飞牛论坛, fnOS 论坛]
category: forum
icon: community
summary: 每日打卡
description: |
  任务地址：https://club.fnnas.com/plugin.php?id=zqlj_sign
  作用：完成站点自带「天天打卡」插件的每日打卡。
  执行：先打开打卡页取本次的 sign 令牌，再带着令牌提交（两步）。
  说明：当天已打卡会返回「您今天已经打过卡了，请勿重复操作」。
risk: high
version: 1.2.0
updatedAt: 2026-11-21
allowedHosts: [club.fnnas.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
    help: 登录后按 F12 → Network → 复制 Request Headers 里的 Cookie 整串
steps:
  - name: 取打卡令牌
    method: GET
    url: "https://club.fnnas.com/plugin.php?id=zqlj_sign"
    headers:
      cookie: "{{cookie}}"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
    # 打卡链接形如 plugin.php?id=zqlj_sign&sign=f11e5601，令牌每次会话都可能变
    capture:
      sign: 'plugin\.php\?id=zqlj_sign&sign=([0-9a-f]+)'
  - name: 提交打卡
    method: GET
    url: "https://club.fnnas.com/plugin.php?id=zqlj_sign&sign={{sign}}"
    headers:
      cookie: "{{cookie}}"
      referer: "https://club.fnnas.com/plugin.php?id=zqlj_sign"
      accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
check:
  notLogin: [您需要先登录, 请先登录, 请登录后]
  already: [已经打过卡, 请勿重复操作]
  success: [打卡成功, 签到成功]
