id: qd-tpl-11089
name: 一加社区
category: other
icon: community
summary: 每日任务
description: |
  任务地址：https://www.oneplusbbs.com/plugin-dsu_paulsign:sign.html
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [www.oneplusbbs.com]
fields:
  - key: cookie
    label: Cookie
    type: password
    required: true
steps:
  - name: 任务
    method: GET
    url: "https://www.oneplusbbs.com/plugin-dsu_paulsign:sign.html"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      Upgrade-Insecure-Requests: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4636.4 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Referer: "https://www.oneplusbbs.com/"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Cookie: "{{cookie}}"
  - name: 任务
    method: POST
    url: "https://www.oneplusbbs.com/plugin.php?id=dsu_paulsign%3Asign&operation=qiandao&infloat=1&inajax=1"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      Origin: "https://www.oneplusbbs.com"
      Upgrade-Insecure-Requests: "1"
      Content-Type: "application/x-www-form-urlencoded"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4636.4 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Referer: "https://www.oneplusbbs.com/plugin-dsu_paulsign:sign.html"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Cookie: "{{cookie}}"
  - name: 任务
    method: GET
    url: "https://www.oneplusbbs.com/plugin.php?id=dsu_paulsign%3Asign"
    headers:
      Pragma: "no-cache"
      Cache-Control: "no-cache"
      Upgrade-Insecure-Requests: "1"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4636.4 Safari/537.36"
      Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9"
      Referer: "https://www.oneplusbbs.com/plugin-dsu_paulsign:sign.html"
      Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
      Cookie: "{{cookie}}"
