id: tccf
name: TorrentCCF
category: pt
icon: pt
summary: 模拟登录
description: '站点地址：https://et8.org/

  作用：模拟登录。

  来源：站点清单取自 PT-depiler（MIT 许可），规则按本项目模板生成。

  探活 2026-11-21：探活通过（NexusPHP 登录页）

  '
risk: high
version: 1.1.2
updatedAt: '2026-11-24'
allowedHosts:
- et8.org
fields:
- key: cookie
  label: Cookie
  type: password
  required: true
defaultTask: login
tasks:
- key: login
  name: 模拟登录
  type: login
  description: 访问首页确认 Cookie 仍有效；未登录会被重定向到登录页
  steps:
  - name: 检查登录态
    method: GET
    url: https://et8.org/
    headers:
      cookie: '{{cookie}}'
  check:
    notLogin:
    - takelogin.php
    - login.php?returnto
    - 你需要启用cookies
    success:
    - logout.php
    - 退出登录
    - 个人中心
    - 我的账户
    - 我的资料
    reward:
    - (?:魔力值|魔力)[^0-9]{0,12}([0-9,]+(?:\.[0-9]+)?)
