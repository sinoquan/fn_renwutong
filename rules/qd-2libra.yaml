id: qd-2libra
name: 2Libra每日任务
category: forum
icon: community
summary: 每日任务
description: |
  任务地址：https://2libra.com/api/users/info?fields=info%2Cexp%2Ccoins
  作用：调用该站点自己的任务接口完成每日任务。
risk: none
version: 1.0.0
updatedAt: 2026-11-20
allowedHosts: [2libra.com]
fields:
  - key: Authorization
    label: Authorization
    type: text
    required: false
  - key: Cookie
    label: Cookie
    type: password
    required: true
  - key: badgeId
    label: badgeId
    type: text
    required: false
steps:
  - name: 任务
    method: GET
    url: "https://2libra.com/api/users/info?fields=info%2Cexp%2Ccoins"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:147.0) Gecko/20100101 Firefox/147.0"
      Accept: "application/json, text/plain, */*"
      Accept-Language: "zh,zh-CN;q=0.9,en-US;q=0.8"
      Referer: "https://2libra.com/"
      Sec-GPC: "1"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Cookie: "{{Cookie}}"
      Authorization: "{{Authorization}}"
  - name: 任务
    method: POST
    url: "https://2libra.com/api/badges/equip"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:158.0) Gecko/20100101 Firefox/158.0"
      Accept: "application/json, text/plain, */*"
      Accept-Language: "zh,zh-CN;q=0.9,en-US;q=0.8"
      Content-Type: "application/json"
      Referer: "https://2libra.com/"
