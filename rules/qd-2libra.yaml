      Sec-GPC: "1"
      Sec-Fetch-Dest: "empty"
      Sec-Fetch-Mode: "cors"
      Sec-Fetch-Site: "same-origin"
      Authorization: "{{Authorization}}"
      Cookie: "{{Cookie}}"
      Priority: "u=0"
      Pragma: "no-cache"
      Cache-Control: "no-cache"
